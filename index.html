<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Apocalypse Cyber — Shadow Survivor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;color:#e9faff;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;background:#05070a}
#hud{position:fixed;left:12px;top:10px;z-index:5;font-size:13px;text-shadow:0 2px 4px #000}
.bar{width:150px;height:10px;border:1px solid #89f7ff;background:#10171c;margin-top:4px}.fill{height:100%;width:100%;background:#61e6ff}
#msg{position:fixed;left:50%;top:10%;transform:translateX(-50%);z-index:8;text-align:center;font-weight:bold;font-size:20px;text-shadow:0 3px 8px #000;pointer-events:none}
#controls{position:fixed;inset:auto 0 0 0;height:180px;z-index:10;pointer-events:none}
.btn{position:absolute;pointer-events:auto;width:68px;height:68px;border-radius:50%;border:1px solid #78efff;background:rgba(8,24,31,.62);color:#dffcff;font-weight:bold;font-size:12px;box-shadow:0 0 18px rgba(0,220,255,.18);user-select:none;-webkit-user-select:none}
.btn:active{background:rgba(35,105,120,.8);transform:scale(.96)}
#left{left:18px;bottom:32px}#right{left:94px;bottom:32px}
#jump{right:104px;bottom:84px}#blade{right:26px;bottom:84px}#dash{right:104px;bottom:8px}#camo{right:26px;bottom:8px}
#restart{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;padding:14px 24px;border-radius:12px;border:1px solid #78efff;background:#0b171d;color:#fff;font-size:16px}
@media(min-width:800px){#controls{height:145px}.btn{width:58px;height:58px}#jump{right:125px;bottom:70px}#blade{right:58px;bottom:70px}#dash{right:125px;bottom:6px}#camo{right:58px;bottom:6px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div>HP <span id="hpText">100</span></div><div class="bar"><div id="hpFill" class="fill"></div></div>
  <div>⚡ Dash: <span id="dashText">OK</span> · ◇ Camuflagem: <span id="camoText">OK</span></div>
  <div>🔪 Lâminas: <span id="ammoText">8</span></div>
</div>
<div id="msg"></div>
<button id="restart">REINICIAR</button>
<div id="controls">
  <button class="btn" id="left">◀</button><button class="btn" id="right">▶</button>
  <button class="btn" id="jump">PULO</button><button class="btn" id="blade">LÂMINA</button>
  <button class="btn" id="dash">DASH</button><button class="btn" id="camo">CAMO</button>
</div>
<script>
'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d');
const hpText=document.getElementById('hpText'),hpFill=document.getElementById('hpFill');
const dashText=document.getElementById('dashText'),camoText=document.getElementById('camoText'),ammoText=document.getElementById('ammoText');
const msg=document.getElementById('msg'),restart=document.getElementById('restart');
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)} addEventListener('resize',resize);resize();

const keys={left:false,right:false};
const input={jump:false,blade:false,dash:false,camo:false};
function bind(id,field){
 const el=document.getElementById(id);
 const on=e=>{e.preventDefault();input[field]=true};
 el.addEventListener('pointerdown',on); el.addEventListener('touchstart',on,{passive:false});
}
bind('jump','jump');bind('blade','blade');bind('dash','dash');bind('camo','camo');
function hold(id,field){
 const el=document.getElementById(id);
 const down=e=>{e.preventDefault();keys[field]=true}; const up=e=>{e.preventDefault();keys[field]=false};
 el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up);
}
hold('left','left');hold('right','right');
addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;if(['ArrowRight','d','D'].includes(e.key))keys.right=true;
if([' ','w','W','ArrowUp'].includes(e.key))input.jump=true;if(e.key==='j'||e.key==='J')input.blade=true;if(e.key==='k'||e.key==='K')input.dash=true;if(e.key==='l'||e.key==='L')input.camo=true});
addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false});

const levelW=6200;
const platforms=[
{x:0,y:520,w:900,h:70},{x:980,y:520,w:620,h:70},{x:1690,y:480,w:600,h:110},
{x:2370,y:520,w:720,h:70},{x:3180,y:455,w:450,h:135},{x:3720,y:520,w:800,h:70},
{x:4630,y:470,w:500,h:120},{x:5240,y:520,w:960,h:70},
{x:650,y:410,w:170,h:18},{x:1190,y:385,w:190,h:18},{x:1820,y:350,w:190,h:18},
{x:2520,y:380,w:190,h:18},{x:3330,y:320,w:180,h:18},{x:4050,y:380,w:190,h:18},
{x:4760,y:330,w:190,h:18},{x:5500,y:390,w:190,h:18}
];
const toxic=[{x:900,w:80},{x:1600,w:90},{x:2290,w:80},{x:3090,w:90},{x:3630,w:90},{x:4520,w:110},{x:5130,w:110}];
const saws=[{x:1110,y:475,r:25,min:1010,max:1500,t:0},{x:2780,y:475,r:24,min:2420,max:3000,t:2}];
const lasers=[{x:1510,y:455,w:5,h:65,on:true,t:0},{x:3610,y:455,w:5,h:65,on:true,t:1.4},{x:5120,y:455,w:5,h:65,on:true,t:2.5}];
const drones=[{x:1420,y:270,v:0},{x:3000,y:230,v:0},{x:4380,y:260,v:0},{x:5400,y:280,v:0}];
const raiders=[{x:1260,y:460,v:0,dir:-1,alive:true},{x:2020,y:420,v:0,dir:1,alive:true},{x:2850,y:460,v:0,dir:-1,alive:true},{x:3990,y:460,v:0,dir:1,alive:true},{x:4880,y:410,v:0,dir:-1,alive:true},{x:5700,y:460,v:0,dir:1,alive:true}];

let checkpoint={x:120,y:440}, player, projectiles=[],particles=[],dead=false,won=false;
function reset(){
 player={x:checkpoint.x,y:checkpoint.y,w:30,h:54,vx:0,vy:0,hp:100,dir:1,jumps:0,onGround:false,dash:0,dashTime:0,camo:0,bladeCd:0,inv:0};
 projectiles=[];particles=[];dead=false;won=false;msg.textContent='';restart.style.display='none';
 raiders.forEach((e,i)=>{e.alive=true;e.x=[1260,2020,2850,3990,4880,5700][i]});
}
reset(); restart.onclick=reset;

const gravity=1750, speed=310, jump=650;
function rects(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function groundAt(p){
 let best=null;
 for(const q of platforms) if(p.x+p.w>q.x+3&&p.x<q.x+q.w-3&&p.y+p.h<=q.y+18&&p.y+p.h>=q.y-30) if(!best||q.y<best.y)best=q;
 return best;
}
function hurt(n=100){
 if(player.inv>0||player.camo>0)return;
 player.hp-=n;player.inv=.8; burst(player.x+15,player.y+25,12);
 if(player.hp<=0)die();
}
function die(){dead=true;restart.style.display='block';msg.textContent='VOCÊ MORREU — tente novamente';}
function burst(x,y,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*260,vy:(Math.random()-.5)*260,life:.5+Math.random()*.5})}
function shoot(){if(player.bladeCd>0||player.camo>0)return;if(player.ammo<=0)player.ammo=8; player.ammo--;player.bladeCd=.28;projectiles.push({x:player.x+(player.dir>0?30:-8),y:player.y+22,w:18,h:5,vx:player.dir*720,life:1})}
player.ammo=8;
function dash(){if(player.dash>0||player.dashTime>0)return;player.dashTime=.20;player.dash=.9;player.inv=.25;player.vx=player.dir*950;burst(player.x+15,player.y+25,8)}
function toggleCamo(){if(player.camo>0||player.dashTime>0)return;player.camo=2.7}

let last=performance.now(),camX=0;
function update(dt){
 if(dead||won)return;
 player.inv=Math.max(0,player.inv-dt);player.dash=Math.max(0,player.dash-dt);player.camo=Math.max(0,player.camo-dt);
 player.bladeCd=Math.max(0,player.bladeCd-dt);
 if(input.blade){shoot();input.blade=false} if(input.dash){dash();input.dash=false} if(input.camo){toggleCamo();input.camo=false}
 if(input.jump){if(player.jumps<2){player.vy=-jump;player.jumps++;player.onGround=false}input.jump=false}
 if(player.dashTime>0){player.dashTime-=dt;player.vx=player.dir*950}else{
   const dir=(keys.right?1:0)-(keys.left?1:0); if(dir){player.dir=dir;player.vx += (dir*speed-player.vx)*Math.min(1,dt*10)} else player.vx*=Math.pow(.001,dt);
   player.vy+=gravity*dt;
 }
 const oldY=player.y;player.x+=player.vx*dt;player.y+=player.vy*dt;
 player.x=Math.max(0,Math.min(levelW-player.w,player.x));
 player.onGround=false;
 for(const q of platforms){
   if(player.x+player.w>q.x&&player.x<q.x+q.w&&oldY+player.h<=q.y&&player.y+player.h>=q.y&&player.vy>=0){player.y=q.y-player.h;player.vy=0;player.onGround=true;player.jumps=0}
 }
 if(player.y>720){hurt(999);return}
 for(const z of toxic) if(player.x+player.w>z.x&&player.x<z.x+z.w&&player.y+player.h>500) {hurt(999);return}
 for(const l of lasers){l.t+=dt; l.on=Math.sin(l.t*3)>-.25; if(l.on&&player.x<l.x+18&&player.x+player.w>l.x-18&&player.y+player.h>l.y&&player.y<l.y+l.h)hurt(999)}
 for(const s of saws){s.t+=dt;s.x=s.min+(Math.sin(s.t*1.7)*.5+.5)*(s.max-s.min);if((player.x+player.w/2-s.x)**2+(player.y+player.h/2-s.y)**2<(s.r+18)**2)hurt(999)}
 for(const e of raiders) if(e.alive){e.x+=e.dir*80*dt;if(e.x<e.x0||e.x>e.x1)e.dir*=-1;if(Math.abs(player.x-e.x)<270&&!player.camo){e.dir=player.x<e.x? -1:1;e.x+=e.dir*55*dt} if(rects(player,{x:e.x,y:e.y,w:32,h:50}))hurt(30)}
 for(const d of drones){d.v+=dt;d.x+=Math.sin(d.v*1.4)*25*dt;d.y+=Math.sin(d.v*2)*15*dt;if(Math.abs(player.x-d.x)<180&&!player.camo&&Math.abs(player.y-d.y)<120)hurt(20)}
 for(const p of projectiles){p.x+=p.vx*dt;p.life-=dt;for(const e of raiders)if(e.alive&&rects(p,{x:e.x,y:e.y,w:32,h:50})){e.alive=false;p.life=0;burst(e.x+16,e.y+20,14)}for(const d of drones)if(Math.abs(p.x-d.x)<25&&Math.abs(p.y-d.y)<30){p.life=0}}
 projectiles=projectiles.filter(p=>p.life>0&&p.x>-100&&p.x<levelW+100);
 for(const a of particles){a.x+=a.vx*dt;a.y+=a.vy*dt;a.life-=dt}particles=particles.filter(a=>a.life>0);
 if(player.x>600&&player.x<800&&player.y<430)checkpoint={x:650,y:355};
 if(player.x>6050){won=true;msg.textContent='ÁREA CONCLUÍDA — sobrevivente!';restart.style.display='block'}
 camX=Math.max(0,Math.min(levelW-W,player.x-W*.35));
 hpText.textContent=Math.max(0,Math.ceil(player.hp));hpFill.style.width=Math.max(0,player.hp)+'%';
 dashText.textContent=player.dash>0?player.dash.toFixed(1)+'s':'OK';camoText.textContent=player.camo>0?player.camo.toFixed(1)+'s':'OK';ammoText.textContent=player.ammo;
}
function draw(){
 ctx.clearRect(0,0,W,H);
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#071019');g.addColorStop(1,'#050608');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // 4-layer parallax
 const layers=[{f:.08,c:'#101b24',n:18},{f:.16,c:'#0c151c',n:25},{f:.28,c:'#0a1117',n:35},{f:.48,c:'#081016',n:45}];
 for(let li=0;li<layers.length;li++){const L=layers[li];ctx.fillStyle=L.c;for(let i=0;i<L.n;i++){let x=((i*173)-camX*L.f)% (W+220)-80;let h=50+(i*37)%150;ctx.fillRect(x,H-170-h,70,h);if(i%3===0){ctx.fillStyle='#18313a';ctx.fillRect(x+12,H-150-h,7,12);ctx.fillStyle=L.c}}}
 ctx.save();ctx.translate(-camX,0);
 // toxic
 for(const z of toxic){ctx.fillStyle='#1b493e';ctx.fillRect(z.x,520,z.w,70);ctx.strokeStyle='#54d9a2';ctx.beginPath();for(let x=z.x;x<z.x+z.w;x+=12)ctx.lineTo(x,510+Math.sin(x*.1)*5);ctx.stroke()}
 // platforms
 for(const q of platforms){ctx.fillStyle='#12191e';ctx.fillRect(q.x,q.y,q.w,q.h);ctx.fillStyle='#29424b';ctx.fillRect(q.x,q.y,q.w,4)}
 // lasers
 for(const l of lasers){if(l.on){ctx.fillStyle='#eaffff';ctx.fillRect(l.x-2,l.y,4,l.h);ctx.fillStyle='rgba(70,240,255,.18)';ctx.fillRect(l.x-12,l.y,24,l.h)}}
 // saws
 for(const s of saws){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.t*5);ctx.fillStyle='#b8c5c8';ctx.beginPath();for(let i=0;i<20;i++){let a=i*Math.PI/10,r=i%2?s.r*.72:s.r;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.fillStyle='#263239';ctx.beginPath();ctx.arc(0,0,8,0,7);ctx.fill();ctx.restore()}
 // enemies
 for(const e of raiders)if(e.alive){ctx.fillStyle='#050505';ctx.fillRect(e.x,e.y,32,50);ctx.fillStyle='#79efff';ctx.fillRect(e.x+(e.dir>0?22:5),e.y+12,5,3)}
 for(const d of drones){ctx.fillStyle='#050505';ctx.beginPath();ctx.arc(d.x,d.y,23,0,7);ctx.fill();ctx.fillStyle='#70efff';ctx.fillRect(d.x-9,d.y-2,18,4)}
 // player
 ctx.globalAlpha=player.camo>0?.28:1;ctx.fillStyle='#020304';ctx.fillRect(player.x,player.y,player.w,player.h);ctx.fillStyle='#a9faff';ctx.fillRect(player.x+(player.dir>0?22:4),player.y+12,4,4);ctx.fillRect(player.x+5,player.y+46,8,4);ctx.globalAlpha=1;
 // dash trail
 if(player.dashTime>0){ctx.fillStyle='rgba(100,240,255,.35)';ctx.fillRect(player.x-player.dir*50,player.y+8,50,30)}
 // projectiles
 for(const p of projectiles){ctx.fillStyle='#b9fbff';ctx.fillRect(p.x,p.y,p.w,p.h)}
 for(const a of particles){ctx.globalAlpha=Math.max(0,a.life*2);ctx.fillStyle='#77f4ff';ctx.fillRect(a.x,a.y,3,3);ctx.globalAlpha=1}
 // exit
 ctx.strokeStyle='#6cf3ff';ctx.strokeRect(6050,420,90,100);ctx.fillStyle='#6cf3ff';ctx.fillRect(6070,440,50,60);
 ctx.restore();
 // vignette
 const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.7);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.5)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
