<style>
*{
    box-sizing:border-box;

html,body{
    margin:0;

#game{

}

canvas{

}

/* ROTAÇÃO */

#rotate{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:#050505;
    color:white;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
}

@media (orientation:portrait){
    #rotate{display:flex}
}

#rotate .icon{
    font-size:70px;
    animation:spin 2s infinite ease-in-out;
}

@keyframes spin{
    50%{transform:rotate(90deg)}
}

/* HUD */

#hud{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
}

.panel{
    background:linear-gradient(90deg,rgba(0,0,0,.88),rgba(0,0,0,.45));
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(8px);
    box-shadow:0 5px 25px #000;
}

#story{
    position:absolute;
    left:16px;
    top:16px;
    padding:12px 16px;
    max-width:320px;
    border-left:4px solid #842323;
}

.small{
    font-size:8px;
    letter-spacing:3px;

}

#chapter{
    color:#fff;
    font-weight:bold;
    letter-spacing:1px;
    margin-top:5px;

}

#objective{
    position:absolute;
    left:50%;
    top:15px;
    transform:translateX(-50%);
    padding:10px 20px;
    color:#ddd;
    font-size:10px;
    letter-spacing:2px;
    text-align:center;
}

#stats{
    position:absolute;
    right:16px;
    top:16px;
    width:190px;
    display:flex;
    flex-direction:column;
    gap:6px;
}

.stat{
    padding:7px 10px;
    background:rgba(0,0,0,.65);
}

.stat span{
    font-size:8px;
    letter-spacing:2px;
    color:#aaa;
}

.bar{
    height:6px;
    margin-top:5px;
    background:#111;
    overflow:hidden;
}

.fill{
    height:100%;
    transition:width .15s;
}

#healthFill{background:#cf2424}
#staminaFill{background:#37aee9}
#batteryFill{background:#f2ce37}

/* MENSAGENS */

#message{
    position:absolute;
    left:50%;
    top:42%;
    transform:translate(-50%,-50%) scale(.9);
    width:80%;
    text-align:center;
    color:#fff;
    font-size:clamp(15px,2vw,25px);
    font-weight:bold;
    letter-spacing:2px;
    text-shadow:0 4px 10px #000;
    opacity:0;
    transition:.3s;
}

#message.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

/* CONTROLES */

#controls{
    position:fixed;
    inset:0;
    z-index:30;
    pointer-events:none;
}

#joyArea{
    position:absolute;
    left:20px;
    bottom:20px;
    width:150px;
    height:150px;
    pointer-events:auto;
}

#joyBase{
    position:absolute;
    left:10px;
    top:10px;
    width:130px;
    height:130px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(120,120,120,.18),rgba(0,0,0,.8));

#joy{

}

#buttons{

.btn{

}

.btn:active,.btn.active{

}

#interact{width:68px;height:68px;border-color:#d6b632}
#crouch{width:60px;height:60px;border-color:#3f8fc4}
#run{width:78px;height:78px;border-color:#a63434}

#startScreen{

/* =========================================================
   MUNDO E ANDARES
========================================================= */

const colliders=[];
const floors=[];

function floorLevel(y){
    const mesh=new THREE.Mesh(
        new THREE.PlaneGeometry(70,58),
        new THREE.MeshStandardMaterial({
            color:0x22272a,
            roughness:.92
        })
    );

    mesh.rotation.x=-Math.PI/2;
    mesh.position.y=y;
    mesh.receiveShadow=true;
    scene.add(mesh);
    floors.push(mesh);

    const grid=new THREE.GridHelper(
        70,35,0x30383d,0x1a1f22
    );

    grid.position.y=y+.01;
    grid.material.opacity=.16;
    grid.material.transparent=true;
    scene.add(grid);
}

floorLevel(0);
floorLevel(7);

/* =========================================================
   PAREDES COM COLISÃO
========================================================= */

function wall(x,y,z,w,h,d){

    const mesh=new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        new THREE.MeshStandardMaterial({
            color:0x363c40,
            roughness:.88
        })
    );

    mesh.position.set(x,y+h/2,z);
    mesh.castShadow=true;
    mesh.receiveShadow=true;
    scene.add(mesh);

    colliders.push({
        minX:x-w/2,
        maxX:x+w/2,
        minZ:z-d/2,
        maxZ:z+d/2,
        minY:y,
        maxY:y+h
    });

    /* acabamento */

    const top=new THREE.Mesh(
        new THREE.BoxGeometry(w+.1,.15,d+.1),
        new THREE.MeshStandardMaterial({
            color:0x626a6e,
            roughness:.7
        })
    );

    top.position.set(x,y+h+.07,z);
    scene.add(top);

    return mesh;
}

/* ESTRUTURA EXTERNA - ANDAR 1 */

wall(0,0,-28,70,6,1);
wall(0,0,28,70,6,1);

wall(34,0,0,1,6,56);

wall(-18,0,-16,26,6,.7);
wall(-8,0,-7,.7,6,18);

secondWall(0,-28,70,1);

secondWall(20,12,.7,25);
secondWall(5,18,28,.7);
secondWall(-18,8,25,.7);

/* =========================================================
   COLISÃO CILÍNDRICA
========================================================= */

function blocked(position,radius=.55){

    for(const c of colliders){

        if(
            position.y+1<c.minY ||
            position.y>c.maxY
        ) continue;

        const x=Math.max(
            c.minX,
            Math.min(position.x,c.maxX)
        );

        const z=Math.max(
            c.minZ,
            Math.min(position.z,c.maxZ)
        );

        const dx=position.x-x;
        const dz=position.z-z;

        if(dx*dx+dz*dz<radius*radius)
            return true;
    }

    return false;
}

/* =========================================================
   MÓVEIS
========================================================= */

const furniture=[];
const hidingPlaces=[];

function box(x,y,z,w,h,d,color,collision=true){

    const mesh=new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        new THREE.MeshStandardMaterial({
            color,
            roughness:.8
        })
    );

    mesh.position.set(x,y,z);
    mesh.castShadow=true;
    mesh.receiveShadow=true;
    scene.add(mesh);

    if(collision){
        const c={
            minX:x-w/2,
            maxX:x+w/2,
            minZ:z-d/2,
            maxZ:z+d/2,
            minY:y-h/2,
            maxY:y+h/2
        };

        colliders.push(c);
        furniture.push(mesh);
    }

    return mesh;
}

/* MESAS */

function table(x,y,z){

    const group=new THREE.Group();

    const top=new THREE.Mesh(
        new THREE.BoxGeometry(3.5,.25,2),
        new THREE.MeshStandardMaterial({
            color:0x4e3829,
            roughness:.7
        })
    );

    top.position.y=1.6;
    group.add(top);

    for(const sx of [-1.45,1.45]){
        for(const sz of [-.75,.75]){
            const leg=new THREE.Mesh(
                new THREE.BoxGeometry(.18,1.6,.18),
                new THREE.MeshStandardMaterial({
                    color:0x252525
                })
            );

            leg.position.set(sx,.8,sz);
            group.add(leg);
        }
    }

    group.position.set(x,y,z);

    group.traverse(o=>{
        if(o.isMesh){
            o.castShadow=true;
            o.receiveShadow=true;
        }
    });

    scene.add(group);

    /* colisão da mesa */

    colliders.push({
        minX:x-1.75,
        maxX:x+1.75,
        minZ:z-1,
        maxZ:z+1,
        minY:y,
        maxY:y+1.8
    });

    hidingPlaces.push({
        type:"table",
        position:new THREE.Vector3(x,y,z),
        radius:2
    });
}

table(-21,0,-21);
table(13,0,-21);
table(27,0,8);
table(-19,0,15);
table(12,7,17);

/* ARMÁRIOS PARA ESCONDER */

function locker(x,y,z){

    const group=new THREE.Group();

    const body=new THREE.Mesh(
        new THREE.BoxGeometry(2.1,4.5,1.4),
        new THREE.MeshStandardMaterial({
            color:0x374146,
            roughness:.8
        })
    );

    body.position.y=2.25;
    group.add(body);

    const door=new THREE.Mesh(
        new THREE.BoxGeometry(1.85,4.1,.08),
        new THREE.MeshStandardMaterial({
            color:0x4c585e,
            roughness:.7
        })
    );

    door.position.set(0,2.25,-.72);
    group.add(door);

    group.position.set(x,y,z);

    group.traverse(o=>{
        if(o.isMesh)o.castShadow=true;
    });

    scene.add(group);

    colliders.push({
        minX:x-1.05,
        maxX:x+1.05,
        minZ:z-.7,
        maxZ:z+.7,
        minY:y,
        maxY:y+4.5
    });

    hidingPlaces.push({
        type:"locker",
        position:new THREE.Vector3(x,y,z),
        radius:2.3
    });
}

locker(-29,0,-5);
locker(28,0,-3);
locker(-23,0,19);
locker(24,7,20);

/* OUTROS DETALHES */

box(-30,2,-20,2,4,1.5,0x343b3f);
box(28,2,17,2,4,1.4,0x30383c);
box(-14,1,17,2,2,2,0x65472d);

   ESCADAS

scene.add(player);

/* cabelo */

const rightLeg=limb(0x203875,.27,.9);

/* =========================================================

const flashlightModel=new THREE.Group();

/* =========================================================
   SISTEMA DO JOGADOR
========================================================= */

const playerState={
    health:100,
    stamina:100,
    battery:100,
    crouching:false,
    hidden:false,
    hiding:null,
    flashlight:true,
    floor:0,
    velocity:new THREE.Vector3(),
    walkTime:0,
    noise:0
};

const input={
    x:0,
    y:0,
    running:false
};

function movePlayer(delta){

    if(playerState.hidden) return;

    const direction=new THREE.Vector3(
        input.x,
        0,
        input.y
    );

    if(direction.length()>1)
        direction.normalize();

    const moving=direction.length()>.05;

    let running=
        input.running &&
        !playerState.crouching &&
        playerState.stamina>1;

    let speed=3.8;

    if(playerState.crouching)
        speed=1.7;

    if(running)
        speed=6.5;

    const target=direction.multiplyScalar(speed);

    playerState.velocity.x+=
        (target.x-playerState.velocity.x)*
        Math.min(delta*9,1);

    playerState.velocity.z+=
        (target.z-playerState.velocity.z)*
        Math.min(delta*9,1);

    if(!moving){
        playerState.velocity.x*=.72;
        playerState.velocity.z*=.72;
    }

    const next=player.position.clone();

    next.x+=playerState.velocity.x*delta;

    if(!blocked(next,.58))
        player.position.x=next.x;
    else
        playerState.velocity.x=0;

    next.copy(player.position);
    next.z+=playerState.velocity.z*delta;

    if(!blocked(next,.58))
        player.position.z=next.z;
    else
        playerState.velocity.z=0;

    if(moving){

        const targetAngle=Math.atan2(
            direction.x,
            direction.z
        );

        let diff=targetAngle-player.rotation.y;

        diff=Math.atan2(
            Math.sin(diff),
            Math.cos(diff)
        );

        player.rotation.y+=
            diff*Math.min(delta*10,1);

        playerState.walkTime+=
            delta*(running?13:playerState.crouching?5:8);

        const swing=Math.sin(playerState.walkTime)*
            (running?.6:.38);

        leftLeg.rotation.x=swing;
        rightLeg.rotation.x=-swing;
        leftArm.rotation.x=-swing*.75;
        rightArm.rotation.x=swing*.75;

        player.position.y=
            playerState.floor+
            Math.abs(Math.sin(playerState.walkTime))*.05;

    }else{

        leftLeg.rotation.x*=.75;
        rightLeg.rotation.x*=.75;
        leftArm.rotation.x*=.75;
        rightArm.rotation.x*=.75;
    }

    if(playerState.crouching){
        player.scale.y=.68;
        playerState.noise=.15;
    }else{
        player.scale.y=1;
        playerState.noise=running?1:.4;
    }

    if(running)
        playerState.stamina-=24*delta;
    else
        playerState.stamina+=17*delta;

    playerState.stamina=THREE.MathUtils.clamp(
        playerState.stamina,0,100
    );
}

/* =========================================================
   SISTEMA DE ESCONDER
========================================================= */

function nearestHidingPlace(){

    let closest=null;
    let distance=Infinity;

    for(const place of hidingPlaces){

        const d=player.position.distanceTo(
            place.position
        );

        if(d<place.radius && d<distance){
            closest=place;
            distance=d;
        }
    }

    return closest;
}

function toggleHide(){

    if(playerState.hidden){

        playerState.hidden=false;
        player.visible=true;
        playerState.hiding=null;

        showMessage("VOCÊ SAIU DO ESCONDERIJO.");

        return;
    }

    const place=nearestHidingPlace();

    if(!place){
        showMessage("NÃO HÁ UM ESCONDERIJO PRÓXIMO.");
        return;
    }

    playerState.hidden=true;
    playerState.hiding=place;

    /*
    Dentro do armário o personagem
    não fica visível para a IA.
    */

    player.visible=false;

    showMessage(
        place.type==="locker"
        ?"VOCÊ ESTÁ ESCONDIDO NO ARMÁRIO."
        :"VOCÊ ESTÁ ESCONDIDO SOB A MESA."
    );
}

/* =========================================================
   LINHA DE VISÃO
========================================================= */

/*
A criatura não pode enxergar através
das paredes.

Um Raycaster percorre o espaço entre
o monstro e o jogador e verifica
se existe uma parede no caminho.
*/

const visionRaycaster=new THREE.Raycaster();

function monsterCanSeePlayer(monster){

    if(playerState.hidden)
        return false;

    const from=monster.position.clone();
    from.y+=2.2;

    const to=player.position.clone();
    to.y+=1.8;

    const direction=to.clone().sub(from);
    const distance=direction.length();

    if(distance>monster.viewDistance)
        return false;

    direction.normalize();

    /*
    Campo de visão.
    */

    const forward=new THREE.Vector3(0,0,-1)
        .applyQuaternion(monster.quaternion)
        .normalize();

    const angle=forward.angleTo(direction);

    if(angle>monster.viewAngle/2)
        return false;

    visionRaycaster.set(from,direction);

    const intersections=
        visionRaycaster.intersectObjects(
            monster.visionWalls,
            false
        );

    if(
        intersections.length>0 &&
        intersections[0].distance<distance
    ){
        return false;
    }

    return true;
}

const monsterState={
    active:false,
    mode:"PATROL",
    lastKnownPosition:new THREE.Vector3(),
    searchTimer:0,
    attackTimer:0,
    viewDistance:22,
    viewAngle:Math.PI*.72,
    visionWalls:[],
    patrol:[
        new THREE.Vector3(25,0,20),
        new THREE.Vector3(12,0,5),
        new THREE.Vector3(28,0,-5)
    ],
    patrolIndex:0
};

monsterState.visionWalls=scene.children.filter(
    o=>o.isMesh && o.geometry &&
    o.geometry.type==="BoxGeometry"
);

function activateMonster(){

    if(monsterState.active) return;

    monsterState.active=true;
    monster.visible=true;
    monsterState.mode="PATROL";

    showMessage("VOCÊ OUVIU ALGUMA COISA NO CORREDOR...");
}

function moveMonsterTowards(target,speed,delta){

    const horizontal=new THREE.Vector3(
        target.x-monster.position.x,
        0,
        target.z-monster.position.z
    );

    const distance=horizontal.length();

    if(distance<.3)
        return true;

    horizontal.normalize();

    monster.lookAt(
        target.x,
        monster.position.y,
        target.z
    );

    const next=monster.position.clone();

    next.x+=horizontal.x*speed*delta;

    /*
    A mesma lógica de colisão impede
    o monstro de atravessar paredes.
    */

    if(!blocked(next,.75))
        monster.position.x=next.x;

    next.copy(monster.position);
    next.z+=horizontal.z*speed*delta;

    if(!blocked(next,.75))
        monster.position.z=next.z;

    return false;
}

function updateMonster(delta,time){

    if(!monsterState.active) return;

    const canSee=monsterCanSeePlayer(monster);

    if(canSee){

        monsterState.mode="CHASE";

        monsterState.lastKnownPosition.copy(
            player.position
        );

        monsterState.searchTimer=8;

    }else if(
        playerState.noise>.7 &&
        monster.position.distanceTo(player.position)<18 &&
        !playerState.hidden
    ){

        monsterState.lastKnownPosition.copy(
            player.position
        );

        if(monsterState.mode!=="CHASE")
            monsterState.mode="INVESTIGATE";
    }

    if(monsterState.mode==="PATROL"){

        const target=
            monsterState.patrol[
                monsterState.patrolIndex
            ];

        if(moveMonsterTowards(target,2.2,delta)){

            monsterState.patrolIndex=
                (monsterState.patrolIndex+1)%
                monsterState.patrol.length;
        }
    }

    if(monsterState.mode==="INVESTIGATE"){

        if(
            moveMonsterTowards(
                monsterState.lastKnownPosition,
                3.1,
                delta
            )
        ){

            monsterState.mode="SEARCH";
            monsterState.searchTimer=7;
        }
    }

    if(monsterState.mode==="CHASE"){

        moveMonsterTowards(
            player.position,
            5.3,
            delta
        );

        if(!canSee){

            monsterState.searchTimer-=delta;

            if(monsterState.searchTimer<=0)
                monsterState.mode="SEARCH";
        }
    }

    if(monsterState.mode==="SEARCH"){

        monsterState.searchTimer-=delta;

        /*
        Movimento de procura ao redor
        da última posição conhecida.
        */

        const searchPoint=
            monsterState.lastKnownPosition.clone();

        searchPoint.x+=
            Math.sin(time*1.2)*3;

        searchPoint.z+=
            Math.cos(time*.9)*3;

        moveMonsterTowards(
            searchPoint,
            2.8,
            delta
        );

        if(monsterState.searchTimer<=0)
            monsterState.mode="PATROL";
    }

    /*
    Ataque somente quando há contato
    físico próximo.
    */

    const distance=
        monster.position.distanceTo(player.position);

    if(
        distance<1.8 &&
        !playerState.hidden
    ){
        attackPlayer();
    }

    monster.position.y=
        playerState.floor+
        Math.sin(time*5)*.05;
}

/* =========================================================
   COMBATE / ATAQUE
========================================================= */

function attackPlayer(){

    const now=performance.now();

    if(now-monsterState.attackTimer<1100)
        return;

    monsterState.attackTimer=now;

    playerState.health-=15;

    const damage=document.getElementById("damage");
    damage.style.opacity=.9;

    setTimeout(
        ()=>damage.style.opacity=0,
        160
    );

    if(navigator.vibrate)
        navigator.vibrate([80,40,100]);

    if(playerState.health<=0){

        playerState.health=0;
        gameOver();
    }
}

/*
A lanterna não mata o monstro.
Mas quando muito próxima, pode
atordoá-lo por alguns segundos.
*/

let monsterStunnedUntil=0;

function useFlashDefense(){

    if(!monsterState.active)
        return;

    const distance=
        player.position.distanceTo(monster.position);

    if(distance<8 && playerState.flashlight){

        monsterStunnedUntil=
            performance.now()+1800;

        monsterState.mode="SEARCH";

        monsterState.searchTimer=3;

        showMessage("A CRIATURA RECUOU!");
    }
}

   PUZZLES E HISTÓRIA
========================================================= */

const storyState={
    power:false,
    securityCard:false,
    secondFloorUnlocked:false,
    documents:0
};

/* GERADOR */

const generator=new THREE.Group();

const generatorBody=new THREE.Mesh(
    new THREE.BoxGeometry(3,3,1.5),
    new THREE.MeshStandardMaterial({
        color:0x273035,
        roughness:.7
    })
);

generatorBody.position.y=1.5;
generator.add(generatorBody);

const generatorLight=new THREE.PointLight(
    0xff0000,
    1,
    5
);

generatorLight.position.set(0,2,-1);
generator.add(generatorLight);

generator.position.set(27,0,19);
scene.add(generator);

function nearObject(object,distance=3){

    return player.position.distanceTo(
        object.position
    )<distance;
}

function interact(){

    if(playerState.hidden){
        toggleHide();
        return;
    }

    const hiding=nearestHidingPlace();

    if(hiding){
        toggleHide();
        return;
    }

    if(nearObject(generator)){

        if(!storyState.power){

            storyState.power=true;

            generatorLight.color.set(0x00ff88);

            showMessage(
                "A ENERGIA DE EMERGÊNCIA FOI RESTAURADA."
            );

            document.getElementById("objective")
                .textContent=
                "ENCONTRE O CARTÃO DE ACESSO.";

            activateMonster();

            return;
        }
    }

    /*
    Defesa usando a lanterna
    quando o monstro está próximo.
    */

    if(
        monsterState.active &&
        player.position.distanceTo(monster.position)<8
    ){
        useFlashDefense();
        return;
    }

    showMessage("NADA PARA INTERAGIR AQUI.");
}

/* =========================================================
   DOCUMENTOS DA HISTÓRIA
========================================================= */

function documentItem(x,y,z,text){

    const paper=new THREE.Mesh(
        new THREE.BoxGeometry(1,.08,.7),
        new THREE.MeshStandardMaterial({
            color:0xd6c9a7,
            emissive:0x554b2d,
            emissiveIntensity:.25
        })
    );

    paper.position.set(x,y,z);
    scene.add(paper);

    return {

        text,
        collected:false
    };
}

const documents=[

    ),

    documentItem(

    ),

];

function updateDocuments(){

    for(const doc of documents){

        if(doc.collected) continue;

        if(
            player.position.distanceTo(
                doc.mesh.position

            doc.collected=true;
            doc.mesh.visible=false;

/* =========================================================
   ESCADAS
========================================================= */

function updateFloor(){

    /*
    Transição entre os andares.
    A câmera acompanha automaticamente.
    */

    const nearStairs=
        Math.hypot(
            player.position.x-stairZone.x,
            player.position.z-stairZone.z
        )<5;

    if(
        nearStairs &&
        player.position.z<18 &&
        playerState.floor===0
    ){

        playerState.floor=7;
        player.position.y=7;

        showMessage(
            "VOCÊ SUBIU PARA O SEGUNDO ANDAR."
        );
    }

    /*
    Retorno simplificado.
    */

    if(
        playerState.floor===7 &&
        player.position.z>21
    ){

        playerState.floor=0;
        player.position.y=0;
    }
}

/* =========================================================
   LANTERNA
========================================================= */

function updateFlashlight(delta){

    if(playerState.flashlight){

        playerState.battery-=.25*delta;

        if(playerState.battery<=0){

            playerState.battery=0;
            playerState.flashlight=false;

            showMessage("A BATERIA DA LANTERNA ACABOU.");
        }
    }

    const forward=new THREE.Vector3(0,0,1)
        .applyQuaternion(player.quaternion);

    const position=player.position.clone();

    position.y+=2.3;

    position.add(
        forward.clone().multiplyScalar(.6)
    );

    flashlightLight.position.copy(position);

    const target=player.position.clone();

    target.y=0;

    target.add(
        forward.multiplyScalar(15)
    );

    lightTarget.position.copy(target);

    flashlightLight.intensity=
        playerState.flashlight
        ?(playerState.battery<20
            ?5+Math.sin(performance.now()/60)*1.2
            :9)
        :0;

    playerGlow.position.copy(player.position);
    playerGlow.position.y+=2;

    playerGlow.intensity=
        playerState.flashlight?1.5:.35;

    flashlightModel.rotation.z=
        Math.sin(playerState.walkTime)*.08;
}

/* =========================================================
   CÂMERA
========================================================= */

function updateCamera(delta){

    const desired=new THREE.Vector3(
        player.position.x,
        player.position.y+23,
        player.position.z+14
    );

    camera.position.lerp(
        desired,
        Math.min(delta*4,1)
    );

    const look=player.position.clone();
    look.y=player.position.y;

    camera.lookAt(look);
}

/* =========================================================
   JOYSTICK
========================================================= */

const joyArea=document.getElementById("joyArea");
const joy=document.getElementById("joy");

let activePointer=null;
const joyRadius=40;

function resetJoy(){

    activePointer=null;
    input.x=0;
    input.y=0;

    joy.style.transform="translate(0,0)";
}

function updateJoy(x,y){

    const rect=joyArea.getBoundingClientRect();

    let dx=x-rect.left-75;
    let dy=y-rect.top-75;

    const length=Math.hypot(dx,dy);

    if(length>joyRadius){

        dx=dx/length*joyRadius;
        dy=dy/length*joyRadius;
    }

    input.x=dx/joyRadius;
    input.y=dy/joyRadius;

    joy.style.transform=
        `translate(${dx}px,${dy}px)`;
}

joyArea.addEventListener("pointerdown",e=>{
    activePointer=e.pointerId;
    joyArea.setPointerCapture(e.pointerId);
    updateJoy(e.clientX,e.clientY);
});

joyArea.addEventListener("pointermove",e=>{
    if(e.pointerId===activePointer)
        updateJoy(e.clientX,e.clientY);
});

joyArea.addEventListener("pointerup",resetJoy);
joyArea.addEventListener("pointercancel",resetJoy);

runButton.addEventListener("pointerdown",()=>{

/* =========================================================
   TECLADO PARA TESTE
========================================================= */

const keys={};

addEventListener("keydown",e=>{
    keys[e.key]=true;
    keyboardInput();
});

addEventListener("keyup",e=>{
    keys[e.key]=false;
    keyboardInput();
});

function keyboardInput(){

    input.x=
        (keys.d||keys.ArrowRight?1:0)-
        (keys.a||keys.ArrowLeft?1:0);

    input.y=
        (keys.s||keys.ArrowDown?1:0)-
        (keys.w||keys.ArrowUp?1:0);

    input.running=!!keys.Shift;
}

/* =========================================================
   ESTADO DO JOGO
========================================================= */

let running=false;
let monsterSpawnTimer=0;

function gameOver(){

    running=false;

    showMessage("A CRIATURA ENCONTROU VOCÊ.");

    setTimeout(()=>{
        document.getElementById("startScreen")
            .style.display="flex";

        document.getElementById("title")
            .textContent="VOCÊ MORREU";

        document.getElementById("subtitle")
            .textContent="O PRÉDIO AINDA NÃO TERMINOU COM VOCÊ.";

        document.getElementById("startButton")
            .textContent="TENTAR NOVAMENTE";
    },2000);
}

/* =========================================================
   TELA CHEIA
========================================================= */

async function enterFullscreen(){

    try{
        if(document.documentElement.requestFullscreen)
            await document.documentElement.requestFullscreen();
    }catch(e){}

    window.scrollTo(0,1);
}

/* =========================================================
   INÍCIO
========================================================= */

let firstStart=true;

document.getElementById("startButton")
.addEventListener("click",async()=>{

    if(!firstStart){
        location.reload();
        return;
    }

    await enterFullscreen();

    document.getElementById("startScreen")
        .style.display="none";

    firstStart=false;
    running=true;

    showMessage(
        "VOCÊ ACORDOU NA RECEPÇÃO. ALGUÉM ESTÁ AQUI."
    );
});

/* =========================================================
   RESIZE
========================================================= */

addEventListener("resize",()=>{

    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
});

/* =========================================================
   LOOP PRINCIPAL
========================================================= */

function animate(){

    requestAnimationFrame(animate);

    const delta=Math.min(
        clock.getDelta(),
        .05
    );

    const time=clock.elapsedTime;

    if(running){

        movePlayer(delta);

        updateFloor();

        updateFlashlight(delta);

        updateDocuments();

        updateHUD();

        /*
        O monstro só aparece depois
        que a energia é restaurada.
        */

        if(storyState.power)
            updateMonster(delta,time);

        /*
        Se o monstro estiver
        temporariamente atordoado,
        ele não se move.
        */

        if(
            monsterState.active &&
            performance.now()<monsterStunnedUntil
        ){
            monsterState.mode="SEARCH";
        }

        updateCamera(delta);
    }

    renderer.render(scene,camera);
}

camera.position.set(-27,23,-8);
camera.lookAt(player.position);

animate();
