<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    touch-action:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    background:#050606;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

/* =====================================================
   TELA DE ROTAÇÃO
===================================================== */

#rotate{
    display:none;
    position:fixed;
    inset:0;
    z-index:10000;
    background:#050505;
    color:white;
    text-align:center;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

@media (orientation:portrait){
    #rotate{
        display:flex;
    }
}

#rotate .phone{
    font-size:65px;
    margin-bottom:20px;
    animation:rotatePhone 2s infinite;
}

@keyframes rotatePhone{
    50%{transform:rotate(90deg)}
}

/* =====================================================
   MENU INICIAL
===================================================== */

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    background:
        radial-gradient(circle at center,rgba(45,52,55,.65),#020303 70%);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
}

.menuContent{
    text-align:center;
    padding:30px;
}

.logo{
    font-size:clamp(48px,10vw,100px);
    font-weight:900;
    letter-spacing:12px;
    text-shadow:
        0 0 20px rgba(255,255,255,.15),
        0 8px 0 #111,
        0 20px 40px #000;
}

.chapterText{
    color:#aaa;
    font-size:11px;
    letter-spacing:5px;
    margin-top:12px;
}

#play{
    margin-top:38px;
    padding:18px 60px;
    border:1px solid #555;
    color:white;
    font-weight:bold;
    letter-spacing:4px;
    background:linear-gradient(#333,#111);
    border-radius:4px;
    box-shadow:0 10px 35px #000;
}

/* =====================================================
   HUD
===================================================== */

#hud{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
}

.hudPanel{
    background:linear-gradient(
        90deg,
        rgba(0,0,0,.88),
        rgba(0,0,0,.42)
    );

    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(6px);
}

#mission{
    position:absolute;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    padding:10px 22px;
    color:#ddd;
    font-size:10px;
    letter-spacing:2px;
    text-align:center;
}

#topLeft{
    position:absolute;
    top:15px;
    left:15px;
    padding:10px 14px;
    border-left:3px solid #7d1f1f;
}

#topLeft small{
    color:#777;
    letter-spacing:3px;
    font-size:8px;
}

#topLeft strong{
    display:block;
    margin-top:5px;
    font-size:15px;
    letter-spacing:1px;
}

#bars{
    position:absolute;
    right:15px;
    top:15px;
    width:180px;
}

.stat{
    background:rgba(0,0,0,.7);
    padding:6px 9px;
    margin-bottom:5px;
}

.stat label{
    font-size:8px;
    color:#aaa;
    letter-spacing:2px;
}

.bar{
    width:100%;
    height:5px;
    background:#111;
    margin-top:4px;
    overflow:hidden;
}

.fill{
    height:100%;
    transition:width .2s;
}

#health{
    background:#c52c2c;
}

#energy{
    background:#2c9bd1;
}

#battery{
    background:#e0c23d;
}

#message{
    position:absolute;
    top:43%;
    left:50%;
    width:80%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    font-size:clamp(14px,2vw,23px);
    font-weight:bold;
    letter-spacing:2px;
    text-shadow:0 3px 10px black;
    opacity:0;
    transition:.25s;
}

#message.show{
    opacity:1;
}

/* =====================================================
   CONTROLES
===================================================== */

#controls{
    position:fixed;
    inset:0;
    z-index:40;
    pointer-events:none;
}

/* JOYSTICK */

#joystickArea{
    position:absolute;
    left:20px;
    bottom:18px;
    width:150px;
    height:150px;
    pointer-events:auto;
}

#joystickBase{
    position:absolute;
    inset:10px;
    border-radius:50%;

            circle,

    border:2px solid rgba(255,255,255,.12);

        inset 0 0 30px #000,

}

#joystick{
    position:absolute;
    width:60px;
    height:60px;
    left:45px;
    top:45px;
    border-radius:50%;
    background:
        radial-gradient(
            circle at 30% 25%,
            #999,
            #353535 65%,
            #111
        );

    border:2px solid rgba(255,255,255,.25);
    box-shadow:0 5px 20px #000;
}

/* BOTÕES */

#actions{
    position:absolute;
    right:18px;
    bottom:18px;
    display:flex;
    align-items:flex-end;
    gap:10px;
    pointer-events:auto;
}

.gameButton{
    color:white;
    font-weight:bold;
    font-size:9px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.18);

    background:
        radial-gradient(

            #606060,
            #252525 65%,

}

.gameButton:active,

#flashButton{

#crouchButton{

}

#interactButton{
    width:76px;

    border-color:#c6a72d;
}

#runButton{
    width:78px;
    height:78px;
    border-color:#a22d2d;
}

/* =====================================================
   DANO
===================================================== */

#damage{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:30;

    opacity:0;

    background:
        radial-gradient(
            circle,
            transparent 35%,
            rgba(180,0,0,.7)

    transition:opacity .12s;
}

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

/* =========================================================
   RENDERER
========================================================= */

const game=document.getElementById("game");

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x07090a);
scene.fog=new THREE.Fog(0x07090a,18,65);

const camera=new THREE.PerspectiveCamera(
    50,
    innerWidth/innerHeight,
    .1,
    200
);

const renderer=new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.5)
);

renderer.setSize(innerWidth,innerHeight);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;

game.appendChild(renderer.domElement);

const clock=new THREE.Clock();

/* =========================================================
   ILUMINAÇÃO AMBIENTE
========================================================= */

const ambient=new THREE.HemisphereLight(
    0x58646a,
    0x020202,
    1.25
);

scene.add(ambient);

const directional=new THREE.DirectionalLight(
    0x72818a,
    .55
);

directional.position.set(10,30,5);
directional.castShadow=true;

scene.add(directional);

/* =========================================================
   MATERIAIS
========================================================= */

const materials={

    floor:new THREE.MeshStandardMaterial({
        color:0x202426,
        roughness:.92
    }),

    wall:new THREE.MeshStandardMaterial({
        color:0x3b4144,
        roughness:.88
    }),

    wallDark:new THREE.MeshStandardMaterial({
        color:0x252a2c,
        roughness:.95
    }),

    metal:new THREE.MeshStandardMaterial({
        color:0x333b3e,
        roughness:.55,
        metalness:.35
    }),

    wood:new THREE.MeshStandardMaterial({
        color:0x553c29,
        roughness:.78
    }),

    oldWood:new THREE.MeshStandardMaterial({
        color:0x3d291d,
        roughness:.9
    })

};

/* =========================================================
   COLISÕES
========================================================= */

const collisionObjects=[];
const wallMeshes=[];

function addCollider(
    x,z,
    width,depth,
    minY=0,
    maxY=5
){

    collisionObjects.push({
        minX:x-width/2,
        maxX:x+width/2,
        minZ:z-depth/2,
        maxZ:z+depth/2,
        minY,
        maxY
    });

}

function createWall(
    x,y,z,
    width,height,depth,
    material=materials.wall
){

    const wall=new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            height,
            depth
        ),
        material
    );

    wall.position.set(
        x,
        y+height/2,
        z
    );

    wall.castShadow=true;
    wall.receiveShadow=true;

    scene.add(wall);

    addCollider(
        x,
        z,
        width,
        depth,
        y,
        y+height
    );

    wallMeshes.push(wall);

    /* acabamento superior */

    const edge=new THREE.Mesh(
        new THREE.BoxGeometry(
            width+.08,
            .12,
            depth+.08
        ),
        materials.metal
    );

    edge.position.set(
        x,
        y+height+.06,
        z
    );

    scene.add(edge);

    return wall;
}

function isBlocked(position,radius=.55){

    for(const box of collisionObjects){

        if(
            position.y+2<box.minY ||
            position.y>box.maxY
        ){
            continue;
        }

        const closestX=Math.max(
            box.minX,
            Math.min(
                position.x,
                box.maxX
            )
        );

        const closestZ=Math.max(
            box.minZ,
            Math.min(
                position.z,
                box.maxZ
            )
        );

        const dx=
            position.x-closestX;

        const dz=
            position.z-closestZ;

        if(
            dx*dx+dz*dz<
            radius*radius
        ){
            return true;
        }
    }

    return false;
}

/* =========================================================
   CHÃO
========================================================= */

function createFloor(
    y,
    width=74,
    depth=62
){

    const floor=new THREE.Mesh(
        new THREE.PlaneGeometry(
            width,
            depth
        ),
        materials.floor
    );

    floor.rotation.x=-Math.PI/2;
    floor.position.y=y;

    floor.receiveShadow=true;

    scene.add(floor);

    /* linhas sutis */

    const grid=new THREE.GridHelper(
        width,
        40,
        0x303638,
        0x171a1b
    );

    grid.position.y=y+.015;

    grid.material.transparent=true;
    grid.material.opacity=.14;

    scene.add(grid);
}

createFloor(0);

/* =========================================================
   MAPA DO PRÉDIO
========================================================= */

/*
    O mapa possui:

    RECEPÇÃO
    CORREDOR CENTRAL
    ESCRITÓRIOS
    BANHEIROS
    DEPÓSITO
    ENFERMARIA
    SALA DE SEGURANÇA
    SALA ELÉTRICA
    ÁREA DE ESCADAS
*/

/* PAREDES EXTERNAS */

createWall(0,0,-30,74,5,1);
createWall(0,0,30,74,5,1);

createWall(-36.5,0,0,1,5,60);
createWall(36.5,0,0,1,5,60);

/* RECEPÇÃO */

createWall(-18,0,-18,25,5,.7);
createWall(-8,0,-10,.7,5,16);

/* CORREDOR DIREITO */

createWall(9,0,-21,.7,5,18);
createWall(21,0,-13,25,5,.7);

/* SALAS DO LADO DIREITO */

createWall(20,0,-5,.7,5,15);
createWall(27,0,2,18,5,.7);

/* CORREDOR INFERIOR */

createWall(10,0,15,32,5,.7);
createWall(-12,0,8,28,5,.7);

/* SALAS ESQUERDAS */

createWall(-26,0,17,.7,5,25);
createWall(-16,0,22,20,5,.7);

/* DIVISÕES */

createWall(-18,0,-5,12,5,.6);
createWall(-22,0,7,10,5,.6);
createWall(18,0,23,18,5,.6);
createWall(4,0,22,.6,5,15);

/* =========================================================
   DECORAÇÃO
========================================================= */

function createBox(
    x,y,z,
    w,h,d,
    material,
    collision=true
){

    const mesh=new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        material
    );

    mesh.position.set(x,y,z);

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    scene.add(mesh);

    if(collision){

        addCollider(
            x,z,w,d,
            y-h/2,
            y+h/2
        );
    }

    return mesh;
}

/* RECEPÇÃO */

createBox(
    -26,1,-23,
    10,2,2,
    materials.oldWood
);

createBox(
    -27,2.4,-23,
    2,.6,.5,
    materials.metal,
    false
);

/* CADEIRAS */

function chair(x,z){

    createBox(
        x,.8,z,
        1.1,.25,1.1,
        materials.metal
    );

    createBox(
        x,1.5,z+.4,
        1.1,1.3,.2,
        materials.metal
    );

}

chair(-20,-25);
chair(-16,-25);
chair(-13,-25);

/* MESAS */

const hidingPlaces=[];

function createTable(x,z){

    const group=new THREE.Group();

    const top=new THREE.Mesh(
        new THREE.BoxGeometry(
            3.5,
            .25,
            2
        ),
        materials.wood
    );

    top.position.y=1.7;

    group.add(top);

    for(const a of [-1.45,1.45]){

        for(const b of [-.75,.75]){

            const leg=new THREE.Mesh(
                new THREE.BoxGeometry(
                    .18,
                    1.7,
                    .18
                ),
                materials.metal
            );

            leg.position.set(
                a,.85,b
            );

            group.add(leg);

        }

    }

    group.position.set(x,0,z);

    group.traverse(obj=>{

        if(obj.isMesh){

            obj.castShadow=true;
            obj.receiveShadow=true;

        }

    });

    scene.add(group);

    addCollider(
        x,z,
        3.5,2,
        0,1.9
    );

    hidingPlaces.push({
        type:"table",
        position:new THREE.Vector3(x,0,z),
        radius:2.3
    });

}

createTable(-20,-13);
createTable(14,-22);
createTable(27,10);
createTable(-18,14);

/* ARMÁRIOS */

function createLocker(x,z){

    const group=new THREE.Group();

    const body=new THREE.Mesh(
        new THREE.BoxGeometry(
            2,
            4.4,
            1.5
        ),
        materials.metal
    );

    body.position.y=2.2;

    group.add(body);

    /* duas portas */

    const leftDoor=new THREE.Mesh(
        new THREE.BoxGeometry(
            .9,
            4,
            .06
        ),
        new THREE.MeshStandardMaterial({
            color:0x485257,
            roughness:.75
        })
    );

    leftDoor.position.set(
        -.48,
        2.2,
        -.78
    );

    const rightDoor=leftDoor.clone();

    rightDoor.position.x=.48;

    group.add(leftDoor);
    group.add(rightDoor);

    group.position.set(x,0,z);

    group.traverse(obj=>{

        if(obj.isMesh)
            obj.castShadow=true;

    });

    scene.add(group);

    addCollider(
        x,z,
        2,1.5,
        0,4.4
    );

    hidingPlaces.push({
        type:"locker",
        position:new THREE.Vector3(x,0,z),
        radius:2.5
    });

}

createLocker(-31,-8);
createLocker(29,-4);
createLocker(-22,20);
createLocker(28,20);

/* CAIXAS E DETALHES */

for(let i=0;i<12;i++){

    const x=
        i%2===0
        ?25+Math.random()*5
        :-30+Math.random()*4;

    const z=
        -18+Math.random()*38;

    const size=
        .8+Math.random()*1.3;

    createBox(
        x,
        size/2,
        z,
        size,
        size,
        size,
        materials.oldWood
    );

}

/* =========================================================
   PERSONAGEM
========================================================= */

const player=new THREE.Group();

scene.add(player);

/* pernas */

/* corpo */

const flashlightModel=

/* LUZ PRINCIPAL */

/* =========================================================
   MOVIMENTAÇÃO
========================================================= */

function movePlayer(delta){

    if(playerState.hidden)
        return;

    const direction=
        new THREE.Vector3(
            input.x,
            0,
            input.z
        );

    if(direction.length()>1)
        direction.normalize();

    const moving=
        direction.length()>.08;

    let speed=3.6;

    const running=
        input.running &&
        playerState.stamina>1 &&
        !playerState.crouching;

    if(running)
        speed=6.3;

    if(playerState.crouching)
        speed=1.8;

    const desired=
        direction.multiplyScalar(speed);

    playerState.velocity.x+=
        (
            desired.x-
            playerState.velocity.x
        )*
        Math.min(delta*10,1);

    playerState.velocity.z+=
        (
            desired.z-
            playerState.velocity.z
        )*
        Math.min(delta*10,1);

    if(!moving){

        playerState.velocity.x*=.72;
        playerState.velocity.z*=.72;

    }

    /* COLISÃO NO EIXO X */

    let test=
        player.position.clone();

    test.x+=
        playerState.velocity.x*
        delta;

    if(!isBlocked(test,.6)){

        player.position.x=test.x;

    }else{

        playerState.velocity.x=0;

    }

    /* COLISÃO NO EIXO Z */

    test.copy(player.position);

    test.z+=
        playerState.velocity.z*
        delta;

    if(!isBlocked(test,.6)){

        player.position.z=test.z;

    }else{

        playerState.velocity.z=0;

    }

    if(moving){

        const angle=Math.atan2(
            direction.x,
            direction.z
        );

        let difference=
            angle-player.rotation.y;

        difference=Math.atan2(
            Math.sin(difference),
            Math.cos(difference)
        );

        player.rotation.y+=
            difference*
            Math.min(delta*12,1);

        playerState.walkTime+=
            delta*
            (
                running
                ?14
                :playerState.crouching
                ?5
                :8
            );

        const swing=
            Math.sin(
                playerState.walkTime
            )*
            (
                running
                ?.75
                :.42
            );

        leftLeg.rotation.x=swing;
        rightLeg.rotation.x=-swing;

        leftArm.rotation.x=-swing*.8;
        rightArm.rotation.x=swing*.8;

    }else{

        leftLeg.rotation.x*=.7;
        rightLeg.rotation.x*=.7;

        leftArm.rotation.x*=.7;
        rightArm.rotation.x*=.7;

    }

    /* AGACHAMENTO */

    const desiredScale=
        playerState.crouching
        ?.68
        :1;

    player.scale.y+=
        (
            desiredScale-
            player.scale.y
        )*
        Math.min(delta*12,1);

    /* ENERGIA */

    if(running){

        playerState.stamina-=
            25*delta;

    }else{

        playerState.stamina+=
            16*delta;

    }

    playerState.stamina=
        THREE.MathUtils.clamp(
            playerState.stamina,
            0,
            100
        );

    /* BARULHO */

    if(!moving){

        playerState.noise=0;

    }else if(playerState.crouching){

        playerState.noise=.15;

    }else if(running){

        playerState.noise=1;

    }else{

        playerState.noise=.45;

    }

}

/* =========================================================

========================================================= */

function findHidingPlace(){

    let result=null;
    let shortest=Infinity;

    hidingPlaces.forEach(place=>{

        const distance=
            player.position.distanceTo(
                place.position
            );

        if(
            distance<place.radius &&
            distance<shortest
        ){

            result=place;
            shortest=distance;

        }

    });

    return result;
}

function toggleHide(){

    if(playerState.hidden){

        playerState.hidden=false;

        player.visible=true;

        playerState.hidingPlace=null;

        showMessage(
            "VOCÊ SAIU DO ESCONDERIJO."
        );

        return;
    }

    const place=
        findHidingPlace();

    if(!place){

        showMessage(
            "NÃO HÁ UM ESCONDERIJO PRÓXIMO."
        );

        return;
    }

    playerState.hidden=true;

    playerState.hidingPlace=place;

    player.visible=false;

    showMessage(

        place.type==="locker"
        ?"VOCÊ ENTROU NO ARMÁRIO."
        :"VOCÊ SE ESCONDEU SOB A MESA."

    );

}

const monsterState={

    lastPosition:

    viewDistance:20,

    patrolPoints:[

        new THREE.Vector3(

/* =========================================================
   VISÃO — PAREDES BLOQUEIAM
========================================================= */

const raycaster=
    new THREE.Raycaster();

function monsterCanSeePlayer(){

    if(playerState.hidden)
        return false;

    const from=
        monster.position.clone();

    from.y=2.8;

    const to=
        player.position.clone();

    to.y=2;

    const direction=
        to.clone().sub(from);

    const distance=
        direction.length();

    if(
        distance>
        monsterState.viewDistance
    ){
        return false;
    }

    direction.normalize();

    const forward=
        new THREE.Vector3(
            0,0,-1
        )
        .applyQuaternion(
            monster.quaternion
        )
        .normalize();

    const angle=
        forward.angleTo(direction);

    /* campo de visão */

    if(angle>Math.PI*.38)
        return false;

    raycaster.set(
        from,
        direction
    );

    const hits=
        raycaster.intersectObjects(
            wallMeshes,
            false
        );

    /*
    Se uma parede estiver entre
    o monstro e o jogador,
    ele não enxerga.
    */

    if(
        hits.length>0 &&
        hits[0].distance<distance
    ){
        return false;
    }

    return true;
}

/* =========================================================
   MOVIMENTAÇÃO DO MONSTRO
========================================================= */

function moveMonster(
    target,
    speed,
    delta
){

    const direction=
        new THREE.Vector3(

            target.x-
            monster.position.x,

            0,

            target.z-
            monster.position.z

        );

    const distance=
        direction.length();

    if(distance<.5)
        return true;

    direction.normalize();

    const angle=Math.atan2(
        direction.x,
        direction.z
    );

    let difference=
        angle-monster.rotation.y;

    difference=Math.atan2(
        Math.sin(difference),
        Math.cos(difference)
    );

    monster.rotation.y+=
        difference*
        Math.min(delta*6,1);

    const next=
        monster.position.clone();

    next.x+=
        direction.x*
        speed*
        delta;

    if(!isBlocked(next,.7)){

        monster.position.x=
            next.x;

    }

    next.copy(
        monster.position
    );

    next.z+=
        direction.z*
        speed*
        delta;

    if(!isBlocked(next,.7)){

        monster.position.z=
            next.z;

    }

    return false;
}

function updateMonster(
    delta,
    time
){

    const seesPlayer=
        monsterCanSeePlayer();

    const distance=
        monster.position.distanceTo(
            player.position
        );

    /* VIU O JOGADOR */

    if(seesPlayer){

        monsterState.state=
            "CHASE";

        monsterState.lastPosition.copy(
            player.position
        );

        monsterState.timer=7;

    }

    /*
    OUVIU O JOGADOR CORRENDO
    */

    if(

        playerState.noise>.8 &&

        distance<17 &&

        !playerState.hidden &&

        !seesPlayer

    ){

        monsterState.state=
            "INVESTIGATE";

        monsterState.lastPosition.copy(
            player.position
        );

    }

    /* PATRULHA */

    if(
        monsterState.state==="PATROL"
    ){

        const target=
            monsterState.patrolPoints[
                monsterState.patrolIndex
            ];

        if(
            moveMonster(
                target,
                2.1,
                delta
            )
        ){

            monsterState.patrolIndex=

                (
                    monsterState.patrolIndex+1
                )%

                monsterState.patrolPoints.length;

        }

    }

    /* INVESTIGAR */

    if(
        monsterState.state===
        "INVESTIGATE"
    ){

        const reached=

            moveMonster(

                monsterState.lastPosition,

                3.2,

                delta

            );

        if(reached){

            monsterState.state=
                "SEARCH";

            monsterState.timer=6;

        }

    }

    /* PERSEGUIÇÃO */

    if(
        monsterState.state===
        "CHASE"
    ){

        if(seesPlayer){

            monsterState.lastPosition.copy(
                player.position
            );

            monsterState.timer=6;

        }else{

            monsterState.timer-=delta;

        }

        moveMonster(

            monsterState.lastPosition,

            5.1,

            delta

        );

        if(
            monsterState.timer<=0
        ){

            monsterState.state=
                "SEARCH";

            monsterState.timer=5;

        }

    }

    /* PROCURA */

    if(
        monsterState.state===
        "SEARCH"
    ){

        monsterState.timer-=delta;

        const point=
            monsterState.lastPosition.clone();

        point.x+=
            Math.sin(time*1.5)*3;

        point.z+=
            Math.cos(time*1.2)*3;

        moveMonster(
            point,
            2.6,
            delta
        );

        if(
            monsterState.timer<=0
        ){

            monsterState.state=
                "PATROL";

        }

    }

    /*
    ATAQUE
    */

    if(

        distance<1.8 &&

        !playerState.hidden

    ){

        attackPlayer();

    }

}

/* =========================================================
   ATAQUE
========================================================= */

function attackPlayer(){

        performance.now();

        monsterState.attackCooldown

    playerState.health=

    const damage=

        showMessage(
            "A CRIATURA ENCONTROU VOCÊ."
        );

        setTimeout(
            ()=>location.reload(),
            2500
        );

    }

}

function updateFlashlight(

){

    if(playerState.flashlight){

        playerState.battery-=
            .22*delta;

        if(
            playerState.battery<=0
        ){

            playerState.battery=0;

            playerState.flashlight=false;

            showMessage(
                "A LANTERNA FICOU SEM BATERIA."
            );

        }

    }

    /*
    Direção do personagem
    */

    const forward=
        new THREE.Vector3(
            0,
            0,
            1
        ).applyQuaternion(
            player.quaternion
        );

    const position=
        player.position.clone();

    position.y+=2.3;

    position.add(
        forward.clone()
        .multiplyScalar(.8)
    );

    flashlight.position.copy(
        position
    );

    const target=
        player.position.clone();

    target.y=1;

    target.add(
        forward.clone()
        .multiplyScalar(18)
    );

    flashlightTarget.position.copy(
        target
    );

    flashlight.intensity=
        playerState.flashlight
        ?11
        :0;

    playerLight.position.copy(
        player.position
    );

    playerLight.position.y+=2;

    playerLight.intensity=
        playerState.flashlight
        ?1.8
        :.15;

}

/* =========================================================
   CÂMERA
========================================================= */

function updateCamera(delta){

    /*
    Câmera superior, mas inclinada.
    Isso mantém a dinâmica 2D
    com personagens e cenário 3D.
    */

    const targetPosition=
        new THREE.Vector3(

            player.position.x,

            player.position.y+21,

            player.position.z+14

        );

    camera.position.lerp(

        targetPosition,

        Math.min(
            delta*4,
            1
        )

    );

    const lookAt=
        player.position.clone();

    lookAt.y=
        player.position.y+1;

    camera.lookAt(
        lookAt
    );

}

/* =========================================================

const joystickArea=
    document.getElementById(
        "joystickArea"
    );

const joystick=
    document.getElementById(
        "joystick"
    );

let joystickPointer=null;

function updateJoystick(
    clientX,
    clientY
){

    const rect=
        joystickArea.getBoundingClientRect();

    let x=
        clientX-
        rect.left-
        75;

    let y=
        clientY-
        rect.top-
        75;

    const distance=
        Math.hypot(x,y);

    const max=40;

    if(distance>max){

        x=x/distance*max;
        y=y/distance*max;

    }

    input.x=x/max;

    input.z=y/max;

    joystick.style.transform=
        `translate(${x}px,${y}px)`;

}

function resetJoystick(){

    joystickPointer=null;

    input.x=0;
    input.z=0;

    joystick.style.transform=
        "translate(0,0)";

}

joystickArea.addEventListener(

    "pointerdown",

    event=>{

        joystickPointer=
            event.pointerId;

        joystickArea.setPointerCapture(
            event.pointerId
        );

        updateJoystick(
            event.clientX,
            event.clientY
        );

    }

);

joystickArea.addEventListener(

    "pointermove",

    event=>{

        if(
            event.pointerId===
            joystickPointer
        ){

            updateJoystick(
                event.clientX,
                event.clientY
            );

        }

    }

);

joystickArea.addEventListener(
    "pointerup",
    resetJoystick
);

joystickArea.addEventListener(
    "pointercancel",
    resetJoystick
);

========================================================= */

    ()=>{

            innerHeight
        );

    }
);

/* =========================================================
   LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    const delta=
        Math.min(
            clock.getDelta(),
            .05
        );

    const time=
        clock.elapsedTime;

    if(gameRunning){

        movePlayer(delta);

        updateMonster(
            delta,
            time
        );

        updateFlashlight(
            delta
        );

        updateCamera(
            delta
        );

        updateHUD();

    }

    renderer.render(
        scene,
        camera
    );

}

camera.position.set(
