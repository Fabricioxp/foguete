function nearestHide(){let best=null,bd=2.3;for(const h of hides){let d=h.p.distanceTo(player.position);if(d<bd){bd=d;best=h}}return best}function toggleHide(){if(S.hidden){S.hidden=false;player.visible=true;msg('VOCÊ SAIU DO ESCONDERIJO');return}let h=nearestHide();if(!h)return msg('NENHUM ESCONDERIJO PRÓXIMO');S.hidden=true;player.visible=false;msg('ESCONDIDO — FIQUE QUIETO')}
function updatePlayer(dt,t){if(S.hidden)return;let d=new THREE.Vector3(inp.x,0,inp.z);if(d.length()>1)d.normalize();let moving=d.length()>.05,running=inp.run&&S.st>0&&!S.crouch,sp=running?8.1:S.crouch?3.1:5.7;let tv=d.multiplyScalar(sp);S.vel.x+=(tv.x-S.vel.x)*Math.min(dt*16,1);S.vel.z+=(tv.z-S.vel.z)*Math.min(dt*16,1);if(!moving){S.vel.x*=Math.pow(.001,dt);S.vel.z*=Math.pow(.001,dt);S.noise=0}for(const axis of ['x','z']){let p=player.position.clone();p[axis]+=S.vel[axis]*dt;if(!hit(p,.55))player.position[axis]=p[axis];else S.vel[axis]=0}if(moving){let a=Math.atan2(d.x,d.z),dif=Math.atan2(Math.sin(a-player.rotation.y),Math.cos(a-player.rotation.y));player.rotation.y+=dif*Math.min(dt*13,1);S.cycle+=dt*(running?15:9);let sw=Math.sin(S.cycle)*(running?.75:.42);legs[0].rotation.x=sw;legs[1].rotation.x=-sw;arms[0].rotation.x=-sw*.7;arms[1].rotation.x=sw*.7;S.noise=S.crouch?.05:running?1:.32}S.st=THREE.MathUtils.clamp(S.st+(running?-25:18)*dt,0,100);player.scale.y+=((S.crouch?.72:1)-player.scale.y)*Math.min(dt*10,1)}
function updateEnemies(dt,t){for(const e of enemies){e.cd-=dt;e.stuck=(e.stuck||0);e.last=e.last||e.g.position.clone();let see=visible(e),dist=e.g.position.distanceTo(player.position);if(see){e.state='chase';e.target=player.position.clone();e.mem=3.2}else{e.mem-=dt;if(e.mem<=0)e.state='patrol'}let dir=new THREE.Vector3();if(e.state==='chase'){dir.subVectors(e.target,e.g.position);dir.y=0;if(dir.length())dir.normalize()}else{e.dir+=Math.sin(t+e.home.x)*dt*.3;dir.set(Math.sin(e.dir),0,Math.cos(e.dir));if(e.g.position.distanceTo(e.home)>6){dir.subVectors(e.home,e.g.position).setY(0).normalize()}}let speed=e.state==='chase'?e.speed:e.speed*.45;let candidates=[0,.65,-.65,1.3,-1.3];let moved=false;for(const off of candidates){let q=dir.clone().applyAxisAngle(new THREE.Vector3(0,1,0),off),n=e.g.position.clone().addScaledVector(q,speed*dt);if(!hit(n,.52)){e.g.position.copy(n);dir=q;moved=true;break}}if(!moved){e.dir+=1.7;e.stuck+=dt}else{if(e.g.position.distanceToSquared(e.last)<.0004)e.stuck+=dt;else e.stuck=0;e.last.copy(e.g.position)}if(e.stuck>1.2){e.state='patrol';e.target=e.home.clone();e.mem=0;e.dir+=Math.PI/2;e.stuck=0}if(dir.length()){let a=Math.atan2(dir.x,dir.z),df=Math.atan2(Math.sin(a-e.g.rotation.y),Math.cos(a-e.g.rotation.y));e.g.rotation.y+=df*Math.min(dt*8,1)}e.cycle+=dt*(e.state==='chase'?13:6);let sw=Math.sin(e.cycle)*.42;e.es[0].rotation.x=sw;e.es[1].rotation.x=-sw;e.as[0].rotation.x=-sw;e.as[1].rotation.x=sw;if(dist<1.45&&!S.hidden&&e.cd<=0){S.hp=Math.max(0,S.hp-11);e.cd=1.1;damage();if(S.hp<=0){msg('VOCÊ DESMAIOU...');setTimeout(()=>{resetPlayerSafe();S.hp=100},1600)}}}}
function updateFlash(dt,t){if(S.light){S.bat=Math.max(0,S.bat-.055*dt);if(!S.bat)S.light=false}let f=new THREE.Vector3(0,0,1).applyQuaternion(player.quaternion),p=player.position.clone().addScaledVector(f,.7);p.y=2.35+Math.abs(Math.sin(t*10))*Math.min(.05,Math.hypot(S.vel.x,S.vel.z)*.01);flash.position.copy(p);glow.position.copy(p);ft.position.copy(player.position.clone().addScaledVector(f,18).add(new THREE.Vector3(0,.6,0)));flash.intensity=S.light?20:0;glow.intensity=S.light?1.5:0;flModel.rotation.z=Math.sin(t*8)*Math.min(.08,Math.hypot(S.vel.x,S.vel.z)*.02)}
function puzzle(){if(S.hasFuse&&!S.power){S.power=true;document.querySelector('#mission').textContent='A ENERGIA VOLTOU. ENCONTRE O CARTÃO DE ACESSO DA ALA CIRÚRGICA.';msg('GERADOR RESTAURADO — UMA PORTA FOI DESTRAVADA')}else if(!S.hasFuse&&player.position.distanceTo(new THREE.Vector3(20,0,-23))<3){S.hasFuse=true;document.querySelector('#mission').textContent='LEVE O FUSÍVEL ATÉ O QUADRO ELÉTRICO NA RECEPÇÃO';msg('VOCÊ ENCONTROU UM FUSÍVEL')}else if(S.hasFuse&&player.position.distanceTo(new THREE.Vector3(-25,0,-37))<4)puzzle();else msg('NADA PARA INTERAGIR AQUI')}
let mt;function msg(s){clearTimeout(mt);let el=document.querySelector('#message');el.textContent=s;el.classList.add('on');mt=setTimeout(()=>el.classList.remove('on'),2400)}function damage(){let d=document.querySelector('#damage');d.style.opacity=.8;setTimeout(()=>d.style.opacity=0,160)}
const joy=document.querySelector('#joy'),stick=document.querySelector('#stick');let pid=null;function jmove(x,y){let b=joy.getBoundingClientRect(),dx=x-b.left-72,dy=y-b.top-72,l=Math.hypot(dx,dy),m=44;if(l>m){dx*=m/l;dy*=m/l}inp.x=dx/m;inp.z=dy/m;stick.style.transform=`translate(${dx}px,${dy}px)`}joy.onpointerdown=e=>{pid=e.pointerId;joy.setPointerCapture(pid);jmove(e.clientX,e.clientY)};joy.onpointermove=e=>{if(e.pointerId===pid)jmove(e.clientX,e.clientY)};for(const ev of ['pointerup','pointercancel'])joy.addEventListener(ev,()=>{pid=null;inp.x=inp.z=0;stick.style.transform=''});
const run=document.querySelector('#run');run.onpointerdown=()=>{inp.run=true;run.classList.add('down')};for(const ev of ['pointerup','pointercancel','pointerleave'])run.addEventListener(ev,()=>{inp.run=false;run.classList.remove('down')});document.querySelector('#flash').onclick=()=>{if(S.bat>0)S.light=!S.light};document.querySelector('#crouch').onclick=()=>{S.crouch=!S.crouch;document.querySelector('#crouch').classList.toggle('down',S.crouch)};document.querySelector('#action').onclick=()=>{if(nearestHide()||S.hidden)toggleHide();else puzzle()};
let playing=false;document.querySelector('#start').onclick=async()=>{try{await document.documentElement.requestFullscreen()}catch(e){}document.querySelector('#menu').style.display='none';playing=true;msg('VOCÊ ACORDOU NO HOSPITAL. ALGUÉM DEIXOU UMA ROTA PARA VOCÊ.')};
function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;if(playing){if(hit(player.position,.72)){resetPlayerSafe();msg('POSIÇÃO CORRIGIDA — ÁREA DE SPAWN SEGURA')} updatePlayer(dt,t);updateEnemies(dt,t);updateFlash(dt,t);let want=player.position.clone().add(new THREE.Vector3(0,20,14));cam.position.lerp(want,Math.min(dt*5,1));cam.lookAt(player.position.clone().add(new THREE.Vector3(0,1,0)));for(let i=0;i<emergency.length;i++)emergency[i].intensity=.8+Math.max(0,Math.sin(t*7+i*2))*1.1;document.querySelector('#hp').style.width=S.hp+'%';document.querySelector('#st').style.width=S.st+'%';document.querySelector('#bat').style.width=S.bat+'%';let h=nearestHide(),hint=document.querySelector('#hint');hint.classList.toggle('on',!!h||S.hidden);hint.textContent=S.hidden?'AÇÃO: SAIR DO ESCONDERIJO':h?'AÇÃO: ESCONDER-SE':'AÇÃO: INTERAGIR';let x=player.position.x,z=player.position.z;document.querySelector('#room').textContent=x<-18?(z<-7?'RECEPÇÃO / ENFERMARIA':z<14?'PRONTO-SOCORRO':'UTI'):x<25?(z<13?'FARMÁCIA':'CENTRO CIRÚRGICO'):'DEPÓSITO E ALA TÉCNICA'}r.render(scene,cam)}cam.position.set(-31,20,-21);cam.lookAt(player.position);loop();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
</script></body></html>
