<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    touch-action:none;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;

body{
    overscroll-behavior:none;
}

#gameContainer{
    position:fixed;
    inset:0;

    height:100vh;

canvas{
    position:absolute;
    inset:0;

    height:100%;

}

/* ===========================
   TELA VERTICAL
=========================== */

#rotateScreen{
    display:none;
    position:fixed;
    inset:0;
    z-index:999;
    background:#050505;
    color:white;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
}

#rotateScreen .phone{
    font-size:70px;
    animation:rotatePhone 2s infinite ease-in-out;
}

@keyframes rotatePhone{
    0%,100%{ transform:rotate(0); }
    50%{ transform:rotate(90deg); }
}

@media (orientation:portrait){
    #rotateScreen{
        display:flex;
    }
}

/* ===========================
   HUD
=========================== */

#hud{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
}

#topLeft{
    position:absolute;
    top:max(12px,env(safe-area-inset-top));
    left:max(15px,env(safe-area-inset-left));
}

#locationBox{

}

#locationName{

    font-weight:bold;
    letter-spacing:1px;
}

/* STATUS */

#statusPanel{

.statusLabel{

}

.bar{

.fill{

#batteryFill{

=========================== */

.gameButton{

<script>
/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let W=0;
let H=0;
let DPR=1;

function resize(){

    W=window.innerWidth;
    H=window.innerHeight;

    DPR=Math.min(
        window.devicePixelRatio||1,
        2
    );

    canvas.width=W*DPR;
    canvas.height=H*DPR;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(
        DPR,0,0,DPR,0,0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   MAPA
========================================================= */

const TILE=64;

const MAP=[
"########################################",
"#.............#........................#",
"#.............#........................#",
"#.............#....######....######....#",
"#....#####....#....#....#....#....#....#",
"#....#...#.........#....#....#....#....#",
"#....#...#####.#####....######....#....#",
"#...........#.................#....#....#",
"######.######.................#....#....#",
"#......................................#",
"#.#############.##############.#######.#",
"#.#...........#.#............#.#.....#.#",
"#.#...........#.#............#.#.....#.#",
"#.#...........#.#............#.#.....#.#",
"#.#####.#######.######.#########.....#.#",
"#......................................#",
"#....###########.............########..#",
"#....#.........#.............#......#..#",
"#....#.........#.............#......#..#",
"#....#.........###############......#..#",
"#......................................#",
"########################################"
];

const mapRows=MAP.length;
const mapCols=MAP[0].length;

const worldWidth=mapCols*TILE;
const worldHeight=mapRows*TILE;


/* =========================================================
   JOGADOR
========================================================= */

const player={

    radius:22,

    speed:165,

    stamina:100,
    battery:100,

/* =========================================================
   CÂMERA
========================================================= */

const camera={

    x:0,

};


/* =========================================================
   OBJETOS
========================================================= */

const objects=[
    {x:220,y:220,w:120,h:40,type:"desk"},
    {x:470,y:390,w:50,h:100,type:"cabinet"},
    {x:700,y:180,w:120,h:35,type:"desk"},
    {x:980,y:310,w:80,h:40,type:"sofa"},
    {x:1250,y:520,w:110,h:35,type:"desk"},
    {x:1550,y:250,w:50,h:100,type:"cabinet"},
    {x:1850,y:680,w:120,h:40,type:"desk"},

/* =========================================================
   PORTAS
========================================================= */

const doors=[

    {

        w:22,
        h:58,

        angle:0,

        open:false,

        locked:false,

        color:"#583d2a"
    },

    {
        x:1216,
        y:640,

        w:22,
        h:58,

        open:false,

        locked:true,

    },

    {
        x:2048,

        w:22,
        h:58,

        open:false,

    }
];


/* =========================================================
   CHAVES
========================================================= */

const keysItems=[

    {
        x:780,
        y:460,

        collected:false,

        slot:"key1Slot",

        color:"#d5bc35"
    },

    {
        x:1560,

    },

    }
];

let keysCollected=0;


/* =========================================================
   SAÍDA
========================================================= */

const exitDoor={

    y:1250,

    h:30,

    unlocked:false
};


/* =========================================================
   CRIATURA
========================================================= */

const monster={

    state:"idle",

};


/* =========================================================
   LUZES DO PRÉDIO
========================================================= */

const lights=[

    {x:350,y:220,r:170,on:true,flicker:0},
    {x:850,y:420,r:150,on:true,flicker:0},
    {x:1400,y:300,r:160,on:false,flicker:0},
    {x:1800,y:700,r:150,on:true,flicker:0},
    {x:2200,y:1000,r:180,on:true,flicker:0}
];


/* =========================================================
   INPUT
========================================================= */

const input={

    x:0,
    y:0,

    running:false
};


/* =========================================================
   JOYSTICK
========================================================= */

const joystickArea=
    document.getElementById(
        "joystickArea"
    );

const joystickStick=
    document.getElementById(
        "joystickStick"
    );

let joystickPointer=null;

const JOY_CENTER=75;
const JOY_LIMIT=40;

function resetJoystick(){

    joystickPointer=null;

    input.x=0;
    input.y=0;

    joystickStick.style.transform=
        "translate(0px,0px)";
}

function updateJoystick(x,y){

    const rect=
        joystickArea.getBoundingClientRect();

    let dx=x-rect.left-JOY_CENTER;
    let dy=y-rect.top-JOY_CENTER;

    const distance=
        Math.hypot(dx,dy);

    if(distance>JOY_LIMIT){

        dx=
            dx/distance*JOY_LIMIT;

        dy=
            dy/distance*JOY_LIMIT;
    }

    input.x=dx/JOY_LIMIT;
    input.y=dy/JOY_LIMIT;

    joystickStick.style.transform=
        `translate(${dx}px,${dy}px)`;
}

joystickArea.addEventListener(
    "pointerdown",
    e=>{

        joystickPointer=e.pointerId;

        joystickArea.setPointerCapture(
            e.pointerId
        );

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);

joystickArea.addEventListener(
    "pointermove",
    e=>{

        if(
            joystickPointer!==e.pointerId
        ) return;

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);

joystickArea.addEventListener(
    "pointerup",
    resetJoystick
);

joystickArea.addEventListener(
    "pointercancel",
    resetJoystick
);


/* =========================================================
   BOTÃO CORRER
========================================================= */

const runButton=
    document.getElementById(
        "runButton"
    );

runButton.addEventListener(
    "pointerdown",
    e=>{

        input.running=true;

        runButton.classList.add(
            "active"
        );
    }
);

function stopRunning(){

    input.running=false;

    runButton.classList.remove(
        "active"
    );
}

runButton.addEventListener(
    "pointerup",
    stopRunning
);

runButton.addEventListener(
    "pointercancel",
    stopRunning
);

runButton.addEventListener(
    "pointerleave",
    stopRunning
);


/* =========================================================
   LANTERNA
========================================================= */

const flashButton=
    document.getElementById(
        "flashButton"
    );

flashButton.addEventListener(
    "click",
    ()=>{

        if(player.battery<=0){

            showMessage(
                "SEM BATERIA..."
            );

            return;
        }

        player.flashlight=
            !player.flashlight;

        flashButton.classList.toggle(
            "active",
            player.flashlight
        );

        vibrate(20);
    }
);


/* =========================================================
   ÁUDIO
========================================================= */

let audioContext=null;
let masterGain=null;

function initializeAudio(){

    if(audioContext) return;

    try{

        audioContext=
            new(
                window.AudioContext||
                window.webkitAudioContext
            )();

        masterGain=
            audioContext.createGain();

        masterGain.gain.value=.35;

        masterGain.connect(
            audioContext.destination
        );

        ambientSound();

    }catch(error){

        console.log(
            "Áudio não disponível"
        );
    }
}

function ambientSound(){

    if(!audioContext) return;

    const oscillator=
        audioContext.createOscillator();

    const gain=
        audioContext.createGain();

    oscillator.type="sine";

    oscillator.frequency.value=42;

    gain.gain.value=.018;

    oscillator.connect(gain);

    gain.connect(masterGain);

    oscillator.start();
}

function sound(
    frequency,
    duration,
    volume=.1,
    type="sine"
){

    if(!audioContext) return;

    const osc=
        audioContext.createOscillator();

    const gain=
        audioContext.createGain();

    osc.type=type;

    osc.frequency.setValueAtTime(
        frequency,
        audioContext.currentTime
    );

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime+
        duration
    );

    osc.connect(gain);

    gain.connect(masterGain);

    osc.start();

    osc.stop(
        audioContext.currentTime+
        duration
    );
}

function footstep(){

    sound(
        65+Math.random()*25,
        .1,
        .07,
        "triangle"
    );
}

function monsterSound(){

    if(!audioContext) return;

    const osc=
        audioContext.createOscillator();

    const gain=
        audioContext.createGain();

    osc.type="sawtooth";

    osc.frequency.setValueAtTime(
        80,
        audioContext.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        25,
        audioContext.currentTime+.8
    );

    gain.gain.setValueAtTime(
        .001,
        audioContext.currentTime
    );

    gain.gain.linearRampToValueAtTime(
        .12,
        audioContext.currentTime+.2
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime+.9
    );

    osc.connect(gain);

    gain.connect(masterGain);

    osc.start();

    osc.stop(
        audioContext.currentTime+1
    );
}


/* =========================================================
   COLISÕES
========================================================= */

function wallAt(x,y){

    const tileX=
        Math.floor(x/TILE);

    const tileY=
        Math.floor(y/TILE);

    if(
        tileX<0||
        tileY<0||
        tileX>=mapCols||
        tileY>=mapRows
    ){
        return true;
    }

    return MAP[tileY][tileX]==="#";
}

function circleRectangleCollision(
    x,y,r,
    rx,ry,rw,rh
){

    const nearestX=
        Math.max(
            rx,
            Math.min(x,rx+rw)
        );

    const nearestY=
        Math.max(
            ry,
            Math.min(y,ry+rh)
        );

    const dx=x-nearestX;
    const dy=y-nearestY;

    return(
        dx*dx+dy*dy
        <
        r*r
    );
}

function playerCollision(x,y){

    const r=player.radius;

    const points=[

        [x-r,y-r],
        [x+r,y-r],
        [x-r,y+r],
        [x+r,y+r]
    ];

    for(const point of points){

        if(
            wallAt(
                point[0],
                point[1]
            )
        ){
            return true;
        }
    }

    for(const object of objects){

        if(
            circleRectangleCollision(
                x,y,r,
                object.x,
                object.y,
                object.w,
                object.h
            )
        ){
            return true;
        }
    }

    for(const door of doors){

        if(!door.open){

            if(
                circleRectangleCollision(
                    x,y,r,
                    door.x,
                    door.y,
                    door.w,
                    door.h
                )
            ){
                return true;
            }
        }
    }

    return false;
}

/* =========================================================
   CRIATURA
========================================================= */

function activateMonster(){

    if(monster.active) return;

    const angle=
        Math.random()*Math.PI*2;

    const distance=
        500+Math.random()*300;

    monster.x=
        player.x+
        Math.cos(angle)*distance;

    monster.y=
        player.y+
        Math.sin(angle)*distance;

    monster.x=Math.max(
        100,
        Math.min(
            worldWidth-100,
            monster.x
        )
    );

    monster.y=Math.max(
        100,
        Math.min(
            worldHeight-100,
            monster.y
        )
    );

    monster.active=true;

    monster.state="search";

    monster.visibleTimer=5;

    monsterSound();

    showMessage(
        "ALGO ESTÁ AQUI..."
    );
}

function updateMonster(dt){

    monster.spawnTimer-=dt;

    if(
        monster.spawnTimer<=0&&
        !monster.active
    ){

        activateMonster();

        monster.spawnTimer=
            35+Math.random()*30;
    }

    if(!monster.active) return;

    const distance=
        distanceTo(
            monster.x,
            monster.y,
            player.x,
            player.y
        );

    let detectionRange=
        player.running
        ? 520
        : 280;

    if(distance<detectionRange){

        monster.state="chase";

        monster.lastSeenX=player.x;
        monster.lastSeenY=player.y;

        monster.chaseTimer=5;
    }

    if(monster.state==="chase"){

        monster.chaseTimer-=dt;

        if(monster.chaseTimer<=0){

            monster.state="search";
        }
    }

    let targetX=
        monster.lastSeenX;

    let targetY=
        monster.lastSeenY;

    if(
        monster.state==="search"&&
        distance>500
    ){

        monster.visibleTimer-=dt;

        if(monster.visibleTimer<=0){

            monster.active=false;

            return;
        }
    }

    if(monster.state==="chase"){

        targetX=player.x;
        targetY=player.y;
    }

    const dx=targetX-monster.x;
    const dy=targetY-monster.y;

    const length=Math.hypot(dx,dy);

    if(length>3){

        const speed=
            monster.state==="chase"
            ? monster.speed*1.55
            : monster.speed;

        monster.x+=
            dx/length*speed*dt;

        monster.y+=
            dy/length*speed*dt;
    }

    /* ATAQUE */

    if(distance<50){

        damagePlayer(18);

        monster.x-=
            (player.x-monster.x)*
            .05;

        monster.y-=
            (player.y-monster.y)*
            .05;
    }
}

    );

/* =========================================================
   ATUALIZAÇÃO
========================================================= */

let footstepTimer=0;

function update(dt){

    /* MOVIMENTO */

    let moveX=input.x;
    let moveY=input.y;

    const magnitude=
        Math.hypot(moveX,moveY);

    if(magnitude>1){

        moveX/=magnitude;
        moveY/=magnitude;
    }

    player.moving=magnitude>.1;

    player.running=
        input.running&&
        player.stamina>0&&
        player.moving;

    let speed=
        player.running
        ? player.runSpeed
        : player.speed;

    if(player.moving){

        player.angle=
            Math.atan2(
                moveY,
                moveX
            );

        const dx=
            moveX*speed*dt;

        const dy=
            moveY*speed*dt;

        if(
            !playerCollision(
                player.x+dx,
                player.y
            )
        ){

            player.x+=dx;
        }

        if(
            !playerCollision(
                player.x,
                player.y+dy
            )
        ){

            player.y+=dy;
        }

        player.walkAnimation+=
            dt*
            (
                player.running
                ?14
                :8
            );

        footstepTimer-=dt;

        if(footstepTimer<=0){

            footstep();

            footstepTimer=
                player.running
                ?.22
                :.38;
        }
    }

    /* STAMINA */

    if(player.running){

        player.stamina-=26*dt;

        if(player.stamina<0){

            player.stamina=0;
        }

    }else{

        player.stamina+=18*dt;

        if(player.stamina>100){

            player.stamina=100;
        }
    }

    /* BATERIA */

    if(player.flashlight){

        player.battery-=.7*dt;

        if(player.battery<=0){

            player.battery=0;

            player.flashlight=false;

            showMessage(
                "A LANTERNA APAGOU..."
            );
        }
    }

    updateKeys();

    updateMonster(dt);

    updateEvents(dt);

    /* LUZES */

    for(const light of lights){

        if(light.flicker>0){

            light.flicker-=dt;

            light.on=
                Math.random()>.5;
        }
    }

    /* CÂMERA */

    const targetX=
        player.x-W/2;

    const targetY=
        player.y-H/2;

    camera.x+=
        (targetX-camera.x)*
        6*dt;

    camera.y+=
        (targetY-camera.y)*
        6*dt;

    camera.x=Math.max(
        0,
        Math.min(
            camera.x,
            Math.max(
                0,
                worldWidth-W
            )
        )
    );

    camera.y=Math.max(
        0,
        Math.min(
            camera.y,
            Math.max(
                0,
                worldHeight-H
            )
        )
    );

    if(camera.shakePower>0){

        camera.shakeX=
            (Math.random()-.5)*
            camera.shakePower;

        camera.shakeY=
            (Math.random()-.5)*
            camera.shakePower;

        camera.shakePower-=dt*8;

    }else{

        camera.shakeX=0;
        camera.shakeY=0;
    }

    updateHUD();
}

========================================================= */

function drawWorld(){

    ctx.save();

    ctx.translate(

        -camera.x+
        camera.shakeX,

        -camera.y+
        camera.shakeY
    );

    const startX=
        Math.max(
            0,
            Math.floor(camera.x/TILE)-1
        );

    const startY=
        Math.max(
            0,
            Math.floor(camera.y/TILE)-1
        );

    const endX=
        Math.min(
            mapCols,
            Math.ceil(
                (camera.x+W)/TILE
            )+1
        );

    const endY=
        Math.min(
            mapRows,
            Math.ceil(
                (camera.y+H)/TILE
            )+1
        );

    /* CHÃO E PAREDES */

    for(
        let y=startY;
        y<endY;
        y++
    ){

        for(
            let x=startX;
            x<endX;
            x++
        ){

            const px=x*TILE;
            const py=y*TILE;

            if(MAP[y][x]==="#"){

                drawWall(
                    px,
                    py
                );

            }else{

                drawFloor(
                    px,
                    py,
                    x,
                    y
                );
            }
        }
    }

    drawObjects();

    drawExit();

    drawKeys();

    drawDoors();

    drawMonster();

    drawPlayer();

    ctx.restore();
}


/* =========================================================
   CHÃO
========================================================= */

function drawFloor(x,y,tileX,tileY){

    const seed=
        (tileX*17+
        tileY*31)%4;

    const shades=[
        "#141414",
        "#161616",
        "#121212",
        "#181818"
    ];

    ctx.fillStyle=
        shades[seed];

    ctx.fillRect(
        x,y,TILE,TILE
    );

    ctx.strokeStyle=
        "rgba(255,255,255,.018)";

    ctx.strokeRect(
        x,y,TILE,TILE
    );

    /* RACHADURAS */

    if(
        (tileX*13+
        tileY*7)%9===0
    ){

        ctx.strokeStyle=
            "rgba(0,0,0,.35)";

        ctx.lineWidth=1;

        ctx.beginPath();

        ctx.moveTo(
            x+8,
            y+15
        );

        ctx.lineTo(
            x+35,
            y+22
        );

        ctx.lineTo(
            x+50,
            y+45
        );

        ctx.stroke();
    }

    /* MANCHAS */

    if(
        (tileX*7+
        tileY*11)%13===0
    ){

        ctx.fillStyle=
            "rgba(0,0,0,.16)";

        ctx.beginPath();

        ctx.ellipse(
            x+TILE*.5,
            y+TILE*.5,
            20,
            10,
            .4,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}

function drawWall(x,y){

    ctx.fillRect(
        x,y,TILE,TILE
    );

    ctx.fillStyle=
        "rgba(255,255,255,.04)";

    ctx.fillRect(
        x+2,
        y+2,
        TILE-4,
        4
    );

    ctx.fillStyle=
        "rgba(0,0,0,.3)";

    ctx.fillRect(
        x,
        y+TILE-7,
        TILE,
        7
    );

    ctx.strokeStyle=
        "rgba(0,0,0,.7)";

    ctx.strokeRect(
        x,y,TILE,TILE
    );

    /* DETALHES */

    ctx.strokeStyle=
        "rgba(255,255,255,.025)";

    ctx.beginPath();

    ctx.moveTo(
        x+8,
        y+18
    );

    ctx.lineTo(
        x+42,
        y+21
    );

   OBJETOS
========================================================= */

function drawObjects(){

    for(const object of objects){

        ctx.save();

        /* SOMBRA */

        ctx.fillStyle=
            "rgba(0,0,0,.5)";

        ctx.fillRect(
            object.x+6,
            object.y+7,
            object.w,
            object.h
        );

        if(object.type==="desk"){

            ctx.fillStyle="#3c2c20";

            ctx.fillRect(
                object.x,
                object.y,
                object.w,
                object.h
            );

            ctx.fillStyle="#725541";

            ctx.fillRect(
                object.x+4,
                object.y+4,
                object.w-8,
                5
            );

            ctx.strokeStyle="#130d09";

            ctx.strokeRect(
                object.x,
                object.y,
                object.w,
                object.h
            );
        }

        if(object.type==="cabinet"){

            ctx.fillStyle="#292c2f";

            ctx.fillRect(
                object.x,
                object.y,
                object.w,
                object.h
            );

            ctx.strokeStyle="#5b5b5b";

            ctx.strokeRect(
                object.x,
                object.y,
                object.w,
                object.h
            );

            ctx.strokeStyle=
                "rgba(0,0,0,.7)";

            ctx.beginPath();

            ctx.moveTo(
                object.x,
                object.y+
                object.h/2
            );

            ctx.lineTo(
                object.x+
                object.w,
                object.y+
                object.h/2
            );

            ctx.stroke();

            ctx.fillStyle="#888";

            ctx.fillRect(
                object.x+
                object.w/2-2,
                object.y+
                object.h/2-2,
                4,
                4
            );
        }

        if(object.type==="sofa"){

            ctx.fillStyle="#3b332e";

            ctx.fillRect(
                object.x,
                object.y,
                object.w,
                object.h
            );

            ctx.fillStyle="#51443c";

            ctx.fillRect(
                object.x+5,
                object.y+5,
                object.w-10,
                object.h-15
            );
        }

        if(object.type==="box"){

            ctx.fillStyle="#4c392a";

            ctx.fillRect(
                object.x,
                object.y,
                object.w,
                object.h
            );

            ctx.strokeStyle="#80634b";

            ctx.strokeRect(
                object.x+2,
                object.y+2,
                object.w-4,
                object.h-4
            );

            ctx.beginPath();

            ctx.moveTo(
                object.x,
                object.y
            );

            ctx.lineTo(
                object.x+
                object.w,
                object.y+
                object.h
            );

            ctx.stroke();
        }

        ctx.restore();
    }
}

/* =========================================================
   JOGADOR
========================================================= */

function drawPlayer(){

    const x=player.x;
    const y=player.y;

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(player.angle);

    /* SOMBRA */

    ctx.fillStyle=
        "rgba(0,0,0,.65)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        16,
        26,
        12,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    const step=
        player.moving
        ?Math.sin(
            player.walkAnimation
        )*5
        :0;

    /* PERNAS */

    ctx.fillStyle="#202b45";

    ctx.fillRect(
        -15,
        -2,
        11,
        25+step
    );

    ctx.fillRect(
        5,
        -2,
        11,
        25-step
    );

    /* SAPATOS */

    ctx.fillStyle="#111";

    ctx.beginPath();

    ctx.ellipse(
        -9,
        22+step,
        11,
        6,
        0,
        0,
        Math.PI*2
    );

    ctx.ellipse(
        11,
        22-step,
        11,
        6,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* CORPO */

    ctx.fillStyle="#962b2b";

    ctx.beginPath();

    ctx.roundRect(
        -20,
        -24,
        40,
        40,
        13
    );

    ctx.fill();

    /* MACACÃO */

    ctx.fillStyle="#263e7a";

    ctx.fillRect(
        -17,
        -3,
        34,
        20
    );

    ctx.fillStyle=
        "rgba(255,255,255,.1)";

    ctx.fillRect(
        -14,
        1,
        28,
        3
    );

    /* BRAÇOS */

    ctx.fillStyle="#a63030";

    ctx.fillRect(
        -30,
        -16,
        12,
        27
    );

    ctx.fillRect(
        18,
        -16,
        12,
        27
    );

    /* CABEÇA */

    ctx.fillStyle="#e4ae8b";

    ctx.beginPath();

    ctx.arc(
        0,
        -33,
        21,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* CABELO / BONÉ */

    ctx.fillStyle="#6e1515";

    ctx.beginPath();

    ctx.arc(
        0,
        -38,
        22,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillRect(
        5,
        -43,
        20,
        7
    );

    /* OLHO */

    ctx.fillStyle="#171717";

    ctx.beginPath();

    ctx.arc(
        11,
        -35,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* LANTERNA */

    ctx.save();

    ctx.translate(
        30,
        4
    );

    ctx.fillStyle="#252525";

    ctx.fillRect(
        -7,
        -8,
        20,
        16
    );

    ctx.fillStyle="#888";

    ctx.fillRect(
        9,
        -6,
        8,
        12
    );

    if(player.flashlight){

        ctx.fillStyle="#fff6b0";

        ctx.fillRect(
            15,
            -4,
            3,
            8
        );
    }

    ctx.restore();

    ctx.restore();
}


/* =========================================================
   MONSTRO
========================================================= */

function drawMonster(){

    if(!monster.active) return;

    ctx.save();

    ctx.translate(
        monster.x,
        monster.y
    );

    const time=
        performance.now()/1000;

    const sway=
        Math.sin(time*4)*3;

    /* SOMBRA */

    ctx.fillStyle=
        "rgba(0,0,0,.8)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        20,
        30,
        12,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* CORPO */

    ctx.fillStyle="#050505";

    ctx.beginPath();

    ctx.ellipse(
        0,
        sway,
        25,
        45,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* CABEÇA */

    ctx.beginPath();

    ctx.arc(
        0,
        -38+sway,
        23,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* OLHOS */

    ctx.fillStyle="#d8d8d8";

    ctx.shadowBlur=12;

    ctx.shadowColor="#fff";

    ctx.beginPath();

    ctx.arc(
        -8,
        -40+sway,
        3,
        0,
        Math.PI*2
    );

    ctx.arc(
        8,
        -40+sway,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}


/* =========================================================
   ILUMINAÇÃO
========================================================= */

function drawLighting(){

    ctx.save();

    /* ESCURIDÃO */

    ctx.fillStyle=
        "rgba(0,0,0,.82)";

    ctx.fillRect(
        0,0,W,H
    );

    ctx.globalCompositeOperation=
        "destination-out";

    /* LUZES FIXAS */

    for(const light of lights){

        if(!light.on) continue;

        const lx=
            light.x-camera.x+
            camera.shakeX;

        const ly=
            light.y-camera.y+
            camera.shakeY;

        const gradient=
            ctx.createRadialGradient(
                lx,ly,0,
                lx,ly,
                light.r
            );

        gradient.addColorStop(
            0,
            "rgba(0,0,0,.35)"
        );

        gradient.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );

        ctx.fillStyle=gradient;

        ctx.beginPath();

        ctx.arc(
            lx,
            ly,
            light.r,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    /* LANTERNA */

    if(player.flashlight){

        const px=
            player.x-camera.x+
            camera.shakeX;

        const py=
            player.y-camera.y+
            camera.shakeY;

        /* LUZ PRÓXIMA */

        const ambient=
            ctx.createRadialGradient(
                px,py,0,
                px,py,150
            );

        ambient.addColorStop(
            0,
            "rgba(0,0,0,.95)"
        );

        ambient.addColorStop(
            .5,
            "rgba(0,0,0,.55)"
        );

        ambient.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );

        ctx.fillStyle=ambient;

        ctx.beginPath();

        ctx.arc(
            px,py,
            150,
            0,
            Math.PI*2
        );

        ctx.fill();

        /* CONE */

        ctx.save();

        ctx.translate(
            px,
            py
        );

        ctx.rotate(
            player.angle
        );

        const flicker=
            Math.random()*8;

        const length=
            420+flicker;

        const cone=
            ctx.createLinearGradient(
                0,0,
                length,0
            );

        cone.addColorStop(
            0,
            "rgba(0,0,0,.95)"
        );

        cone.addColorStop(
            .4,
            "rgba(0,0,0,.6)"
        );

        cone.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );

        ctx.fillStyle=cone;

        ctx.beginPath();

        ctx.moveTo(
            0,-32
        );

        ctx.lineTo(
            length,
            -175
        );

        ctx.lineTo(
            length,
            175
        );

        ctx.lineTo(
            0,
            32
        );

        ctx.closePath();

        ctx.fill();

        ctx.restore();
    }

    ctx.restore();

    /* VINHETA */

    const vignette=
        ctx.createRadialGradient(

            W/2,
            H/2,

            Math.min(W,H)*.2,

            W/2,
            H/2,

            Math.max(W,H)*.75
        );

    vignette.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    vignette.addColorStop(
        1,
        "rgba(0,0,0,.8)"
    );

    ctx.fillStyle=vignette;

    ctx.fillRect(
        0,0,W,H
    );
}


/* =========================================================
   EFEITOS
========================================================= */

function drawNoise(){

    ctx.save();

    ctx.globalAlpha=.035;

    for(let i=0;i<180;i++){

        ctx.fillStyle=
            Math.random()>.5
            ?"#fff"
            :"#000";

        ctx.fillRect(
            Math.random()*W,
            Math.random()*H,
            1,
            1
        );
    }

    ctx.restore();
}


/* =========================================================
   MENSAGENS
========================================================= */

const message=
    document.getElementById(
        "message"
    );

let messageTimeout=null;

function showMessage(text){

    clearTimeout(
        messageTimeout
    );

    message.textContent=text;

    message.classList.add(
        "show"
    );

    messageTimeout=setTimeout(
        ()=>{

            message.classList.remove(
                "show"
            );

        },
        2500
    );
}


/* =========================================================
   FULLSCREEN
========================================================= */

async function enterFullscreen(){

    const element=
        document.documentElement;

    try{

        if(
            element.requestFullscreen
        ){

            await element.requestFullscreen();

        }else if(
            element.webkitRequestFullscreen
        ){

            element.webkitRequestFullscreen();
        }

    }catch(error){

        console.log(
            "Fullscreen não permitido"
        );
    }

    /* Tenta esconder barras */

    setTimeout(
        ()=>{

            window.scrollTo(
                0,
                1
            );

            resize();

        },
        300
    );
}

/* =========================================================

========================================================= */

function vibrate(time){

    if(navigator.vibrate){

        navigator.vibrate(time);
    }
}


/* =========================================================
   LOOP
========================================================= */

let lastTime=0;

function loop(time){

    const dt=
        Math.min(
            (time-lastTime)/1000,
            .05
        );

    lastTime=time;

    if(gameRunning){

        update(dt);
    }

    ctx.clearRect(
        0,0,W,H
    );

    ctx.fillStyle="#050505";

    ctx.fillRect(
        0,0,W,H
    );

    drawWorld();

    drawLighting();

    drawNoise();

    requestAnimationFrame(
        loop
    );
}

requestAnimationFrame(loop);

/* =========================================================
   TECLADO PARA TESTE
========================================================= */

const keyboard={};

window.addEventListener(
    "keydown",
    event=>{

        keyboard[event.key]=true;

        if(event.key===" "){

            input.running=true;
        }

        updateKeyboard();
    }
);

window.addEventListener(
    "keyup",
    event=>{

        keyboard[event.key]=false;

        if(event.key===" "){

            input.running=false;
        }

        updateKeyboard();
    }
);

function updateKeyboard(){

    let x=0;
    let y=0;

    if(
        keyboard["w"]||
        keyboard["ArrowUp"]
    ) y--;

    if(
        keyboard["s"]||
        keyboard["ArrowDown"]
    ) y++;

    if(
        keyboard["a"]||
        keyboard["ArrowLeft"]
    ) x--;

    if(
        keyboard["d"]||
        keyboard["ArrowRight"]
    ) x++;

    const length=
        Math.hypot(x,y);

    if(length>0){

        input.x=x/length;
        input.y=y/length;

    }else{

        input.x=0;
        input.y=0;
    }
}
