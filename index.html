<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>O PRÉDIO</title>

<style>
    *{
        box-sizing:border-box;
        -webkit-tap-highlight-color:transparent;
        user-select:none;
        touch-action:none;
    }

    html,body{
        margin:0;
        width:100%;
        height:100%;
        overflow:hidden;
        background:#000;
        font-family:Arial,Helvetica,sans-serif;
    }

    #game{
        position:fixed;
        inset:0;
        width:100%;
        height:100%;
        background:#050505;
    }

    canvas{
        width:100%;
        height:100%;
        display:block;
    }

    #rotateWarning{
        display:none;
        position:fixed;
        inset:0;
        z-index:100;
        background:#050505;
        color:white;
        align-items:center;
        justify-content:center;
        flex-direction:column;
        text-align:center;
        padding:30px;
    }

    #rotateIcon{
        font-size:70px;
        margin-bottom:15px;
        animation:rotatePhone 2s infinite ease-in-out;
    }

    @keyframes rotatePhone{
        0%,100%{transform:rotate(0deg);}
        50%{transform:rotate(90deg);}
    }

    @media (orientation:portrait){
        #rotateWarning{
            display:flex;
        }
    }

    /* =========================
       INTERFACE
    ========================== */

    #hud{
        position:fixed;
        inset:0;
        pointer-events:none;
        z-index:10;
    }

    #topHUD{
        position:absolute;
        top:max(12px, env(safe-area-inset-top));
        left:max(18px, env(safe-area-inset-left));
        right:max(18px, env(safe-area-inset-right));
        display:flex;
        justify-content:space-between;
        align-items:flex-start;
    }

    #locationBox{
        background:rgba(5,5,5,.65);
        backdrop-filter:blur(8px);
        border-left:3px solid #7d0000;
        padding:9px 16px;
        color:#eee;
        text-shadow:0 2px 3px black;
    }

    #locationTitle{
        font-size:11px;
        color:#999;
        letter-spacing:3px;
    }

    #locationName{
        font-size:17px;
        font-weight:bold;
        margin-top:3px;
        letter-spacing:1px;
    }

    #statusBox{
        display:flex;
        flex-direction:column;
        gap:7px;
        width:180px;
    }

    .status{
        background:rgba(0,0,0,.65);
        padding:7px 10px;
        border:1px solid rgba(255,255,255,.1);
        backdrop-filter:blur(5px);
    }

    .label{
        color:#aaa;
        font-size:9px;
        letter-spacing:2px;
        margin-bottom:4px;
    }

    .bar{
        height:7px;
        width:100%;
        background:#151515;
        border-radius:10px;
        overflow:hidden;
    }

    .fill{
        height:100%;
        border-radius:10px;
        transition:width .15s;
    }

    #batteryFill{
        width:100%;
        background:linear-gradient(90deg,#ffbc00,#fff000);
        box-shadow:0 0 8px #ffe100;
    }

    #staminaFill{
        width:100%;
        background:linear-gradient(90deg,#268cff,#67d8ff);
    }

    /* =========================
       CONTROLES
    ========================== */

    #controls{
        position:fixed;
        inset:0;
        z-index:20;
        pointer-events:none;
    }

    #joystickArea{
        position:absolute;
        left:max(24px, env(safe-area-inset-left));
        bottom:max(20px, env(safe-area-inset-bottom));
        width:145px;
        height:145px;
        pointer-events:auto;
    }

    #joystickBase{
        position:absolute;
        left:12px;
        top:12px;
        width:120px;
        height:120px;
        border-radius:50%;
        background:radial-gradient(circle,
            rgba(80,80,80,.25),
            rgba(0,0,0,.65));
        border:2px solid rgba(255,255,255,.13);
        box-shadow:
            inset 0 0 30px rgba(0,0,0,.8),
            0 4px 15px black;
    }

    #joystickStick{
        position:absolute;
        width:56px;
        height:56px;
        left:44px;
        top:44px;
        border-radius:50%;
        background:radial-gradient(circle at 35% 30%,
            #888,#303030 60%,#111);
        border:2px solid rgba(255,255,255,.22);
        box-shadow:
            0 5px 12px black,
            inset 0 2px 6px rgba(255,255,255,.25);
    }

    #buttons{
        position:absolute;
        right:max(25px, env(safe-area-inset-right));
        bottom:max(22px, env(safe-area-inset-bottom));
        display:flex;
        align-items:flex-end;
        gap:16px;
        pointer-events:auto;
    }

    .gameButton{
        width:72px;
        height:72px;
        border-radius:50%;
        border:2px solid rgba(255,255,255,.18);
        background:
            radial-gradient(circle at 35% 30%,
            rgba(130,130,130,.7),
            rgba(30,30,30,.9));
        color:white;
        font-size:11px;
        font-weight:bold;
        letter-spacing:1px;
        box-shadow:
            0 7px 15px black,
            inset 0 3px 8px rgba(255,255,255,.15);
    }

    .gameButton:active,
    .gameButton.active{
        transform:scale(.92);
        filter:brightness(1.5);
    }

    #runButton{
        border-color:rgba(255,60,60,.4);
    }

    #flashButton{
        width:58px;
        height:58px;
        border-color:rgba(255,220,100,.4);
        font-size:20px;
    }

    #message{
        position:absolute;
        left:50%;
        top:20%;
        transform:translateX(-50%);
        color:white;
        text-align:center;
        font-size:16px;
        font-weight:bold;
        letter-spacing:2px;
        text-shadow:
            0 2px 3px black,
            0 0 15px black;
        opacity:0;
        transition:opacity .4s;
        width:80%;
    }

    #message.show{
        opacity:1;
    }

    #startScreen{
        position:fixed;
        z-index:50;
        inset:0;
        display:flex;
        align-items:center;
        justify-content:center;
        background:
            radial-gradient(circle at center,
            rgba(40,40,40,.15),
            #000 75%);
    }

    #startContent{
        text-align:center;
        color:white;
        animation:appear 1s ease;
    }

    @keyframes appear{
        from{
            opacity:0;
            transform:scale(.95);
        }
        to{
            opacity:1;
            transform:scale(1);
        }
    }

    #gameTitle{
        font-size:clamp(42px,8vw,90px);
        letter-spacing:12px;
        font-weight:900;
        color:#ddd;
        text-shadow:
            0 0 10px #fff,
            0 0 30px rgba(255,255,255,.3),
            0 5px 0 #111;
        margin-bottom:5px;
    }

    #subtitle{
        color:#9d9d9d;
        font-size:13px;
        letter-spacing:5px;
        margin-bottom:35px;
    }

    #startButton{
        padding:16px 50px;
        border:1px solid rgba(255,255,255,.25);
        background:rgba(255,255,255,.1);
        color:white;
        font-weight:bold;
        letter-spacing:3px;
        font-size:14px;
        border-radius:4px;
        box-shadow:0 10px 30px black;
    }

    #startButton:active{
        transform:scale(.96);
        background:#7d0000;
    }

    #objective{
        position:absolute;
        left:50%;
        bottom:10px;
        transform:translateX(-50%);
        color:#aaa;
        font-size:11px;
        text-align:center;
        letter-spacing:1px;
        text-shadow:0 2px 3px black;
        pointer-events:none;
    }
</style>
</head>

<body>

<div id="game">
    <canvas id="canvas"></canvas>
</div>

<div id="rotateWarning">
    <div id="rotateIcon">📱</div>
    <h2>GIRE O CELULAR</h2>
    <p>Este jogo foi feito para ser jogado na horizontal.</p>
</div>

<div id="hud">

    <div id="topHUD">

        <div id="locationBox">
            <div id="locationTitle">LOCALIZAÇÃO</div>
            <div id="locationName">TÉRREO — RECEPÇÃO</div>
        </div>

        <div id="statusBox">

            <div class="status">
                <div class="label">🔦 BATERIA</div>
                <div class="bar">
                    <div class="fill" id="batteryFill"></div>
                </div>
            </div>

            <div class="status">
                <div class="label">⚡ ENERGIA</div>
                <div class="bar">
                    <div class="fill" id="staminaFill"></div>
                </div>
            </div>

        </div>

    </div>

    <div id="message"></div>

    <div id="objective">
        ENCONTRE UMA SAÍDA DO PRÉDIO
    </div>

</div>

<div id="controls">

    <div id="joystickArea">
        <div id="joystickBase"></div>
        <div id="joystickStick"></div>
    </div>

    <div id="buttons">
        <button class="gameButton" id="flashButton">🔦</button>
        <button class="gameButton" id="runButton">CORRER</button>
    </div>

</div>

<div id="startScreen">
    <div id="startContent">
        <div id="gameTitle">O PRÉDIO</div>
        <div id="subtitle">VOCÊ NÃO ESTÁ SOZINHO</div>

        <button id="startButton">
            ENTRAR
        </button>
    </div>
</div>

<script>
/* =====================================================
   CONFIGURAÇÃO PRINCIPAL
===================================================== */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let DPR = 1;

function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * DPR;
    canvas.height = H * DPR;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(DPR,0,0,DPR,0,0);
}

window.addEventListener("resize", resize);
resize();


/* =====================================================
   MUNDO
===================================================== */

const TILE = 64;

const MAP = [
"#############################",
"#..............#............#",
"#..............#............#",
"#....######....#....######..#",
"#....#....#....#....#....#..#",
"#....#....#.........#....#..#",
"#....#....#####.#####....#..#",
"#.........#...............#.#",
"#####.#####...............#.#",
"#...........................#",
"#.###########.###########...#",
"#.#.........#.#.........#...#",
"#.#.........#.#.........#...#",
"#.#.........#.#.........#...#",
"#.#####.#####.#####.#####...#",
"#...........................#",
"#....##########.............#",
"#....#........#.............#",
"#....#........#.............#",
"#############################"
];

const mapHeight = MAP.length;
const mapWidth = MAP[0].length;

const worldWidth = mapWidth * TILE;
const worldHeight = mapHeight * TILE;


/* =====================================================
   OBJETOS
===================================================== */

const objects = [
    {x:300,y:220,w:90,h:35,type:"table"},
    {x:540,y:300,w:50,h:100,type:"cabinet"},
    {x:880,y:150,w:100,h:35,type:"table"},
    {x:1200,y:420,w:50,h:50,type:"box"},
    {x:1480,y:620,w:100,h:30,type:"table"},
    {x:450,y:750,w:40,h:90,type:"cabinet"},
    {x:1000,y:850,w:120,h:35,type:"table"},
    {x:1600,y:300,w:40,h:80,type:"cabinet"}
];

const doors = [
    {x:640,y:320,w:18,h:55,open:false},
    {x:1088,y:448,w:18,h:55,open:false},
    {x:1280,y:960,w:18,h:55,open:false}
];


/* =====================================================
   JOGADOR
===================================================== */

const player = {
    x: 180,
    y: 180,
    radius: 22,

    vx:0,
    vy:0,

    angle:0,

    walkSpeed:155,
    runSpeed:265,

    stamina:100,
    battery:100,

    flashlight:true,

    moving:false,
    running:false,

    walkTime:0
};


/* =====================================================
   CÂMERA
===================================================== */

const camera = {
    x:0,
    y:0,
    shakeX:0,
    shakeY:0,
    shakePower:0
};


/* =====================================================
   INPUT
===================================================== */

const input = {
    x:0,
    y:0,
    running:false
};

let joystickActive = false;
let joystickId = null;

const joystickArea = document.getElementById("joystickArea");
const joystickStick = document.getElementById("joystickStick");

const JOY_CENTER = 72;
const JOY_MAX = 38;

function resetJoystick(){
    joystickActive = false;
    joystickId = null;

    input.x = 0;
    input.y = 0;

    joystickStick.style.transform = "translate(0px,0px)";
}

function updateJoystick(clientX, clientY){

    const rect = joystickArea.getBoundingClientRect();

    const x = clientX - rect.left;
    const y = clientY - rect.top;

    let dx = x - JOY_CENTER;
    let dy = y - JOY_CENTER;

    const dist = Math.hypot(dx,dy);

    if(dist > JOY_MAX){
        dx = dx / dist * JOY_MAX;
        dy = dy / dist * JOY_MAX;
    }

    joystickStick.style.transform =
        `translate(${dx}px,${dy}px)`;

    input.x = dx / JOY_MAX;
    input.y = dy / JOY_MAX;
}

joystickArea.addEventListener("pointerdown", e=>{
    e.preventDefault();

    joystickActive = true;
    joystickId = e.pointerId;

    joystickArea.setPointerCapture(e.pointerId);

    updateJoystick(e.clientX,e.clientY);
});

joystickArea.addEventListener("pointermove", e=>{
    if(!joystickActive) return;
    if(e.pointerId !== joystickId) return;

    updateJoystick(e.clientX,e.clientY);
});

joystickArea.addEventListener("pointerup", resetJoystick);
joystickArea.addEventListener("pointercancel", resetJoystick);


/* =====================================================
   CORRER
===================================================== */

const runButton = document.getElementById("runButton");

runButton.addEventListener("pointerdown", e=>{
    e.preventDefault();
    input.running = true;
    runButton.classList.add("active");
});

function stopRun(){
    input.running = false;
    runButton.classList.remove("active");
}

runButton.addEventListener("pointerup", stopRun);
runButton.addEventListener("pointercancel", stopRun);
runButton.addEventListener("pointerleave", stopRun);


/* =====================================================
   LANTERNA
===================================================== */

const flashButton = document.getElementById("flashButton");

flashButton.addEventListener("click",()=>{

    if(player.battery <= 0) return;

    player.flashlight = !player.flashlight;

    flashButton.classList.toggle(
        "active",
        player.flashlight
    );

    vibrate(20);
});


/* =====================================================
   SOM
===================================================== */

let audioCtx = null;
let masterGain = null;

function startAudio(){

    if(audioCtx) return;

    try{

        audioCtx =
            new (window.AudioContext ||
            window.webkitAudioContext)();

        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.18;

        masterGain.connect(audioCtx.destination);

        createAmbientSound();

    }catch(e){
        console.log("Áudio indisponível");
    }
}

function createAmbientSound(){

    if(!audioCtx) return;

    const oscillator =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = 48;

    gain.gain.value = 0.025;

    oscillator.connect(gain);
    gain.connect(masterGain);

    oscillator.start();
}

function playFootstep(){

    if(!audioCtx) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "triangle";
    osc.frequency.value = 80 + Math.random()*20;

    gain.gain.setValueAtTime(
        0.06,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioCtx.currentTime + .08
    );

    osc.connect(gain);
    gain.connect(masterGain);

    osc.start();
    osc.stop(audioCtx.currentTime + .1);
}

function playScarySound(){

    if(!audioCtx) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "sawtooth";

    osc.frequency.setValueAtTime(
        120,
        audioCtx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        25,
        audioCtx.currentTime + 1
    );

    gain.gain.setValueAtTime(
        0.001,
        audioCtx.currentTime
    );

    gain.gain.linearRampToValueAtTime(
        0.12,
        audioCtx.currentTime + .15
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioCtx.currentTime + 1
    );

    osc.connect(gain);
    gain.connect(masterGain);

    osc.start();
    osc.stop(audioCtx.currentTime+1);
}


/* =====================================================
   COLISÕES
===================================================== */

function isWallAt(x,y){

    const tx = Math.floor(x / TILE);
    const ty = Math.floor(y / TILE);

    if(
        tx < 0 ||
        ty < 0 ||
        tx >= mapWidth ||
        ty >= mapHeight
    ){
        return true;
    }

    return MAP[ty][tx] === "#";
}

function collides(x,y,r){

    const points = [
        [x-r,y-r],
        [x+r,y-r],
        [x-r,y+r],
        [x+r,y+r]
    ];

    for(const p of points){

        if(isWallAt(p[0],p[1])){
            return true;
        }
    }

    for(const obj of objects){

        const nearestX =
            Math.max(
                obj.x,
                Math.min(x,obj.x+obj.w)
            );

        const nearestY =
            Math.max(
                obj.y,
                Math.min(y,obj.y+obj.h)
            );

        const dx = x-nearestX;
        const dy = y-nearestY;

        if(dx*dx+dy*dy < r*r){
            return true;
        }
    }

    return false;
}


/* =====================================================
   ENTIDADE MISTERIOSA
===================================================== */

const shadow = {
    active:false,
    x:0,
    y:0,
    timer:0,
    alpha:0
};

function spawnShadow(){

    const distance = 450 + Math.random()*250;

    shadow.x =
        player.x +
        Math.cos(player.angle) * distance;

    shadow.y =
        player.y +
        Math.sin(player.angle) * distance;

    shadow.active = true;
    shadow.timer = 2.5;
    shadow.alpha = 0;

    playScarySound();
    vibrate(100);
}


/* =====================================================
   EVENTOS
===================================================== */

let nextEvent = 10 + Math.random()*15;

function triggerEvent(){

    const events = [
        "VOCÊ OUVIU ALGUMA COISA...",
        "ALGO SE MOVEU.",
        "NÃO OLHE PARA TRÁS.",
        "VOCÊ NÃO ESTÁ SOZINHO.",
        "CORRA."
    ];

    showMessage(
        events[
            Math.floor(
                Math.random()*events.length
            )
        ]
    );

    if(Math.random() < .65){
        spawnShadow();
    }

    camera.shakePower = 3;
}


/* =====================================================
   MENSAGENS
===================================================== */

const messageEl =
    document.getElementById("message");

let messageTimeout = null;

function showMessage(text){

    clearTimeout(messageTimeout);

    messageEl.textContent = text;
    messageEl.classList.add("show");

    messageTimeout = setTimeout(()=>{
        messageEl.classList.remove("show");
    },2500);
}


/* =====================================================
   VIBRAÇÃO
===================================================== */

function vibrate(ms){

    if(navigator.vibrate){
        navigator.vibrate(ms);
    }
}


/* =====================================================
   ATUALIZAÇÃO
===================================================== */

let lastTime = 0;
let footstepTimer = 0;
let started = false;

function update(dt){

    if(!started) return;

    /* MOVIMENTO */

    let moveX = input.x;
    let moveY = input.y;

    const magnitude =
        Math.hypot(moveX,moveY);

    if(magnitude > 1){
        moveX /= magnitude;
        moveY /= magnitude;
    }

    player.moving = magnitude > .1;

    player.running =
        input.running &&
        player.stamina > 0 &&
        player.moving;

    let speed =
        player.running
        ? player.runSpeed
        : player.walkSpeed;

    if(player.moving){

        player.angle =
            Math.atan2(moveY,moveX);

        const dx =
            moveX * speed * dt;

        const dy =
            moveY * speed * dt;

        if(
            !collides(
                player.x+dx,
                player.y,
                player.radius
            )
        ){
            player.x += dx;
        }

        if(
            !collides(
                player.x,
                player.y+dy,
                player.radius
            )
        ){
            player.y += dy;
        }

        player.walkTime += dt * (
            player.running ? 14 : 8
        );

        footstepTimer -= dt;

        if(footstepTimer <= 0){

            playFootstep();

            footstepTimer =
                player.running
                ? .22
                : .38;
        }
    }

    /* STAMINA */

    if(player.running){

        player.stamina -= 22*dt;

        if(player.stamina < 0){
            player.stamina = 0;
        }

    }else{

        player.stamina += 18*dt;

        if(player.stamina > 100){
            player.stamina = 100;
        }
    }

    /* BATERIA */

    if(player.flashlight){

        player.battery -= .65*dt;

        if(player.battery <= 0){

            player.battery = 0;
            player.flashlight = false;

            showMessage(
                "A LANTERNA ACABOU..."
            );
        }
    }

    /* SOMBRA */

    if(shadow.active){

        shadow.timer -= dt;

        shadow.alpha += dt*2;

        if(shadow.timer <= 0){

            shadow.active = false;

            showMessage(
                "ONDE ELE FOI?"
            );
        }
    }

    /* EVENTOS */

    nextEvent -= dt;

    if(nextEvent <= 0){

        triggerEvent();

        nextEvent =
            18 + Math.random()*25;
    }

    /* CÂMERA */

    const targetX =
        player.x - W/2;

    const targetY =
        player.y - H/2;

    camera.x +=
        (targetX-camera.x)*5*dt;

    camera.y +=
        (targetY-camera.y)*5*dt;

    camera.x =
        Math.max(
            0,
            Math.min(
                camera.x,
                worldWidth-W
            )
        );

    camera.y =
        Math.max(
            0,
            Math.min(
                camera.y,
                worldHeight-H
            )
        );

    if(camera.shakePower > 0){

        camera.shakeX =
            (Math.random()-.5)*
            camera.shakePower;

        camera.shakeY =
            (Math.random()-.5)*
            camera.shakePower;

        camera.shakePower -=
            dt*6;

    }else{

        camera.shakeX=0;
        camera.shakeY=0;
    }

    /* HUD */

    document.getElementById(
        "batteryFill"
    ).style.width =
        player.battery+"%";

    document.getElementById(
        "staminaFill"
    ).style.width =
        player.stamina+"%";
}


/* =====================================================
   DESENHO DO MAPA
===================================================== */

function drawWorld(){

    ctx.save();

    ctx.translate(
        -camera.x + camera.shakeX,
        -camera.y + camera.shakeY
    );

    const startX =
        Math.floor(camera.x/TILE)-1;

    const startY =
        Math.floor(camera.y/TILE)-1;

    const endX =
        Math.ceil(
            (camera.x+W)/TILE
        )+1;

    const endY =
        Math.ceil(
            (camera.y+H)/TILE
        )+1;

    for(
        let y=Math.max(0,startY);
        y<Math.min(mapHeight,endY);
        y++
    ){

        for(
            let x=Math.max(0,startX);
            x<Math.min(mapWidth,endX);
            x++
        ){

            const tile =
                MAP[y][x];

            const px = x*TILE;
            const py = y*TILE;

            if(tile === "#"){

                /* PAREDE */

                ctx.fillStyle = "#222";
                ctx.fillRect(
                    px,py,TILE,TILE
                );

                ctx.fillStyle =
                    "rgba(255,255,255,.035)";

                ctx.fillRect(
                    px+3,py+3,
                    TILE-6,3
                );

                ctx.strokeStyle =
                    "rgba(0,0,0,.8)";

                ctx.lineWidth=2;

                ctx.strokeRect(
                    px,py,TILE,TILE
                );

                /* TEXTURA */

                ctx.strokeStyle =
                    "rgba(255,255,255,.025)";

                ctx.beginPath();

                ctx.moveTo(
                    px+Math.random()*TILE,
                    py
                );

                ctx.lineTo(
                    px+Math.random()*TILE,
                    py+TILE
                );

                ctx.stroke();

            }else{

                /* CHÃO */

                ctx.fillStyle="#121212";

                ctx.fillRect(
                    px,py,TILE,TILE
                );

                ctx.strokeStyle =
                    "rgba(255,255,255,.018)";

                ctx.strokeRect(
                    px,py,TILE,TILE
                );
            }
        }
    }

    /* SUJEIRA E MANCHAS */

    ctx.fillStyle =
        "rgba(0,0,0,.25)";

    for(let i=0;i<40;i++){

        const x =
            Math.floor(
                i*137 % worldWidth
            );

        const y =
            Math.floor(
                i*89 % worldHeight
            );

        ctx.beginPath();

        ctx.arc(
            x,y,
            10+(i%4)*6,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    drawObjects();
    drawShadow();
    drawPlayer();

    ctx.restore();
}


/* =====================================================
   OBJETOS
===================================================== */

function drawObjects(){

    for(const obj of objects){

        ctx.save();

        if(obj.type==="table"){

            ctx.fillStyle="#342820";

            ctx.fillRect(
                obj.x,obj.y,
                obj.w,obj.h
            );

            ctx.fillStyle="#5a4639";

            ctx.fillRect(
                obj.x+4,
                obj.y+4,
                obj.w-8,
                6
            );

            ctx.strokeStyle="#0a0a0a";

            ctx.strokeRect(
                obj.x,obj.y,
                obj.w,obj.h
            );
        }

        if(obj.type==="cabinet"){

            ctx.fillStyle="#292b2d";

            ctx.fillRect(
                obj.x,obj.y,
                obj.w,obj.h
            );

            ctx.strokeStyle="#555";

            ctx.strokeRect(
                obj.x,obj.y,
                obj.w,obj.h
            );

            ctx.strokeStyle=
                "rgba(0,0,0,.8)";

            ctx.beginPath();

            ctx.moveTo(
                obj.x,
                obj.y+obj.h/2
            );

            ctx.lineTo(
                obj.x+obj.w,
                obj.y+obj.h/2
            );

            ctx.stroke();
        }

        if(obj.type==="box"){

            ctx.fillStyle="#46382b";

            ctx.fillRect(
                obj.x,obj.y,
                obj.w,obj.h
            );

            ctx.strokeStyle="#755f48";

            ctx.strokeRect(
                obj.x+2,obj.y+2,
                obj.w-4,obj.h-4
            );

            ctx.beginPath();

            ctx.moveTo(
                obj.x,
                obj.y
            );

            ctx.lineTo(
                obj.x+obj.w,
                obj.y+obj.h
            );

            ctx.moveTo(
                obj.x+obj.w,
                obj.y
            );

            ctx.lineTo(
                obj.x,
                obj.y+obj.h
            );

            ctx.stroke();
        }

        ctx.restore();
    }
}


/* =====================================================
   PERSONAGEM
===================================================== */

function drawPlayer(){

    const x=player.x;
    const y=player.y;

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(player.angle);

    /* SOMBRA */

    ctx.fillStyle=
        "rgba(0,0,0,.55)";

    ctx.beginPath();

    ctx.ellipse(
        0,12,
        25,13,
        0,0,Math.PI*2
    );

    ctx.fill();

    /* PERNAS */

    const step =
        player.moving
        ? Math.sin(player.walkTime)*5
        : 0;

    ctx.fillStyle="#222b42";

    ctx.fillRect(
        -15,-2,
        11,
        24+step
    );

    ctx.fillRect(
        5,-2,
        11,
        24-step
    );

    /* SAPATOS */

    ctx.fillStyle="#111";

    ctx.beginPath();

    ctx.ellipse(
        -9,
        21+step,
        10,6,
        0,0,Math.PI*2
    );

    ctx.ellipse(
        11,
        21-step,
        10,6,
        0,0,Math.PI*2
    );

    ctx.fill();

    /* CORPO */

    ctx.fillStyle="#9c2323";

    ctx.beginPath();

    ctx.roundRect(
        -19,-22,
        38,38,
        12
    );

    ctx.fill();

    /* MACACÃO */

    ctx.fillStyle="#243c78";

    ctx.fillRect(
        -17,-2,
        34,19
    );

    ctx.fillStyle=
        "rgba(255,255,255,.12)";

    ctx.fillRect(
        -15,1,
        30,3
    );

    /* BRAÇOS */

    ctx.fillStyle="#9c2323";

    ctx.save();

    ctx.rotate(step*.04);

    ctx.fillRect(
        -29,-15,
        12,28
    );

    ctx.restore();

    ctx.fillRect(
        17,-15,
        12,28
    );

    /* CABEÇA */

    ctx.fillStyle="#e3ad8c";

    ctx.beginPath();

    ctx.arc(
        0,-30,
        20,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* CABELO/BONÉ */

    ctx.fillStyle="#7d1717";

    ctx.beginPath();

    ctx.arc(
        0,-35,
        21,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillRect(
        7,-39,
        17,6
    );

    /* ROSTO NA DIREÇÃO */

    ctx.fillStyle="#222";

    ctx.beginPath();

    ctx.arc(
        11,-32,
        2.7,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* LANERNA NA MÃO */

    ctx.save();

    ctx.translate(27,5);

    ctx.fillStyle="#333";

    ctx.fillRect(
        -4,-7,
        18,14
    );

    ctx.fillStyle="#777";

    ctx.fillRect(
        9,-5,
        7,10
    );

    ctx.restore();

    ctx.restore();
}


/* =====================================================
   SOMBRA
===================================================== */

function drawShadow(){

    if(!shadow.active) return;

    ctx.save();

    ctx.globalAlpha =
        Math.min(
            shadow.alpha,
            .8
        );

    ctx.translate(
        shadow.x,
        shadow.y
    );

    /* CORPO */

    ctx.fillStyle="#000";

    ctx.beginPath();

    ctx.ellipse(
        0,0,
        28,50,
        0,0,Math.PI*2
    );

    ctx.fill();

    /* CABEÇA */

    ctx.beginPath();

    ctx.arc(
        0,-42,
        24,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* OLHOS */

    ctx.fillStyle="#aaa";

    ctx.shadowBlur=10;
    ctx.shadowColor="#fff";

    ctx.beginPath();

    ctx.arc(
        -8,-43,
        3,0,Math.PI*2
    );

    ctx.arc(
        8,-43,
        3,0,Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}


/* =====================================================
   ILUMINAÇÃO
===================================================== */

function drawLighting(){

    /* ESCURIDÃO TOTAL */

    ctx.save();

    ctx.fillStyle=
        "rgba(0,0,0,.82)";

    ctx.fillRect(0,0,W,H);

    ctx.globalCompositeOperation =
        "destination-out";

    if(player.flashlight){

        const screenX =
            player.x-camera.x+
            camera.shakeX;

        const screenY =
            player.y-camera.y+
            camera.shakeY;

        const flashlightAngle =
            player.angle;

        /* LUZ AMBIENTE PRÓXIMA */

        let gradient =
            ctx.createRadialGradient(
                screenX,
                screenY,
                0,
                screenX,
                screenY,
                150
            );

        gradient.addColorStop(
            0,
            "rgba(0,0,0,.95)"
        );

        gradient.addColorStop(
            .35,
            "rgba(0,0,0,.75)"
        );

        gradient.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );

        ctx.fillStyle=gradient;

        ctx.beginPath();

        ctx.arc(
            screenX,
            screenY,
            150,
            0,
            Math.PI*2
        );

        ctx.fill();

        /* FEIXE DA LANTERNA */

        ctx.save();

        ctx.translate(
            screenX,
            screenY
        );

        ctx.rotate(
            flashlightAngle
        );

        const flicker =
            Math.random()*6;

        const length =
            390 + flicker;

        const cone =
            ctx.createRadialGradient(
                20,0,20,
                100,0,length
            );

        cone.addColorStop(
            0,
            "rgba(0,0,0,.9)"
        );

        cone.addColorStop(
            .45,
            "rgba(0,0,0,.5)"
        );

        cone.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );

        ctx.fillStyle=cone;

        ctx.beginPath();

        ctx.moveTo(0,-30);

        ctx.lineTo(
            length,
            -170
        );

        ctx.lineTo(
            length,
            170
        );

        ctx.lineTo(0,30);

        ctx.closePath();

        ctx.fill();

        ctx.restore();
    }

    ctx.restore();


    /* VINHETA */

    const vignette =
        ctx.createRadialGradient(
            W/2,H/2,
            Math.min(W,H)*.25,
            W/2,H/2,
            Math.max(W,H)*.7
        );

    vignette.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    vignette.addColorStop(
        1,
        "rgba(0,0,0,.7)"
    );

    ctx.fillStyle=vignette;

    ctx.fillRect(0,0,W,H);
}


/* =====================================================
   EFEITO DE RUÍDO
===================================================== */

function drawNoise(){

    ctx.save();

    ctx.globalAlpha=.04;

    for(let i=0;i<160;i++){

        ctx.fillStyle =
            Math.random()>.5
            ? "#fff"
            : "#000";

        ctx.fillRect(
            Math.random()*W,
            Math.random()*H,
            1,1
        );
    }

    ctx.restore();
}


/* =====================================================
   RENDERIZAÇÃO
===================================================== */

function render(){

    ctx.clearRect(0,0,W,H);

    /* FUNDO */

    ctx.fillStyle="#080808";

    ctx.fillRect(0,0,W,H);

    drawWorld();

    drawLighting();

    drawNoise();
}


/* =====================================================
   LOOP
===================================================== */

function gameLoop(time){

    const dt =
        Math.min(
            (time-lastTime)/1000,
            .05
        );

    lastTime=time;

    update(dt);
    render();

    requestAnimationFrame(
        gameLoop
    );
}

requestAnimationFrame(gameLoop);

.getElementById("startButton")

    document
    .getElementById("startScreen")
    .style.display="none";

    showMessage(

    );

    vibrate(40);
});


/* =====================================================
   TECLADO PARA TESTE NO COMPUTADOR
===================================================== */

const keys={};

window.addEventListener(
    "keydown",
    e=>{

        keys[e.key]=true;

        if(e.key===" "){
            input.running=true;
        }

        keyboardInput();
    }
);

window.addEventListener(
    "keyup",
    e=>{

        keys[e.key]=false;

        if(e.key===" "){
            input.running=false;
        }

        keyboardInput();
    }
);

function keyboardInput(){

    let x=0;
    let y=0;

    if(keys["w"]||keys["ArrowUp"]) y-=1;
    if(keys["s"]||keys["ArrowDown"]) y+=1;
    if(keys["a"]||keys["ArrowLeft"]) x-=1;
    if(keys["d"]||keys["ArrowRight"]) x+=1;

    if(x!==0||y!==0){

        const length =
            Math.hypot(x,y);

        input.x=x/length;
        input.y=y/length;
    }
}
