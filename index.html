function physics(dt){

    const COUNTDOWN_DURATION = 11;
    const remaining = Math.max(0, COUNTDOWN_DURATION - s.t);
    const mark = Math.max(0, Math.ceil(remaining - 1.0));
    s.count = mark;
    btn.textContent = mark > 0 ? 'T− ' + mark : 'T+0';
    if(s.t >= COUNTDOWN_DURATION){ s.state='IGNITION'; s.t=0; }
  } else if(s.state==='IGNITION'){
    s.thrust=Math.min(8.2e6,s.thrust+dt*4.55e6);

    s.thrust=8.2e6; s.mass=140000+s.fuel; s.fuel=Math.max(0,s.fuel-dt*1200);

    s.progress=Math.min(1,s.progress+dt*.02);

  }
}
