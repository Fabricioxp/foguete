import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

/* =====================================================

===================================================== */

===================================================== */

const MAT = {

    floor:new THREE.MeshStandardMaterial({
        color:0x252927,
        roughness:1
    }),

    wall:new THREE.MeshStandardMaterial({
        color:0x5b625d,
        roughness:.95
    }),

    wallDark:new THREE.MeshStandardMaterial({
        color:0x343a36,
        roughness:1
    }),

    dirty:new THREE.MeshStandardMaterial({
        color:0x29302c,
        roughness:1
    }),

    metal:new THREE.MeshStandardMaterial({
        color:0x3e4945,
        roughness:.65,
        metalness:.5
    }),

    rust:new THREE.MeshStandardMaterial({
        color:0x593c2c,
        roughness:.95
    }),

    wood:new THREE.MeshStandardMaterial({
        color:0x493427,
        roughness:.9
    }),

    mattress:new THREE.MeshStandardMaterial({
        color:0x77766b,
        roughness:1
    }),

    glass:new THREE.MeshStandardMaterial({
        color:0x63808a,
        transparent:true,
        opacity:.28,
        roughness:.25,
        metalness:.25
    }),

    vegetation:new THREE.MeshStandardMaterial({
        color:0x263d26,
        roughness:1
    }),

    skin:new THREE.MeshStandardMaterial({
        color:0x78916b,
        roughness:.9
    }),

    blood:new THREE.MeshStandardMaterial({
        color:0x4c1212,
        roughness:1
    })

};

/* =====================================================
   COLISÕES
===================================================== */

const colliders = [];
const hidingPlaces = [];
const infected = [];

function collider(x,z,w,d,type="solid"){

    colliders.push({
        minX:x-w/2,
        maxX:x+w/2,
        minZ:z-d/2,
        maxZ:z+d/2,
        type
    });
}

function collides(position,radius=.55){

    for(const c of colliders){

        if(c.type !== "solid") continue;

        const px = Math.max(
            c.minX,
            Math.min(position.x,c.maxX)
        );

        const pz = Math.max(
            c.minZ,
            Math.min(position.z,c.maxZ)
        );

        const dx = position.x-px;
        const dz = position.z-pz;

        if(dx*dx+dz*dz < radius*radius)
            return true;
    }

    return false;
}

/* =====================================================
   OBJETOS
===================================================== */

function box(x,y,z,w,h,d,material,collision=true){

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        material
    );

    mesh.position.set(x,y,z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    if(collision)
        collider(x,z,w,d);

    return mesh;
}

function cylinder(x,y,z,r,h,material,collision=false){

    const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(r,r,h,10),
        material
    );

    mesh.position.set(x,y,z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    if(collision)
        collider(x,z,r*2,r*2);

    return mesh;
}

/* =====================================================
   PISO DO HOSPITAL
===================================================== */

const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(110,90),
    MAT.floor
);

floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;

scene.add(floor);

/* AZULEJOS / MARCAS DO PISO */

function floorStain(x,z,w,d,color=0x171b18){

    const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(w,d),
        new THREE.MeshBasicMaterial({
            color,
            transparent:true,
            opacity:.5
        })
    );

    mesh.rotation.x = -Math.PI/2;
    mesh.position.set(x,.015,z);
    scene.add(mesh);
}

/* =====================================================
   PAREDES
===================================================== */

function wall(x,z,w,d,h=5){

    box(x,h/2,z,w,h,d,MAT.wall,true);

    /* faixa inferior hospitalar */

    const stripe = box(
        x,
        1.15,
        z,
        w+.03,
        .28,
        d+.04,
        MAT.wallDark,
        false
    );

    return stripe;
}

        leaf.rotation.z=(Math.random()-.5)*1;
        leaf.rotation.x=(Math.random()-.5)*1;

function createInfected(x,z,type="walker"){

    const enemy=new THREE.Group();

    const skin=MAT.skin.clone();

    const torso=new THREE.Mesh(
        new THREE.CapsuleGeometry(.55,.95,5,10),
        new THREE.MeshStandardMaterial({
            color:type==="patient"?0x657d62:0x4e6a4f,
            roughness:.9
        })
    );

    torso.position.y=1.8;

    const enemyHead=new THREE.Mesh(
        new THREE.SphereGeometry(.55,14,14),
        skin
    );

    enemyHead.position.y=3.2;

    const leg1=capsule(0x303a2f,.22,.85);
    const leg2=capsule(0x303a2f,.22,.85);

    leg1.position.set(-.25,.55,0);
    leg2.position.set(.25,.55,0);

    const arm1=capsule(0x63785c,.17,1);
    const arm2=capsule(0x63785c,.17,1);

    arm1.position.set(-.65,1.9,0);
    arm2.position.set(.65,1.9,0);

    enemy.add(
        torso,
        enemyHead,
        leg1,
        leg2,
        arm1,
        arm2
    );

    enemy.position.set(x,0,z);

    scene.add(enemy);

    infected.push({
        mesh:enemy,
        leg1,
        leg2,
        arm1,
        arm2,
        home:new THREE.Vector3(x,0,z),
        direction:Math.random()*Math.PI*2,
        speed:type==="runner"?3.8:1.2,
        type,
        state:"patrol",
        attackCooldown:0,
        cycle:Math.random()*10
    });
}

/* =====================================================
   ESTADO
===================================================== */

const state={
    health:100,
    stamina:100,
    battery:100,
    flashlight:true,
    crouching:false,
    hidden:false,
    velocity:new THREE.Vector3(),
    walkCycle:0,
    noise:0
};

const input={
    x:0,
    z:0,
    running:false
};

/* =====================================================
   MOVIMENTO
===================================================== */

function movePlayer(delta){

    if(state.hidden)return;

    const direction=new THREE.Vector3(
        input.x,
        0,
        input.z
    );

    if(direction.length()>1)
        direction.normalize();

    const moving=direction.length()>.04;

    const running=
        input.running &&
        state.stamina>1 &&
        !state.crouching;

    let speed=5.8;

    if(running)speed=8.6;
    if(state.crouching)speed=3;

    const target=direction.multiplyScalar(speed);

    const acceleration=moving?18:14;

    state.velocity.x +=
        (target.x-state.velocity.x) *
        Math.min(delta*acceleration,1);

    state.velocity.z +=
        (target.z-state.velocity.z) *
        Math.min(delta*acceleration,1);

    if(!moving){

        state.velocity.x*=Math.pow(.002,delta);
        state.velocity.z*=Math.pow(.002,delta);

        state.noise=0;
    }

    const testX=player.position.clone();
    testX.x+=state.velocity.x*delta;

    if(!collides(testX,.55))
        player.position.x=testX.x;
    else
        state.velocity.x=0;

    const testZ=player.position.clone();
    testZ.z+=state.velocity.z*delta;

    if(!collides(testZ,.55))
        player.position.z=testZ.z;
    else
        state.velocity.z=0;

    if(moving){

        const angle=Math.atan2(
            direction.x,
            direction.z
        );

        let diff=angle-player.rotation.y;

        diff=Math.atan2(
            Math.sin(diff),
            Math.cos(diff)
        );

        player.rotation.y+=
            diff*Math.min(delta*14,1);

        state.walkCycle+=delta*
            (running?15:state.crouching?7:10);

        const swing=Math.sin(state.walkCycle)*
            (running?.7:.42);

        leftLeg.rotation.x=swing;
        rightLeg.rotation.x=-swing;

        leftArm.rotation.x=-swing*.65;
        rightArm.rotation.x=swing*.65;

        state.noise=
            state.crouching?.08:
            running?1:.35;
    }

    if(running)
        state.stamina-=24*delta;
    else
        state.stamina+=18*delta;

    state.stamina=THREE.MathUtils.clamp(
        state.stamina,
        0,
        100
    );

    const targetScale=state.crouching?.7:1;

    player.scale.y+=
        (targetScale-player.scale.y)*
        Math.min(delta*12,1);
}

/* =====================================================
   LANTERNA REALISTA
===================================================== */

function updateFlashlight(delta,time){

    if(state.flashlight){

        state.battery-=.09*delta;

        if(state.battery<=0){
            state.battery=0;
            state.flashlight=false;
        }
    }

    const forward=new THREE.Vector3(
        0,0,1
    ).applyQuaternion(player.quaternion);

    const moving=Math.hypot(
        state.velocity.x,
        state.velocity.z
    );

    const swayX=Math.sin(time*8)*.035*
        Math.min(moving,1);

    const swayY=Math.abs(
        Math.cos(time*12)
    )*.035*Math.min(moving,1);

    flashlightModel.rotation.z=
        Math.sin(time*8)*.06*
        Math.min(moving,1);

    const pos=player.position.clone();

    pos.add(
        forward.clone().multiplyScalar(.75)
    );

    pos.y=2.5+swayY;

    flashlight.position.copy(pos);

    const target=player.position.clone();

    target.add(
        forward.clone().multiplyScalar(18)
    );

    target.x+=swayX;
    target.y=.8;

    flashlightTarget.position.copy(target);

    flashlight.intensity=
        state.flashlight?19:0;

    flashlightGlow.position.copy(player.position);
    flashlightGlow.position.y=2.3;

    flashlightGlow.intensity=
        state.flashlight?1.8:.15;
}

/* =====================================================
   VISIBILIDADE DOS INFECTADOS

   Raycasting impede detecção através de paredes.
===================================================== */

const raycaster=new THREE.Raycaster();

function canSeePlayer(enemy){

    if(state.hidden)return false;

    const origin=enemy.mesh.position.clone();
    origin.y=2.5;

    const target=player.position.clone();
    target.y=2;

    const direction=target.clone().sub(origin);

    const distance=direction.length();

    if(distance>14)return false;

    direction.normalize();

    raycaster.set(origin,direction);

    const wallObjects=scene.children.filter(
        obj=>obj.userData.isWall
    );

    /* A distância é limitada e a visão também depende
       da distância e do movimento do jogador. */

    if(
        distance<6 ||
        (distance<11 && state.noise>.3)
    )
        return true;

    return false;
}

/* =====================================================
   IA DOS INFECTADOS
===================================================== */

function updateInfected(delta,time){

    for(const enemy of infected){

        enemy.attackCooldown-=delta;

        const distance=
            enemy.mesh.position.distanceTo(
                player.position
            );

        const sees=canSeePlayer(enemy);

        if(sees)
            enemy.state="chase";
        else if(
            enemy.state==="chase" &&
            distance>18
        )
            enemy.state="patrol";

        let direction=new THREE.Vector3();

        if(enemy.state==="chase"){

            direction
                .subVectors(
                    player.position,
                    enemy.mesh.position
                )
                .setY(0);

            if(direction.length()>0)
                direction.normalize();

        }else{

            enemy.direction+=
                Math.sin(time+enemy.cycle)*.2*delta;

            direction.set(
                Math.sin(enemy.direction),
                0,
                Math.cos(enemy.direction)
            );
        }

        const speed=
            enemy.state==="chase"
            ?enemy.speed
            :enemy.speed*.55;

        const next=enemy.mesh.position.clone();

        next.addScaledVector(
            direction,
            speed*delta
        );

        if(!collides(next,.5))
            enemy.mesh.position.copy(next);
        else
            enemy.direction+=Math.PI/2;

        if(direction.length()>0){

            const angle=Math.atan2(
                direction.x,
                direction.z
            );

            enemy.mesh.rotation.y=THREE.MathUtils.lerp(
                enemy.mesh.rotation.y,
                angle,
                delta*7
            );
        }

        enemy.cycle+=delta*
            (enemy.state==="chase"?12:6);

        const swing=Math.sin(enemy.cycle)*.45;

        enemy.leg1.rotation.x=swing;
        enemy.leg2.rotation.x=-swing;

        enemy.arm1.rotation.x=-swing;
        enemy.arm2.rotation.x=swing;

        if(
            distance<1.5 &&
            !state.hidden &&
            enemy.attackCooldown<=0
        ){

            state.health-=10;

            enemy.attackCooldown=1.2;

            document.getElementById(
                "damage"
            ).style.opacity=.8;

            setTimeout(()=>{
                document.getElementById(
                    "damage"
                ).style.opacity=0;
            },150);

            showMessage(
                "UM INFECTADO ESTÁ ATACANDO!"
            );

            if(state.health<=0){

                state.health=0;

                showMessage(
                    "VOCÊ MORREU."
                );

                setTimeout(()=>{
                    player.position.set(-10,0,-38);
                    state.health=100;
                },2500);
            }
        }
    }
}

/* =====================================================
   ESCONDER
===================================================== */

function nearestHide(){

    let result=null;
    let closest=2.5;

    for(const hide of hidingPlaces){

        const d=player.position.distanceTo(
            hide.position
        );

        if(d<closest){

            closest=d;
            result=hide;
        }
    }

    return result;
}

function toggleHide(){

    if(state.hidden){

        state.hidden=false;
        player.visible=true;

        showMessage("VOCÊ SAIU DO ESCONDERIJO.");

        return;
    }

    const hide=nearestHide();

    if(!hide){

        showMessage(
            "NÃO HÁ NENHUM ESCONDERIJO PRÓXIMO."
        );

        return;
    }

    state.hidden=true;
    player.visible=false;

    showMessage(
        hide.type==="locker"
        ?"VOCÊ ENTROU NO ARMÁRIO."
        :hide.type==="bed"
        ?"VOCÊ SE ESCONDEU PRÓXIMO À CAMA."
        :"VOCÊ SE ESCONDEU."
    );
}

/* =====================================================
   CÂMERA
===================================================== */

function updateCamera(delta){

    const desired=new THREE.Vector3(
        player.position.x,
        20,
        player.position.z+14
    );

    camera.position.lerp(
        desired,
        Math.min(delta*6,1)
    );

    const look=player.position.clone();
    look.y=1;

    camera.lookAt(look);
}

/* =====================================================
   JOYSTICK
===================================================== */

const joystickArea=document.getElementById(
    "joystickArea"
);

const joyStick=document.getElementById(
    "joyStick"
);

let pointer=null;

function updateJoystick(x,y){

    const rect=joystickArea.getBoundingClientRect();

    let dx=x-rect.left-75;
    let dy=y-rect.top-75;

    const distance=Math.hypot(dx,dy);
    const limit=45;

    if(distance>limit){

        dx=dx/distance*limit;
        dy=dy/distance*limit;
    }

    input.x=dx/limit;
    input.z=dy/limit;

    joyStick.style.transform=
        `translate(${dx}px,${dy}px)`;
}

function resetJoystick(){

    pointer=null;
    input.x=0;
    input.z=0;

    joyStick.style.transform=
        "translate(0,0)";
}

joystickArea.addEventListener(
    "pointerdown",
    e=>{

        pointer=e.pointerId;

        joystickArea.setPointerCapture(pointer);

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);

joystickArea.addEventListener(
    "pointermove",
    e=>{

        if(e.pointerId===pointer)
            updateJoystick(
                e.clientX,
                e.clientY
            );
    }
);

joystickArea.addEventListener(
    "pointerup",
    resetJoystick
);

joystickArea.addEventListener(
    "pointercancel",
    resetJoystick
);

/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    document.getElementById("healthFill")
    .style.width=state.health+"%";

    document.getElementById("staminaFill")
    .style.width=state.stamina+"%";

    document.getElementById("batteryFill")
    .style.width=state.battery+"%";

    const interaction=
        document.getElementById("interaction");

    if(state.hidden){

        interaction.textContent=
            "AÇÃO: SAIR DO ESCONDERIJO";

        interaction.classList.add("show");

        return;
    }

    const hide=nearestHide();

    if(hide){

        interaction.textContent=
            hide.type==="locker"
            ?"AÇÃO: ENTRAR NO ARMÁRIO"
            :"AÇÃO: ESCONDER-SE";

        interaction.classList.add("show");

    }else{

        interaction.classList.remove("show");
    }
}

/* =====================================================
   MENSAGENS
===================================================== */

let messageTimer;

function showMessage(text){

    clearTimeout(messageTimer);

    const message=
        document.getElementById("message");

    message.textContent=text;
    message.classList.add("show");

    messageTimer=setTimeout(()=>{
        message.classList.remove("show");
    },3000);
}

/* =====================================================
   FULLSCREEN
===================================================== */

async function requestFullscreen(){

    try{

        if(document.documentElement.requestFullscreen)
            await document.documentElement.requestFullscreen();

    }catch(e){}

    window.scrollTo(0,1);
}

/* =====================================================
   INÍCIO
===================================================== */

let playing=false;

document.getElementById("start")
.addEventListener("click",async()=>{

    await requestFullscreen();

    document.getElementById("menu")
    .style.display="none";

    playing=true;

    showMessage(
        "O HOSPITAL ESTÁ ABANDONADO HÁ ANOS..."
    );

    setTimeout(()=>{
        showMessage(
            "MAS VOCÊ NÃO ESTÁ SOZINHO."
        );
    },4000);
});

/* =====================================================
   ANIMAÇÃO
===================================================== */

function animate(){

    requestAnimationFrame(animate);

    const delta=Math.min(
        clock.getDelta(),
        .05
    );

    const time=clock.elapsedTime;

    if(playing){

        movePlayer(delta);
        updateFlashlight(delta,time);
        updateInfected(delta,time);
        updateCamera(delta);
        updateHUD();

        for(const item of emergencyLights){

            const flicker=Math.sin(
                time*9+item.seed
            );

            item.light.intensity=
                flicker>.8
                ?item.intensity*.25
                :item.intensity;
        }
    }

    renderer.render(scene,camera);
}

camera.position.set(
    player.position.x,
    20,
    player.position.z+14
);

camera.lookAt(player.position);

animate();

/* =====================================================
   RESIZE
===================================================== */

addEventListener("resize",()=>{

    camera.aspect=
        innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );
});
