<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

/* =====================================================
   CENA
===================================================== */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x060809);
scene.fog=new THREE.Fog(0x060809,20,72);

const camera=new THREE.PerspectiveCamera(
    52,
    innerWidth/innerHeight,
    .1,
    200
);

const renderer=new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.5)
);

renderer.setSize(innerWidth,innerHeight);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

document
.getElementById("game")
.appendChild(renderer.domElement);

const clock=new THREE.Clock();

/* =====================================================
   ILUMINAÇÃO
===================================================== */

scene.add(
    new THREE.HemisphereLight(
        0x53646b,
        0x030303,
        1.2
    )
);

const moonLight=new THREE.DirectionalLight(
    0x7a8d94,
    .4
);

moonLight.position.set(10,25,10);

scene.add(moonLight);

/* =====================================================
   MATERIAIS
===================================================== */

const mat={

    floor:new THREE.MeshStandardMaterial({
        color:0x1c2021,
        roughness:.95
    }),

    wall:new THREE.MeshStandardMaterial({
        color:0x3b4244,
        roughness:.88
    }),

    wallDark:new THREE.MeshStandardMaterial({
        color:0x252b2d,
        roughness:.95
    }),

    wood:new THREE.MeshStandardMaterial({
        color:0x4b3425,
        roughness:.8
    }),

    metal:new THREE.MeshStandardMaterial({
        color:0x384247,
        roughness:.6,
        metalness:.35
    }),

    door:new THREE.MeshStandardMaterial({
        color:0x3d271b,
        roughness:.8
    }),

    concrete:new THREE.MeshStandardMaterial({
        color:0x292d2e,
        roughness:.9
    })

};

/* =====================================================
   SISTEMA DE COLISÃO
===================================================== */

const colliders=[];
const wallMeshes=[];
const interactables=[];
const safeSpawnPoints=[];

function addCollider(x,z,w,d,type="solid",data=null){

    const collider={

        minX:x-w/2,
        maxX:x+w/2,
        minZ:z-d/2,
        maxZ:z+d/2,

        x,z,w,d,

        type,
        data

    };

    colliders.push(collider);

    return collider;
}

function positionCollides(position,radius=.6){

    for(const c of colliders){

        if(c.type==="openDoor")
            continue;

        const closestX=Math.max(
            c.minX,
            Math.min(position.x,c.maxX)
        );

        const closestZ=Math.max(
            c.minZ,
            Math.min(position.z,c.maxZ)
        );

        const dx=position.x-closestX;
        const dz=position.z-closestZ;

        if(dx*dx+dz*dz<radius*radius)
            return true;
    }

    return false;
}

/* =====================================================
   SPAWN SEGURO

   O JOGO VERIFICA A ÁREA ANTES DO NASCIMENTO.
===================================================== */

function findSafeSpawn(preferred){

    const checks=[

        preferred,

        new THREE.Vector3(-29,0,-24),
        new THREE.Vector3(-29,0,-20),
        new THREE.Vector3(-25,0,-24),
        new THREE.Vector3(-24,0,-19),

        new THREE.Vector3(-18,0,-26)

    ];

    for(const point of checks){

        if(!positionCollides(point,.9))
            return point.clone();
    }

    /* Procura uma posição automaticamente */

    for(let radius=2;radius<30;radius+=1){

        for(let angle=0;angle<Math.PI*2;angle+=.3){

            const point=new THREE.Vector3(
                preferred.x+Math.cos(angle)*radius,
                0,
                preferred.z+Math.sin(angle)*radius
            );

            if(!positionCollides(point,.9))
                return point;
        }
    }

    return new THREE.Vector3(-29,0,-24);
}

/* =====================================================
   CHÃO
===================================================== */

function createFloor(y,w,d){

    const floor=new THREE.Mesh(
        new THREE.PlaneGeometry(w,d),
        mat.floor
    );

    floor.rotation.x=-Math.PI/2;
    floor.position.y=y;

    floor.receiveShadow=true;

    scene.add(floor);

    return floor;
}

createFloor(0,78,68);

/* =====================================================
   CRIAÇÃO DE PAREDES
===================================================== */

function wall(x,z,w,d,h=5,material=mat.wall){

    const mesh=new THREE.Mesh(

        new THREE.BoxGeometry(w,h,d),

        material

    );

    mesh.position.set(
        x,
        h/2,
        z
    );

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    scene.add(mesh);

    addCollider(x,z,w,d);

    wallMeshes.push(mesh);

    /* acabamento */

    const top=new THREE.Mesh(

        new THREE.BoxGeometry(
            w+.08,
            .12,
            d+.08
        ),

        mat.metal

    );

    top.position.set(
        x,
        h+.06,
        z
    );

    scene.add(top);

    return mesh;
}

/* =====================================================
   ESTRUTURA DO PRÉDIO

   O MAPA FOI ORGANIZADO PARA EVITAR
   CORREDORES BLOQUEADOS E NASCIMENTOS
   DENTRO DE OBJETOS.
===================================================== */

/* EXTERIOR */

wall(0,-32,78,1);
wall(0,32,78,1);

wall(-38.5,0,1,64);
wall(38.5,0,1,64);

/* ÁREA DE ENTRADA E RECEPÇÃO */

wall(-20,-17,22,.7);
wall(-10,-23,.7,12);

/* CORREDOR CENTRAL */

wall(5,-24,.7,15);
wall(5,-5,.7,20);

wall(5,14,.7,15);

/* LADO DIREITO SUPERIOR */

wall(21,-18,33,.7);
wall(37,-10,.7,15);

wall(23,-2,28,.7);

/* SALAS DIREITAS */

wall(14,6,.7,15);
wall(24,13,20,.7);

wall(34,18,.7,20);

/* PARTE INFERIOR */

wall(20,26,28,.7);
wall(-5,18,21,.7);

wall(-15,25,22,.7);

/* LADO ESQUERDO */

wall(-30,10,.7,28);
wall(-20,18,20,.7);

wall(-20,4,15,.7);

/* DIVISÕES DE SALAS */

wall(-19,-7,18,.6);
wall(-26,3,10,.6);

wall(21,-10,.6,14);
wall(29,4,15,.6);

wall(-6,10,.6,16);

/* =====================================================
   DECORAÇÃO COM COLISÃO
===================================================== */

function box(x,y,z,w,h,d,material,collision=true){

    const mesh=new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        material
    );

    mesh.position.set(x,y,z);

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    scene.add(mesh);

    if(collision)
        addCollider(x,z,w,d);

    return mesh;
}

/* =====================================================
   RECEPÇÃO

   OS MÓVEIS FICAM AFASTADOS DO SPAWN.
===================================================== */

box(
    -29,1,-25,
    7,2,1.8,
    mat.wood
);

box(
    -34,1,-19,
    2.5,2,1.2,
    mat.metal
);

/* CADEIRAS */

function chair(x,z){

    box(
        x,.75,z,
        1,.25,1,
        mat.metal
    );

    box(
        x,1.35,z+.35,
        1,1.1,.15,
        mat.metal
    );
}

chair(-20,-26);
chair(-17,-26);
chair(-14,-26);

/* =====================================================
   MESAS

   POSSÍVEIS ESCONDERIJOS.
===================================================== */

const hidingPlaces=[];

function table(x,z){

    const group=new THREE.Group();

    const top=new THREE.Mesh(
        new THREE.BoxGeometry(3.6,.25,2.1),
        mat.wood
    );

    top.position.y=1.65;

    group.add(top);

    for(const lx of [-1.5,1.5]){

        for(const lz of [-.75,.75]){

            const leg=new THREE.Mesh(
                new THREE.BoxGeometry(.18,1.65,.18),
                mat.metal
            );

            leg.position.set(lx,.82,lz);

            group.add(leg);
        }
    }

    group.position.set(x,0,z);

    group.traverse(obj=>{

        if(obj.isMesh){

            obj.castShadow=true;
            obj.receiveShadow=true;

        }

    });

    scene.add(group);

    addCollider(x,z,3.6,2.1);

    hidingPlaces.push({
        type:"table",
        position:new THREE.Vector3(x,0,z),
        radius:2.5
    });
}

table(-21,-12);
table(15,-24);
table(29,10);
table(-20,15);

/* =====================================================
   ARMÁRIOS
===================================================== */

function locker(x,z){

    const group=new THREE.Group();

    const body=new THREE.Mesh(
        new THREE.BoxGeometry(2,4.4,1.5),
        mat.metal
    );

    body.position.y=2.2;

    group.add(body);

    for(const side of [-.48,.48]){

        const door=new THREE.Mesh(

            new THREE.BoxGeometry(
                .88,
                4,
                .08
            ),

            new THREE.MeshStandardMaterial({
                color:0x455158,
                roughness:.8
            })

        );

        door.position.set(
            side,
            2.2,
            -.77
        );

        group.add(door);
    }

    group.position.set(x,0,z);

    scene.add(group);

    addCollider(x,z,2,1.5);

    hidingPlaces.push({
        type:"locker",
        position:new THREE.Vector3(x,0,z),
        radius:2.8
    });
}

locker(-34,-5);
locker(30,-7);
locker(-25,22);
locker(30,21);

/* =====================================================
   PORTAS FUNCIONAIS
===================================================== */

const doors=[];

function createDoor(
    x,z,
    width=3,
    locked=false,
    requires=null
){

    const pivot=new THREE.Group();

    const doorMesh=new THREE.Mesh(

        new THREE.BoxGeometry(
            width,
            4.3,
            .22
        ),

        mat.door

    );

    doorMesh.position.set(
        width/2,
        2.15,
        0
    );

    doorMesh.castShadow=true;

    pivot.add(doorMesh);

    pivot.position.set(
        x,
        0,
        z
    );

    scene.add(pivot);

    const collider=
        addCollider(
            x+width/2,
            z,
            width,
            .4,
            "door"
        );

    const door={

        pivot,
        mesh:doorMesh,
        collider,

        open:false,
        locked,

        requires,

        x,z,

        interactionRadius:3

    };

    doors.push(door);

    interactables.push({
        type:"door",
        object:door,
        position:new THREE.Vector3(
            x+width/2,
            0,
            z
        )
    });

    return door;
}

/* PORTAS IMPORTANTES */

createDoor(-10,-17,3,false);

const state={

    health:100,
    stamina:100,
    battery:100,

    crouching:false,
    hidden:false,

    flashlight:true,

    velocity:new THREE.Vector3(),

    walkCycle:0,

};

    x:0,

/* =====================================================
   MOVIMENTO COM COLISÃO
===================================================== */

function movePlayer(delta){

    if(state.hidden)
        return;

    const direction=new THREE.Vector3(
        input.x,
        0,
        input.z
    );

    if(direction.length()>1)
        direction.normalize();

    const moving=direction.length()>.05;

    const running=

        input.running &&
        state.stamina>0 &&
        !state.crouching;

    let speed=3.4;

    if(running)
        speed=6;

    if(state.crouching)
        speed=1.75;

    const desired=
        direction.clone()
        .multiplyScalar(speed);

    state.velocity.x+=
        (desired.x-state.velocity.x)*
        Math.min(delta*12,1);

    state.velocity.z+=
        (desired.z-state.velocity.z)*
        Math.min(delta*12,1);

    if(!moving){

        state.velocity.x*=.65;
        state.velocity.z*=.65;

    }

    /* Movimento separado evita atravessar quinas */

    const nextX=player.position.clone();

    nextX.x+=
        state.velocity.x*delta;

    if(!positionCollides(nextX,.62))
        player.position.x=nextX.x;
    else
        state.velocity.x=0;

    const nextZ=player.position.clone();

    nextZ.z+=
        state.velocity.z*delta;

    if(!positionCollides(nextZ,.62))
        player.position.z=nextZ.z;
    else
        state.velocity.z=0;

    /* rotação */

    if(moving){

        const targetAngle=Math.atan2(
            direction.x,
            direction.z
        );

        let difference=
            targetAngle-player.rotation.y;

        difference=Math.atan2(
            Math.sin(difference),
            Math.cos(difference)
        );

        player.rotation.y+=
            difference*
            Math.min(delta*12,1);

        state.walkCycle+=
            delta*
            (running?14:state.crouching?5:8);

        const swing=
            Math.sin(state.walkCycle)*
            (running?.75:.4);

        leftLeg.rotation.x=swing;
        rightLeg.rotation.x=-swing;

        leftArm.rotation.x=-swing*.75;
        rightArm.rotation.x=swing*.75;

    }else{

        leftLeg.rotation.x*=.7;
        rightLeg.rotation.x*=.7;

        leftArm.rotation.x*=.7;
        rightArm.rotation.x*=.7;

    }

    /* abaixar */

    const targetScale=
        state.crouching?.68:1;

    player.scale.y+=
        (targetScale-player.scale.y)*
        Math.min(delta*12,1);

    /* stamina */

    if(running)
        state.stamina-=26*delta;
    else
        state.stamina+=17*delta;

    state.stamina=
        THREE.MathUtils.clamp(
            state.stamina,
            0,
            100
        );

    /* barulho */

    if(!moving)
        state.noise=0;
    else if(state.crouching)
        state.noise=.12;
    else if(running)
        state.noise=1;
    else
        state.noise=.4;
}

function nearestHide(){

    let result=null;
    let closest=Infinity;

    hidingPlaces.forEach(place=>{

        const distance=
            player.position.distanceTo(
                place.position
            );

        if(
            distance<place.radius &&
            distance<closest
        ){

            result=place;
            closest=distance;

        }

    });

    return result;
}

function toggleHide(){

    if(state.hidden){

        state.hidden=false;
        player.visible=true;
        state.currentHide=null;

        showMessage(
            "VOCÊ SAIU DO ESCONDERIJO."
        );

        return;
    }

    const place=nearestHide();

    if(!place){

        showMessage(
            "NÃO EXISTE UM ESCONDERIJO PRÓXIMO."
        );

        return;
    }

    state.hidden=true;
    state.currentHide=place;

    player.visible=false;

    showMessage(

        place.type==="locker"

        ?"VOCÊ ENTROU NO ARMÁRIO."

        :"VOCÊ SE ESCONDEU SOB A MESA."

    );
}

/* =====================================================
   VISÃO DO MONSTRO

   RAYCAST IMPEDE QUE ELE ENXERGUE
   ATRAVÉS DAS PAREDES.
===================================================== */

const raycaster=new THREE.Raycaster();

function monsterCanSee(){

    if(state.hidden)
        return false;

    const origin=
        monster.position.clone();

    origin.y=3;

    const target=
        player.position.clone();

    target.y=2;

    const direction=
        target.clone().sub(origin);

    const distance=direction.length();

    if(distance>20)
        return false;

    direction.normalize();

    const forward=
        new THREE.Vector3(0,0,-1)
        .applyQuaternion(monster.quaternion)
        .normalize();

    if(
        forward.angleTo(direction)>
        Math.PI*.42
    )
        return false;

    raycaster.set(origin,direction);

    const hits=
        raycaster.intersectObjects(
            wallMeshes,
            false
        );

    if(
        hits.length &&
        hits[0].distance<distance
    )
        return false;

    return true;
}

function moveMonster(target,speed,delta){

    const direction=
        new THREE.Vector3(

            target.x-monster.position.x,
            0,
            target.z-monster.position.z

        );

    if(direction.length()<.5)
        return true;

    direction.normalize();

    const angle=Math.atan2(
        direction.x,
        direction.z
    );

    let diff=
        angle-monster.rotation.y;

    diff=Math.atan2(
        Math.sin(diff),
        Math.cos(diff)
    );

    monster.rotation.y+=
        diff*
        Math.min(delta*6,1);

    const nextX=monster.position.clone();

    nextX.x+=direction.x*speed*delta;

    if(!positionCollides(nextX,.7))
        monster.position.x=nextX.x;

    const nextZ=monster.position.clone();

    nextZ.z+=direction.z*speed*delta;

    if(!positionCollides(nextZ,.7))
        monster.position.z=nextZ.z;

    return false;
}

function updateMonster(delta,time){

    const sees=monsterCanSee();

    const distance=
        monster.position.distanceTo(
            player.position
        );

    if(sees){

        monsterState.mode="chase";

        monsterState.target.copy(
            player.position
        );

        monsterState.timer=6;

    }

    if(
        state.noise>.8 &&
        distance<18 &&
        !state.hidden &&
        !sees
    ){

        monsterState.mode="investigate";

        monsterState.target.copy(
            player.position
        );
    }

    if(monsterState.mode==="patrol"){

        const target=
            monsterState.patrol[
                monsterState.patrolIndex
            ];

        if(moveMonster(target,2,delta)){

            monsterState.patrolIndex=
                (monsterState.patrolIndex+1)%
                monsterState.patrol.length;
        }
    }

    if(monsterState.mode==="investigate"){

        if(
            moveMonster(
                monsterState.target,
                3,
                delta
            )
        ){

            monsterState.mode="search";
            monsterState.timer=5;
        }
    }

    if(monsterState.mode==="chase"){

        if(sees){

            monsterState.target.copy(
                player.position
            );

            monsterState.timer=5;

        }else{

            monsterState.timer-=delta;

        }

        moveMonster(
            monsterState.target,
            5,
            delta
        );

        if(monsterState.timer<=0){

            monsterState.mode="search";
            monsterState.timer=5;

        }
    }

    if(monsterState.mode==="search"){

        monsterState.timer-=delta;

        const point=
            monsterState.target.clone();

        point.x+=Math.sin(time*1.5)*3;
        point.z+=Math.cos(time*1.2)*3;

        moveMonster(
            point,
            2.4,
            delta
        );

        if(monsterState.timer<=0)
            monsterState.mode="patrol";
    }

    if(
        distance<1.7 &&
        !state.hidden
    ){

        attack();

    }
}

function attack(){

    const now=performance.now();

    if(now-monsterState.attackTime<1100)
        return;

    monsterState.attackTime=now;

    state.health-=18;

    state.health=Math.max(
        0,
        state.health
    );

    const damage=
        document.getElementById("damage");

    damage.style.opacity=.8;

    setTimeout(
        ()=>damage.style.opacity=0,
        180
    );

    if(state.health<=0){

        showMessage(
            "A CRIATURA ENCONTROU VOCÊ."
        );

        setTimeout(
            ()=>location.reload(),
            2200
        );
    }
}

/* =====================================================
   INTERAÇÃO
===================================================== */

function getNearestInteraction(){

    let result=null;
    let distanceMin=3;

    interactables.forEach(object=>{

        if(
            object.type==="item" &&
            !object.object.active
        )
            return;

        const distance=
            player.position.distanceTo(
                object.position
            );

        if(distance<distanceMin){

            distanceMin=distance;
            result=object;

        }

    });

    return result;
}

function interact(){

    if(state.hidden){

        toggleHide();
        return;
    }

    const hide=nearestHide();

    if(hide){

        toggleHide();
        return;
    }

    const target=
        getNearestInteraction();

    if(!target){

        showMessage(
            "NÃO HÁ NADA PARA INTERAGIR."
        );

        return;
    }

    if(target.type==="item"){

        const item=target.object;

        if(item.type==="securityKey"){

            inventory.securityKey=true;

            showMessage(
                "VOCÊ ENCONTROU A CHAVE DA SALA DE SEGURANÇA."
            );
        }

        if(item.type==="fuse"){

            inventory.fuse=true;

            showMessage(
                "VOCÊ ENCONTROU UM FUSÍVEL."
            );
        }

        item.active=false;

        scene.remove(item.mesh);

        return;
    }

    if(target.type==="powerBox"){

        if(!inventory.fuse){

            showMessage(
                "ESTÁ FALTANDO UM FUSÍVEL."
            );

            return;
        }

        inventory.powerOn=true;

        document
        .getElementById("objective")
        .textContent=
            "A ENERGIA FOI RESTAURADA. ENCONTRE A PRÓXIMA SAÍDA.";

        showMessage(
            "A ENERGIA DO PRÉDIO FOI RESTAURADA."
        );

        return;
    }

    if(target.type==="door"){

        const door=target.object;

        if(
            door.locked &&
            door.requires==="securityKey" &&
            !inventory.securityKey
        ){

            showMessage(
                "A PORTA ESTÁ TRANCADA. PRECISO DE UMA CHAVE."
            );

            return;
        }

        if(
            door.locked &&
            door.requires==="powerOn" &&
            !inventory.powerOn
        ){

            showMessage(
                "A PORTA PRECISA DE ENERGIA."
            );

            return;
        }

        door.locked=false;

        door.open=!door.open;

        door.collider.type=
            door.open
            ?"openDoor"
            :"door";
    }
}

/* =====================================================
   ANIMAÇÃO DAS PORTAS
===================================================== */

function updateDoors(delta){

    doors.forEach(door=>{

        const targetRotation=
            door.open
            ?-Math.PI/2
            :0;

        door.pivot.rotation.y+=
            (
                targetRotation-
                door.pivot.rotation.y
            )*
            Math.min(delta*6,1);
    });
}

/* =====================================================

const joystickArea=
    document.getElementById(
        "joystickArea"
    );

const joystick=
    document.getElementById(
        "joyStick"
    );

let activePointer=null;

function updateJoystick(x,y){

    const rect=
        joystickArea.getBoundingClientRect();

    let dx=x-rect.left-75;
    let dy=y-rect.top-75;

    const distance=
        Math.hypot(dx,dy);

    const max=40;

    if(distance>max){

        dx=dx/distance*max;
        dy=dy/distance*max;
    }

    input.x=dx/max;
    input.z=dy/max;

    joystick.style.transform=
        `translate(${dx}px,${dy}px)`;
}

function resetJoystick(){

    activePointer=null;

    input.x=0;
    input.z=0;

    joystick.style.transform=
        "translate(0,0)";
}

joystickArea.addEventListener(
    "pointerdown",
    e=>{

        activePointer=e.pointerId;

        joystickArea.setPointerCapture(
            e.pointerId
        );

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);

joystickArea.addEventListener(
    "pointermove",
    e=>{

        if(e.pointerId===activePointer)
            updateJoystick(
                e.clientX,
                e.clientY
            );
    }
);

joystickArea.addEventListener(
    "pointerup",
    resetJoystick
);

joystickArea.addEventListener(
    "pointercancel",
    resetJoystick
);

            text.textContent=

async function requestFullscreen(){

    try{

        if(
            document.documentElement
            .requestFullscreen

            await document
            .documentElement
            .requestFullscreen();
        }

    }catch(error){}

    window.scrollTo(0,1);
}

/* =====================================================
   LOOP PRINCIPAL
===================================================== */

function animate(){

    requestAnimationFrame(animate);

    const delta=
        Math.min(
            clock.getDelta(),
            .05
        );

    const time=
        clock.elapsedTime;

    if(playing){

        movePlayer(delta);

        updateMonster(
            delta,
            time
        );

        updateFlashlight(delta);

        updateDoors(delta);

        updateCamera(delta);

        updateHUD();
    }

    renderer.render(
        scene,
        camera
    );
}
