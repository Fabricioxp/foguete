import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

/* ==========================================

    250
);

const renderer=
new THREE.WebGLRenderer({

    antialias:true,

    powerPreference:
    "high-performance"

});

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        1.5
    )
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
THREE.PCFSoftShadowMap;

renderer.outputColorSpace=
THREE.SRGBColorSpace;

document
.getElementById("game")
.appendChild(renderer.domElement);

const clock=
new THREE.Clock();

/* ==========================================
   ILUMINAÇÃO AMBIENTAL
========================================== */

const hemisphere=
new THREE.HemisphereLight(
    0x5e7478,
    0x030303,
    .8
);

scene.add(hemisphere);

const ambient=
new THREE.AmbientLight(
    0x172025,
    .35
);

scene.add(ambient);

/* ==========================================
   MATERIAIS
========================================== */

const materials={

floor:
new THREE.MeshStandardMaterial({

    color:0x202526,
    roughness:.95

}),

wall:
new THREE.MeshStandardMaterial({

    color:0x464b4b,
    roughness:.9

}),

dirtyWall:
new THREE.MeshStandardMaterial({

    color:0x323839,
    roughness:.95

}),

darkWall:
new THREE.MeshStandardMaterial({

    color:0x222728,
    roughness:1

}),

wood:
new THREE.MeshStandardMaterial({

    color:0x4a3224,
    roughness:.82

}),

oldWood:
new THREE.MeshStandardMaterial({

    color:0x30221a,
    roughness:.95

}),

metal:
new THREE.MeshStandardMaterial({

    color:0x3b4549,
    roughness:.6,
    metalness:.45

}),

rust:
new THREE.MeshStandardMaterial({

    color:0x5a3928,
    roughness:.95,
    metalness:.2

}),

door:
new THREE.MeshStandardMaterial({

    color:0x412b20,
    roughness:.85

}),

paper:
new THREE.MeshStandardMaterial({

    color:0x777166,
    roughness:1

})

};

/* ==========================================
   COLISÕES
========================================== */

const colliders=[];
const wallMeshes=[];
const interactables=[];
const hidingPlaces=[];

function addCollider(x,z,w,d,type="solid"){

    const collider={

        minX:x-w/2,
        maxX:x+w/2,

        minZ:z-d/2,
        maxZ:z+d/2,

        x,z,w,d,

        type

    };

    colliders.push(collider);

    return collider;
}

function positionCollides(position,radius=.55){

    for(const c of colliders){

        if(c.type==="open")
            continue;

        const closestX=
        Math.max(
            c.minX,
            Math.min(
                position.x,
                c.maxX
            )
        );

        const closestZ=
        Math.max(
            c.minZ,
            Math.min(
                position.z,
                c.maxZ
            )
        );

        const dx=
        position.x-closestX;

        const dz=
        position.z-closestZ;

        if(
            dx*dx+dz*dz<
            radius*radius
        )
            return true;
    }

    return false;
}

/* ==========================================
   FUNÇÕES DE OBJETOS
========================================== */

function createBox(
    x,y,z,
    w,h,d,
    material,
    collision=true
){

    const mesh=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            w,h,d
        ),

        material

    );

    mesh.position.set(
        x,y,z
    );

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    scene.add(mesh);

    if(collision)
        addCollider(
            x,z,w,d
        );

    return mesh;
}

function createCylinder(
    x,y,z,
    radius,height,
    material,
    collision=false
){

    const mesh=
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            radius,
            radius,
            height,
            12
        ),

        material

    );

    mesh.position.set(
        x,y,z
    );

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    scene.add(mesh);

    if(collision)
        addCollider(
            x,z,
            radius*2,
            radius*2
        );

    return mesh;
}

/* ==========================================
   CHÃO PRINCIPAL
========================================== */

const floor=
new THREE.Mesh(

    new THREE.PlaneGeometry(
        90,
        74
    ),

    materials.floor

);

floor.rotation.x=
-Math.PI/2;

floor.receiveShadow=true;

scene.add(floor);

/* LINHAS E VARIAÇÕES DO PISO */

function floorMark(
    x,z,w,d,
    color=0x171a1a
){

    const mark=
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            w,d
        ),

        new THREE.MeshBasicMaterial({

            color,

            transparent:true,

            opacity:.55

        })

    );

    mark.rotation.x=
    -Math.PI/2;

    mark.position.set(
        x,
        .012,
        z
    );

    scene.add(mark);
}

/* manchas de sujeira */

floorMark(-26,-18,8,3);

/* ==========================================
   PAREDES
========================================== */

function wall(
    x,z,w,d,
    h=5,
    material=materials.wall
){

    const mesh=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            w,h,d
        ),

        material

    );

    mesh.position.set(
        x,
        h/2,
        z
    );

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    scene.add(mesh);

    addCollider(
        x,z,w,d
    );

    wallMeshes.push(mesh);

    /* acabamento superior */

    const edge=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            w+.08,
            .13,
            d+.08
        ),

        materials.darkWall

    );

    edge.position.set(
        x,
        h+.06,
        z
    );

    scene.add(edge);

    return mesh;
}

/* ==========================================
   ESTRUTURA EXTERNA
========================================== */

wall(0,-36,90,1);
wall(0,36,90,1);

wall(4,-27,.7,18);

========================================== */

function createLocker(x,z){

    const body=
    createBox(

        x,
        2.3,
        z,

        2,

/* ==========================================
   ESTADO
========================================== */

const state={

    health:100,

    stamina:100,

    battery:100,

    flashlight:true,

    crouching:false,

    hidden:false,

    velocity:
    new THREE.Vector3(),

    walkCycle:0,

    noise:0

};

const input={

    x:0,

    z:0,

    running:false

};

/* ==========================================
   MOVIMENTO MELHORADO

   MAIS RÁPIDO E RESPONSIVO.
========================================== */

function movePlayer(delta){

    if(state.hidden)
        return;

    const direction=
    new THREE.Vector3(

        input.x,
        0,
        input.z

    );

    if(direction.length()>1)
        direction.normalize();

    const moving=
    direction.length()>.03;

    const running=

        input.running &&
        state.stamina>1 &&
        !state.crouching;

    let speed=5.2;

    if(running)
        speed=8.2;

    if(state.crouching)
        speed=2.8;

    /* resposta rápida */

    const acceleration=
    moving?18:13;

    const targetVelocity=
    direction.multiplyScalar(
        speed
    );

    state.velocity.x+=
    (
        targetVelocity.x-
        state.velocity.x
    )*
    Math.min(
        acceleration*delta,
        1
    );

    state.velocity.z+=
    (
        targetVelocity.z-
        state.velocity.z
    )*
    Math.min(
        acceleration*delta,
        1
    );

    if(!moving){

        state.velocity.x*=
        Math.pow(.001,delta);

        state.velocity.z*=
        Math.pow(.001,delta);

    }

    /* COLISÃO SEPARADA */

    const nextX=
    player.position.clone();

    nextX.x+=
    state.velocity.x*delta;

    if(!positionCollides(nextX,.58))
        player.position.x=
        nextX.x;
    else
        state.velocity.x=0;

    const nextZ=
    player.position.clone();

    nextZ.z+=
    state.velocity.z*delta;

    if(!positionCollides(nextZ,.58))
        player.position.z=
        nextZ.z;
    else
        state.velocity.z=0;

    /* ROTAÇÃO */

    if(moving){

        const angle=
        Math.atan2(
            direction.x,
            direction.z
        );

        let difference=
        angle-
        player.rotation.y;

        difference=
        Math.atan2(

            Math.sin(difference),

            Math.cos(difference)

        );

        player.rotation.y+=
        difference*
        Math.min(
            delta*14,
            1
        );

        /* ANIMAÇÃO */

        state.walkCycle+=
        delta*
        (
            running
            ?15
            :state.crouching
            ?7
            :10
        );

        const swing=
        Math.sin(
            state.walkCycle
        )*
        (
            running
            ?.75
            :.42
        );

        leftLeg.rotation.x=swing;
        rightLeg.rotation.x=-swing;

        leftArm.rotation.x=
        -swing*.7;

        rightArm.rotation.x=
        swing*.7;

        state.noise=

        state.crouching
        ?.12
        :running
        ?1
        :.35;

    }else{

        state.noise=0;

        leftLeg.rotation.x*=.65;
        rightLeg.rotation.x*=.65;

        leftArm.rotation.x*=.65;
        rightArm.rotation.x*=.65;

    }

    /* ABAIXAR */

    const scale=
    state.crouching?.7:1;

    player.scale.y+=
    (
        scale-
        player.scale.y
    )*
    Math.min(
        delta*12,
        1
    );

    /* ENERGIA */

    if(running)
        state.stamina-=24*delta;
    else
        state.stamina+=22*delta;

    state.stamina=
    THREE.MathUtils.clamp(
        state.stamina,
        0,
        100
    );
}

/* ==========================================
   LANTERNA
========================================== */

function updateFlashlight(delta,time){

    if(state.flashlight){

        state.battery-=
        .1*delta;

        state.battery=
        Math.max(
            0,
            state.battery
        );

    }

    if(state.battery<=0)
        state.flashlight=false;

    const forward=
    new THREE.Vector3(
        0,0,1
    )
    .applyQuaternion(
        player.quaternion
    );

    const position=
    player.position.clone();

    position.y=2.4;

    position.add(
        forward.clone()
        .multiplyScalar(.8)
    );

    /* pequeno movimento natural */

    position.y+=
    Math.sin(time*5)*.025;

    flashlight.position.copy(
        position
    );

    const target=
    player.position.clone();

    target.y=1;

    target.add(
        forward.clone()
        .multiplyScalar(17)
    );

    flashlightTarget.position.copy(
        target
    );

    flashlight.intensity=

    state.flashlight
    ?16
    :0;

    playerGlow.position.copy(
        player.position
    );

    playerGlow.position.y=2;

    playerGlow.intensity=

    state.flashlight
    ?1.4
    :.2;
}

/* ==========================================
   ILUMINAÇÃO PISCANDO
========================================== */

function updateEnvironmentLights(time){

    for(const item of lights){

        const flicker=

        Math.sin(
            time*8+
            item.seed
        );

        if(flicker>.75)
            item.light.intensity=
            item.base*.25;
        else
            item.light.intensity=
            item.base;
    }
}

/* ==========================================
   ESCONDERIJOS
========================================== */

function nearestHide(){

    let nearest=null;

    let distance=2.5;

    for(const place of hidingPlaces){

        const d=
        player.position.distanceTo(
            place.position
        );

        if(d<distance){

            distance=d;

            nearest=place;
        }
    }

    return nearest;
}

function toggleHide(){

    if(state.hidden){

        state.hidden=false;

        player.visible=true;

        showMessage(
            "VOCÊ SAIU DO ESCONDERIJO."
        );

        return;
    }

    const hide=
    nearestHide();

    if(!hide){

        showMessage(
            "NÃO HÁ UM ESCONDERIJO PRÓXIMO."
        );

        return;
    }

    state.hidden=true;

    player.visible=false;

    showMessage(

        hide.type==="locker"

        ?"VOCÊ ENTROU NO ARMÁRIO."

        :hide.type==="bed"

        ?"VOCÊ SE ESCONDEU AO LADO DA CAMA."

        :"VOCÊ SE ESCONDEU."

    );
}

    camera.lookAt(
        lookAt
    );
}

/* ==========================================
   JOYSTICK
========================================== */

const joystickArea=
document.getElementById(
    "joystickArea"
);

const joystick=
document.getElementById(
    "joyStick"
);

let activePointer=null;

function updateJoystick(x,y){

    const rect=
    joystickArea
    .getBoundingClientRect();

    let dx=
    x-rect.left-77.5;

    let dy=
    y-rect.top-77.5;

    const distance=
    Math.hypot(dx,dy);

    const maximum=45;

    if(distance>maximum){

        dx=
        dx/distance*maximum;

        dy=
        dy/distance*maximum;

    }

    input.x=
    dx/maximum;

    input.z=
    dy/maximum;

    joystick.style.transform=
    `translate(${dx}px,${dy}px)`;
}

function resetJoystick(){

    activePointer=null;

    input.x=0;
    input.z=0;

    joystick.style.transform=
    "translate(0,0)";
}

joystickArea.addEventListener(
    "pointerdown",
    event=>{

        activePointer=
        event.pointerId;

        joystickArea
        .setPointerCapture(
            event.pointerId
        );

        updateJoystick(
            event.clientX,
            event.clientY
        );
    }
);

joystickArea.addEventListener(
    "pointermove",
    event=>{

        if(
            event.pointerId===
            activePointer
        ){

            updateJoystick(
                event.clientX,
                event.clientY
            );
        }
    }
);

joystickArea.addEventListener(
    "pointerup",
    resetJoystick
);

joystickArea.addEventListener(
    "pointercancel",
    resetJoystick
);

        );

            "show"
        );
    }
}

========================================== */

async function fullscreen(){

    try{

        if(
            document.documentElement
            .requestFullscreen
        ){

            await document
            .documentElement
            .requestFullscreen();

        }

    }catch(error){}

    window.scrollTo(0,1);
}

========================================== */

    "resize",
    ()=>{

        camera.aspect=
        innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

/* ==========================================
   LOOP PRINCIPAL
========================================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    const delta=
    Math.min(
        clock.getDelta(),
        .05
    );

    const time=
    clock.elapsedTime;

    if(playing){

        movePlayer(delta);

        updateFlashlight(
            delta,
            time
        );

        updateEnvironmentLights(
            time
        );

        updateCamera(
            delta
        );

        updateHUD();
    }

    renderer.render(
        scene,
        camera
    );
}
