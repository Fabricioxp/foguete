<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>

<title>O PRÉDIO — V3</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    position:fixed;
    inset:0;
}

#game{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    height:100dvh;
    overflow:hidden;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

/* =========================
   TELA DE ROTAÇÃO
========================= */

#rotate{
    position:fixed;
    inset:0;
    z-index:1000;

    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:#050505;
    color:white;

    text-align:center;
}

.rotateIcon{
    font-size:70px;
    animation:rotatePhone 2s infinite ease-in-out;
}

@keyframes rotatePhone{

    0%,100%{
        transform:rotate(0deg);
    }

    50%{
        transform:rotate(90deg);
    }
}

@media (orientation:portrait){

    #rotate{
        display:flex;
    }
}

/* =========================
   HUD
========================= */

#hud{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
}

#location{
    position:absolute;

    top:max(14px, env(safe-area-inset-top));
    left:max(16px, env(safe-area-inset-left));

    padding:10px 18px;

    border-left:4px solid #9d2020;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.85),
            rgba(0,0,0,.2)
        );

    color:white;
}

.hudSmall{
    font-size:8px;
    letter-spacing:3px;
    color:#777;
}

#locationName{
    margin-top:4px;

    font-size:17px;
    letter-spacing:1px;
    font-weight:bold;
}

/* =========================
   BARRAS
========================= */

#stats{

    position:absolute;

    top:max(14px, env(safe-area-inset-top));
    right:max(16px, env(safe-area-inset-right));

    width:190px;

    display:flex;
    flex-direction:column;
    gap:7px;
}

.stat{

    padding:8px 10px;

    background:rgba(0,0,0,.65);

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(4px);
}

.statLabel{

    font-size:8px;
    letter-spacing:2px;

    color:#aaa;

    margin-bottom:5px;
}

.bar{

    height:7px;

    background:#151515;

    overflow:hidden;

    border-radius:10px;
}

.fill{

    height:100%;

    width:100%;

    border-radius:10px;

    transition:width .2s;
}

#batteryFill{

    background:
        linear-gradient(
            90deg,
            #ff8a00,
            #ffe600
        );
}

#staminaFill{

    background:
        linear-gradient(
            90deg,
            #1978c9,
            #62d4ff
        );
}

#healthFill{

    background:
        linear-gradient(
            90deg,
            #8c0000,
            #ff3030
        );
}

/* =========================
   INVENTÁRIO
========================= */

#inventory{

    position:absolute;

    left:16px;

    top:115px;

    display:flex;

    gap:7px;
}

.slot{

    width:44px;
    height:44px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.72);

    border:1px solid rgba(255,255,255,.13);

    font-size:20px;

    color:#777;

    box-shadow:0 5px 15px black;
}

.slot.active{

    border-color:#e5bd2f;

    box-shadow:
        0 0 15px rgba(255,210,30,.4);
}

/* =========================
   OBJETIVO
========================= */

#objective{

    position:absolute;

    left:50%;
    top:15px;

    transform:translateX(-50%);

    padding:9px 18px;

    background:rgba(0,0,0,.55);

    color:#ddd;

    font-size:10px;

    letter-spacing:2px;

    text-align:center;
}

/* =========================
   MENSAGEM
========================= */

#message{

    position:absolute;

    top:40%;
    left:50%;

    transform:
        translate(-50%,-50%)
        scale(.9);

    width:80%;

    color:white;

    text-align:center;

    font-weight:bold;

    font-size:clamp(15px,2vw,23px);

    letter-spacing:3px;

    text-shadow:
        0 3px 8px black;

    opacity:0;

    transition:
        opacity .3s,
        transform .3s;
}

#message.show{

    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);
}

/* =========================
   CONTROLES
========================= */

#controls{

    position:fixed;
    inset:0;

    z-index:30;

    pointer-events:none;
}

#joystickArea{

    position:absolute;

    left:max(18px, env(safe-area-inset-left));
    bottom:max(18px, env(safe-area-inset-bottom));

    width:150px;
    height:150px;

    pointer-events:auto;
}

#joystickBase{

    position:absolute;

    width:125px;
    height:125px;

    left:12px;
    top:12px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(130,130,130,.15),
            rgba(0,0,0,.8)
        );

    border:
        2px solid rgba(255,255,255,.13);

    box-shadow:
        inset 0 0 30px black,
        0 8px 20px black;
}

#joystick{

    position:absolute;

    width:58px;
    height:58px;

    left:45px;
    top:45px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #9d9d9d,
            #414141 60%,
            #111
        );

    border:
        2px solid rgba(255,255,255,.25);

    box-shadow:
        0 5px 15px black;
}

#buttons{

    position:absolute;

    right:max(20px, env(safe-area-inset-right));
    bottom:max(18px, env(safe-area-inset-bottom));

    display:flex;

    align-items:flex-end;

    gap:12px;

    pointer-events:auto;
}

.gameButton{

    border-radius:50%;

    color:white;

    border:
        2px solid rgba(255,255,255,.15);

    background:
        radial-gradient(
            circle at 30% 25%,
            #666,
            #292929 60%,
            #101010
        );

    box-shadow:
        0 7px 20px black,
        inset 0 2px 8px rgba(255,255,255,.12);

    font-weight:bold;

    transition:
        transform .1s,
        filter .1s;
}

.gameButton:active,
.gameButton.active{

    transform:scale(.9);

    filter:brightness(1.5);
}

#run{

    width:78px;
    height:78px;

    border-color:
        rgba(220,50,50,.4);

    font-size:10px;
}

#action{

    width:68px;
    height:68px;

    border-color:
        rgba(255,190,30,.4);

    font-size:10px;
}

#flash{

    width:58px;
    height:58px;

    font-size:21px;

    border-color:
        rgba(255,230,70,.5);
}

/* =========================
   DANO
========================= */

#damage{

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:25;

    opacity:0;

    background:
        radial-gradient(
            circle,
            transparent 40%,
            rgba(180,0,0,.65)
        );

    transition:opacity .15s;
}

/* =========================
   TELA INICIAL
========================= */

#startScreen{

    position:fixed;

    inset:0;

    z-index:100;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            ellipse at center,
            #171717,
            #000 70%
        );

    color:white;
}

#startContent{

    text-align:center;
}

#title{

    font-size:clamp(42px,9vw,95px);

    font-weight:900;

    letter-spacing:14px;

    text-shadow:

        0 0 10px white,

        0 0 40px rgba(255,255,255,.2),

        0 8px 0 #111;
}

#subtitle{

    margin-top:10px;

    color:#777;

    font-size:11px;

    letter-spacing:6px;
}

#startButton{

    margin-top:40px;

    padding:18px 55px;

    background:
        linear-gradient(
            180deg,
            #531616,
            #190707
        );

    color:white;

    border:
        1px solid rgba(255,255,255,.25);

    border-radius:3px;

    font-weight:bold;

    letter-spacing:4px;

    box-shadow:
        0 10px 35px black;
}

#startTip{

    margin-top:20px;

    color:#555;

    font-size:9px;

    letter-spacing:2px;
}

</style>
</head>

<body>

<div id="game"></div>

<div id="rotate">

    <div class="rotateIcon">📱</div>

    <h2>GIRE O CELULAR</h2>

    <p>Este jogo deve ser jogado na horizontal.</p>

</div>

<!-- HUD -->

<div id="hud">

    <div id="location">

        <div class="hudSmall">
            LOCALIZAÇÃO
        </div>

        <div id="locationName">
            RECEPÇÃO
        </div>

    </div>

    <div id="stats">

        <div class="stat">

            <div class="statLabel">
                🔦 BATERIA
            </div>

            <div class="bar">

                <div
                    class="fill"
                    id="batteryFill"
                ></div>

            </div>

        </div>

        <div class="stat">

            <div class="statLabel">
                ⚡ ENERGIA
            </div>

            <div class="bar">

                <div
                    class="fill"
                    id="staminaFill"
                ></div>

            </div>

        </div>

        <div class="stat">

            <div class="statLabel">
                ♥ VIDA
            </div>

            <div class="bar">

                <div
                    class="fill"
                    id="healthFill"
                ></div>

            </div>

        </div>

    </div>

    <div id="inventory">

        <div
            class="slot"
            id="key1"
        >🔒</div>

        <div
            class="slot"
            id="key2"
        >🔒</div>

        <div
            class="slot"
            id="key3"
        >🔒</div>

    </div>

    <div id="objective">

        ENCONTRE AS CHAVES E ESCAPE

    </div>

    <div id="message"></div>

</div>

<!-- CONTROLES -->

<div id="controls">

    <div id="joystickArea">

        <div id="joystickBase"></div>

        <div id="joystick"></div>

    </div>

    <div id="buttons">

        <button
            class="gameButton"
            id="flash"
        >🔦</button>

        <button
            class="gameButton"
            id="action"
        >AÇÃO</button>

        <button
            class="gameButton"
            id="run"
        >CORRER</button>

    </div>

</div>

<div id="damage"></div>

<div id="startScreen">

    <div id="startContent">

        <div id="title">
            O PRÉDIO
        </div>

        <div id="subtitle">
            VOCÊ NÃO ESTÁ SOZINHO
        </div>

        <button id="startButton">
            ENTRAR
        </button>

        <div id="startTip">

            JOGUE COM O CELULAR NA HORIZONTAL

        </div>

    </div>

</div>

<!-- THREE.JS -->

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';


/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const container =
    document.getElementById("game");

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x050607);

scene.fog =
    new THREE.Fog(
        0x050607,
        18,
        65
    );


const camera =
    new THREE.PerspectiveCamera(
        48,
        window.innerWidth /
        window.innerHeight,
        .1,
        150
    );


const renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        powerPreference:
            "high-performance"
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.7
    )
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

container.appendChild(
    renderer.domElement
);


/* =========================================================
   RELÓGIO
========================================================= */

const clock =
    new THREE.Clock();


/* =========================================================
   ILUMINAÇÃO AMBIENTE
========================================================= */

/*
Esta luz é propositalmente maior que
na versão anterior.

Assim o jogador SEMPRE consegue
ver o formato do prédio.
*/

const ambientLight =
    new THREE.HemisphereLight(

        0x53616d,

        0x050505,

        1.15
    );

scene.add(
    ambientLight
);


/* =========================================================
   LUZ PRINCIPAL
========================================================= */

const mainLight =
    new THREE.DirectionalLight(

        0x9fb4c0,

        1.2
    );

mainLight.position.set(
    10,
    30,
    10
);

mainLight.castShadow=true;

mainLight.shadow.mapSize.set(
    1024,
    1024
);

mainLight.shadow.camera.left=-30;
mainLight.shadow.camera.right=30;

mainLight.shadow.camera.top=30;
mainLight.shadow.camera.bottom=-30;

scene.add(
    mainLight
);


/* =========================================================
   CHÃO
========================================================= */

const floorGeometry =
    new THREE.PlaneGeometry(
        70,
        55
    );

const floorMaterial =
    new THREE.MeshStandardMaterial({

        color:0x24272a,

        roughness:.9,

        metalness:.05
    });

const floor =
    new THREE.Mesh(

        floorGeometry,

        floorMaterial
    );

floor.rotation.x=
    -Math.PI/2;

floor.receiveShadow=true;

scene.add(
    floor
);


/* =========================================================
   CRIAR PISO DETALHADO
========================================================= */

const grid =
    new THREE.GridHelper(

        70,

        70,

        0x2d3235,

        0x1a1d1f
    );

grid.position.y=.012;

grid.material.opacity=.22;

grid.material.transparent=true;

scene.add(grid);


/* =========================================================
   PAREDES
========================================================= */

const walls=[];
const colliders=[];

function createWall(
    x,
    z,
    width,
    depth
){

    const geometry =
        new THREE.BoxGeometry(

            width,

            5,

            depth
        );

    const material =
        new THREE.MeshStandardMaterial({

            color:0x34383b,

            roughness:.85,

            metalness:.05
        });

    const wall =
        new THREE.Mesh(

            geometry,

            material
        );

    wall.position.set(

        x,

        2.5,

        z
    );

    wall.castShadow=true;

    wall.receiveShadow=true;

    scene.add(wall);

    walls.push(wall);

    colliders.push({

        x:x,

        z:z,

        width:width,

        depth:depth
    });

    /*
    DETALHE SUPERIOR DA PAREDE
    */

    const topGeometry =
        new THREE.BoxGeometry(

            width+.08,

            .18,

            depth+.08
        );

    const topMaterial =
        new THREE.MeshStandardMaterial({

            color:0x555b5e,

            roughness:.7
        });

    const top =
        new THREE.Mesh(

            topGeometry,

            topMaterial
        );

    top.position.set(

        x,

        5.08,

        z
    );

    scene.add(top);
}


/* PAREDES EXTERNAS */

createWall(0,-26,70,1);

createWall(0,26,70,1);

createWall(-34,0,1,52);

createWall(34,0,1,52);


/* RECEPÇÃO */

createWall(
    -20,
    -12,
    20,
    .8
);

createWall(
    -10,
    -4,
    .8,
    15
);


/* CORREDORES */

createWall(
    5,
    -15,
    .8,
    20
);

createWall(
    18,
    -12,
    25,
    .8
);

createWall(
    20,
    3,
    .8,
    20
);

createWall(
    5,
    13,
    25,
    .8
);


/* SALAS */

createWall(
    -20,
    7,
    18,
    .8
);

createWall(
    -25,
    15,
    .8,
    18
);

createWall(
    -15,
    20,
    20,
    .8
);

createWall(
    10,
    22,
    18,
    .8
);


/* =========================================================
   MÓVEIS
========================================================= */

function createBox(
    x,
    y,
    z,
    width,
    height,
    depth,
    color=0x4a3b32
){

    const geometry =
        new THREE.BoxGeometry(

            width,
            height,
            depth
        );

    const material =
        new THREE.MeshStandardMaterial({

            color:color,

            roughness:.75
        });

    const mesh =
        new THREE.Mesh(

            geometry,

            material
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow=true;

    mesh.receiveShadow=true;

    scene.add(mesh);

    colliders.push({

        x:x,

        z:z,

        width:width,

        depth:depth
    });

    return mesh;
}


/* MESAS */

createBox(
    -20,
    1.1,
    -18,
    8,
    2.2,
    2,
    0x543d2c
);

createBox(
    12,
    1.1,
    -20,
    6,
    2.2,
    2,
    0x4c392b
);

createBox(
    25,
    1.1,
    8,
    5,
    2.2,
    2,
    0x4a382c
);


/* ARMÁRIOS */

createBox(
    -27,
    2,
    -4,
    2,
    4,
    1.2,
    0x3b4145
);

createBox(
    26,
    2,
    -5,
    2,
    4,
    1.2,
    0x353b3e
);

createBox(
    -18,
    2,
    16,
    2,
    4,
    1.2,
    0x383d40
);


/* CAIXAS */

createBox(
    12,
    1,
    16,
    2,
    2,
    2,
    0x604832
);

createBox(
    15,
    .7,
    18,
    1.5,
    1.4,
    1.5,
    0x513b2a
);


/* =========================================================
   PERSONAGEM 3D
========================================================= */

const player =
    new THREE.Group();

scene.add(player);


/* CORPO */

const body =
    new THREE.Mesh(

        new THREE.CapsuleGeometry(
            .7,
            1.3,
            5,
            10
        ),

        new THREE.MeshStandardMaterial({

            color:0xa92e2e,

            roughness:.65
        })
    );

body.position.y=1.8;

body.castShadow=true;

player.add(body);


/* CABEÇA */

const head =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .72,
            20,
            20
        ),

        new THREE.MeshStandardMaterial({

            color:0xe2aa86,

            roughness:.8
        })
    );

head.position.y=3.45;

head.castShadow=true;

player.add(head);


/* CABELO */

const hair =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .76,
            20,
            20,
            0,
            Math.PI*2,
            0,
            Math.PI*.45
        ),

        new THREE.MeshStandardMaterial({

            color:0x351b13,

            roughness:.9
        })
    );

hair.position.y=3.72;

player.add(hair);


/* MACACÃO */

const overalls =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.35,
            .8,
            .75
        ),

        new THREE.MeshStandardMaterial({

            color:0x263f83,

            roughness:.7
        })
    );

overalls.position.y=1.45;

player.add(overalls);


/* BRAÇOS */

function createArm(){

    const arm =
        new THREE.Mesh(

            new THREE.CapsuleGeometry(
                .24,
                .8,
                4,
                8
            ),

            new THREE.MeshStandardMaterial({

                color:0xa92e2e
            })
        );

    arm.castShadow=true;

    return arm;
}

const leftArm=createArm();

leftArm.position.set(
    -.9,
    2,
    0
);

player.add(leftArm);

const rightArm=createArm();

rightArm.position.set(
    .9,
    2,
    0
);

player.add(rightArm);


/* PERNAS */

function createLeg(){

    const leg =
        new THREE.Mesh(

            new THREE.CapsuleGeometry(
                .28,
                .9,
                4,
                8
            ),

            new THREE.MeshStandardMaterial({

                color:0x263f83
            })
        );

    leg.castShadow=true;

    return leg;
}

const leftLeg=createLeg();

leftLeg.position.set(
    -.38,
    .45,
    0
);

player.add(leftLeg);

const rightLeg=createLeg();

rightLeg.position.set(
    .38,
    .45,
    0
);

player.add(rightLeg);


/* LANTERNA 3D */

const flashlight =
    new THREE.Group();

const flashlightBody =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .13,
            .17,
            .8,
            12
        ),

        new THREE.MeshStandardMaterial({

            color:0x202225,

            metalness:.5,

            roughness:.4
        })
    );

flashlightBody.rotation.z=
    Math.PI/2;

flashlight.add(
    flashlightBody
);

const flashlightLens =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .19,
            .19,
            .08,
            12
        ),

        new THREE.MeshStandardMaterial({

            color:0xffffdd,

            emissive:0xffff99,

            emissiveIntensity:2
        })
    );

flashlightLens.rotation.z=
    Math.PI/2;

flashlightLens.position.x=.42;

flashlight.add(
    flashlightLens
);

flashlight.position.set(

    1.05,

    1.9,

    .3
);

player.add(
    flashlight
);


/* POSIÇÃO */

player.position.set(
    -27,
    0,
    -20
);


/* =========================================================
   LANTERNA REAL
========================================================= */

const flashlightLight =
    new THREE.SpotLight(

        0xfff1c4,

        8,

        32,

        Math.PI/5,

        .45,

        1.4
    );

flashlightLight.castShadow=true;

flashlightLight.shadow.mapSize.set(
    1024,
    1024
);

scene.add(
    flashlightLight

const JOY_RADIUS=40;


function resetJoystick(){

    pointerId=null;

    input.x=0;

    input.y=0;

    joystick.style.transform=
        "translate(0,0)";
}


function moveJoystick(
    clientX,
    clientY
){

    const rect=
        joystickArea.getBoundingClientRect();

    let x=
        clientX-
        rect.left-
        75;

    let y=
        clientY-
        rect.top-
        75;

    const distance=
        Math.hypot(x,y);

    if(distance>JOY_RADIUS){

        x=
            x/distance*
            JOY_RADIUS;

        y=
            y/distance*
            JOY_RADIUS;
    }

    input.x=
        x/JOY_RADIUS;

    input.y=
        y/JOY_RADIUS;

    joystick.style.transform=
        `translate(${x}px,${y}px)`;
}


joystickArea.addEventListener(
    "pointerdown",
    event=>{

        pointerId=event.pointerId;

        joystickArea.setPointerCapture(
            pointerId
        );

        moveJoystick(
            event.clientX,
            event.clientY
        );
    }
);


joystickArea.addEventListener(
    "pointermove",
    event=>{

        if(
            event.pointerId!==pointerId
        ) return;

        moveJoystick(
            event.clientX,

    }
);

/* =========================================================
   COLISÃO
========================================================= */

function hasCollision(
    x,
    z
){

    const radius=.65;

    /*
    LIMITES DO MAPA
    */

    if(
        x<-32+radius||
        x>32-radius||
        z<-24+radius||
        z>24-radius
    ){

        return true;
    }

    /*
    COLISÃO COM OBJETOS
    */

    for(
        const collider
        of colliders
    ){

        const minX=
            collider.x-
            collider.width/2-
            radius;

        const maxX=
            collider.x+
            collider.width/2+
            radius;

        const minZ=
            collider.z-
            collider.depth/2-
            radius;

        const maxZ=
            collider.z+
            collider.depth/2+
            radius;

        if(

            x>minX&&
            x<maxX&&
            z>minZ&&
            z<maxZ

        ){

            return true;
        }
    }

    return false;
}


/* =========================================================
   MOVIMENTO
========================================================= */

const velocity =
    new THREE.Vector3();


function updatePlayer(delta){

    const move =
        new THREE.Vector3(

            input.x,

            0,

            input.y
        );

    if(
        move.length()>1
    ){

        move.normalize();
    }

    const moving=
        move.length()>.05;

    const running=

        input.running&&

        stamina>0&&

        moving;


    let speed=

        running

        ?7.2

        :4.2;


    /*
    ACELERAÇÃO MAIS NATURAL
    */

    const targetVelocity =
        move.clone()
        .multiplyScalar(speed);


    velocity.x +=
        (
            targetVelocity.x-
            velocity.x
        )*
        Math.min(
            delta*10,
            1
        );


    velocity.z +=
        (
            targetVelocity.z-
            velocity.z
        )*
        Math.min(
            delta*10,
            1
        );


    /*
    MOVIMENTO X
    */

    const nextX=

        player.position.x+

        velocity.x*

        delta;


    if(
        !hasCollision(
            nextX,
            player.position.z
        )
    ){

        player.position.x=
            nextX;

    }else{

        velocity.x=0;
    }


    /*
    MOVIMENTO Z
    */

    const nextZ=

        player.position.z+

        velocity.z*

        delta;


    if(
        !hasCollision(
            player.position.x,
            nextZ
        )
    ){

        player.position.z=
            nextZ;

    }else{

        velocity.z=0;
    }


    /*
    ROTAÇÃO
    */

    if(moving){

        const targetRotation=

            Math.atan2(
                move.x,
                move.z
            );


        let rotationDifference=

            targetRotation-
            player.rotation.y;


        rotationDifference=

            Math.atan2(

                Math.sin(
                    rotationDifference
                ),

                Math.cos(
                    rotationDifference
                )
            );


        player.rotation.y+=

            rotationDifference*

            Math.min(
                delta*10,
                1
            );


        /*
        ANIMAÇÃO
        */

        walkTime+=

            delta*

            (
                running
                ?13
                :8
            );


        const swing=
            Math.sin(walkTime)*.55;


        leftLeg.rotation.x=
            swing;

        rightLeg.rotation.x=
            -swing;

        leftArm.rotation.x=
            -swing*.7;

        rightArm.rotation.x=
            swing*.7;


        /*
        PEQUENO BALANÇO
        DO CORPO
        */

        player.position.y=

            Math.abs(
                Math.sin(walkTime)
            )*.06;

    }else{

        velocity.x*=.78;

        velocity.z*=.78;

        leftLeg.rotation.x*=.8;

        rightLeg.rotation.x*=.8;

        leftArm.rotation.x*=.8;

        rightArm.rotation.x*=.8;

        player.position.y*=.8;
    }


    /*
    STAMINA
    */

    if(running){

        stamina-=

            24*

            delta;

    }else{

        stamina+=

            18*

            delta;
    }


    stamina=
        THREE.MathUtils.clamp(
            stamina,
            0,
            100
        );
}


/* =========================================================
   ATUALIZAR LANTERNA
========================================================= */

const direction =
    new THREE.Vector3();


function updateFlashlight(
    delta
){

    /*
    BATERIA
    */

    if(flashlightOn){

        battery-=

            .38*

            delta;

    }


    battery=
        THREE.MathUtils.clamp(

            battery,

            0,

            100
        );


    if(battery<=0){

        flashlightOn=false;
    }


    /*
    DIREÇÃO DO PERSONAGEM
    */

    direction.set(
        0,
        0,
        1
    );


    direction.applyQuaternion(
        player.quaternion
    );


    /*
    POSIÇÃO DA LUZ
    */

    const lightPosition =
        new THREE.Vector3(

            player.position.x,

            2.4,

            player.position.z

        );


    lightPosition.add(

        direction.clone()
        .multiplyScalar(.6)
    );


    flashlightLight.position.copy(
        lightPosition
    );


    playerGlow.position.copy(
        player.position
    );


    playerGlow.position.y=2;


    /*
    ALVO
    */

    const targetPosition=

        player.position.clone()

        .add(

            direction.clone()

            .multiplyScalar(
                14
            )
        );


    targetPosition.y=0;


    flashlightTarget.position.copy(
        targetPosition
    );


    /*
    BALANÇO DA LANTERNA
    */

    const moving=
        Math.hypot(
            velocity.x,
            velocity.z
        )>.3;


    if(moving){

        flashlight.rotation.z=

            Math.sin(
                walkTime
            )*.08;

        flashlight.rotation.y=

            Math.cos(
                walkTime*.5
            )*.05;

    }else{

        flashlight.rotation.z*=.9;

        flashlight.rotation.y*=.9;
    }


    /*
    FLICKER QUANDO
    A BATERIA ESTÁ BAIXA
    */

    let intensity=8;


    if(battery<30){

        intensity=

            6+

            Math.sin(
                performance.now()/
                70
            )*
            1.5;
    }


    if(battery<10){

        intensity=

            Math.random()>.08

            ?4

            :0;
    }


    flashlightLight.intensity=

        flashlightOn

        ?intensity

        :0;


    playerGlow.intensity=

        flashlightOn

        ?1.8

        :.55;


    flashlightLens.material.emissiveIntensity=

        flashlightOn

        ?2

        :0;
}

function updateKeys(time){

    for(
        const key
        of keys
    ){

        if(
            key.collected

        key.mesh.rotation.y+=
            .02;


        key.mesh.position.y=

            1.1+

            Math.sin(

                time*2+

                key.index

            )*.15;


        const distance=

            player.position.distanceTo(

            keysCollected++;

function activateMonster(){

    if(monsterActive) return;

    monsterActive=true;

    monster.visible=true;

    showMessage(
        "ALGO ESTÁ SE MOVENDO..."
    );
}


function updateMonster(
    delta,
    time
){

    if(!monsterActive){

        monsterSpawnTime-=delta;

        if(monsterSpawnTime<=0){

            activateMonster();
        }

        return;
    }


    /*
    OLHAR PARA O JOGADOR
    */

    monster.lookAt(

        player.position.x,

        0,

        player.position.z
    );


    const distance=

        monster.position.distanceTo(

            player.position
        );


    /*
    PERSEGUIÇÃO
    */

    let monsterSpeed=

        distance<18

        ?5.8

        :2.2;


    if(
        input.running&&
        distance<25
    ){

        monsterSpeed=4.5;
    }


    if(distance<28){

        const direction=

            player.position.clone()

            .sub(
                monster.position
            )

            .normalize();


        monster.position.add(

            direction.multiplyScalar(

                monsterSpeed*
                delta
            )
        );
    }


    /*
    ANIMAÇÃO
    */

    monster.position.y=

        Math.sin(
            time*5
        )*.08;


    /*
    ATAQUE
    */

    if(distance<1.7){

        damagePlayer(
            12
        );
    }
}

        );

}

        updateHUD();
    }


    renderer.render(

        scene,

        camera
    );
}


camera.position.set(
    -27,
    22,
    -6
);


camera.lookAt(
    player.position
);


animate();

</script>
