function makeGrainTexture(){const cv=document.createElement('canvas');cv.width=cv.height=256;const c=cv.getContext('2d');c.fillStyle='#20252b';c.fillRect(0,0,256,256);for(let i=0;i<2600;i++){const v=25+Math.random()*35;c.fillStyle=`rgba(${v},${v+4},${v+8},${Math.random()*.22})`;c.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*2,1)}return new THREE.CanvasTexture(cv)}

// controle de olhar próprio para mobile
let yaw=0,pitch=0,drag=false,lx=0,ly=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')e.preventDefault();drag=true;lx=e.clientX;ly=e.clientY;renderer.domElement.setPointerCapture?.(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lx,dy=e.clientY-ly; yaw+=dx*.0038; pitch-=dy*.0032; pitch=Math.max(-.55,Math.min(.42,pitch)); lx=e.clientX;ly=e.clientY});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointercancel',()=>drag=false);
const sim={state:'READY',t:0,count:5,alt:0,v:0,mass:500000,fuel:360000,thrust:0,progress:0,landingAlt:160,shake:0};
const phases=['CONTAGEM','IGNIÇÃO','DECOLAGEM','SUBIDA','MÁXIMA PRESSÃO','ALTA ATMOSFERA','ESPAÇO','CRUZEIRO','APROXIMAÇÃO','ENTRADA','POUSO'];
function phaseName(){const map={READY:'SISTEMAS PRONTOS • TERRA',COUNT:'CONTAGEM REGRESSIVA',IGNITION:'IGNIÇÃO DOS MOTORES',ASCENT:'SUBIDA PELA ATMOSFERA',SPACE:'SAÍDA DA ATMOSFERA',CRUISE:'CRUZEIRO INTERPLANETÁRIO',APPROACH:'APROXIMAÇÃO DO PLANETA',ENTRY:'ENTRADA E DESCIDA',LANDING:'POUSO CONTROLADO',LANDED:'MISSÃO CONCLUÍDA ❤️'};return map[sim.state]||'EM VOO'}
function updateScreens(){
 const s=sim, elapsed=Math.max(0,clock.getElapsedTime());
 const fmt=n=>Math.round(Math.max(0,n)).toLocaleString('pt-BR');
 const mach=s.v/340, accel=s.mass>0?Math.max(0,(s.thrust-s.mass*9.81)/s.mass):0;
 function bg(sc,title,accent){const c=sc.ctx,w=sc.cv.width,h=sc.cv.height;c.clearRect(0,0,w,h);c.fillStyle='#04080d';c.fillRect(0,0,w,h);c.fillStyle='#0b1219';c.fillRect(20,20,w-40,h-40);c.strokeStyle=accent;c.globalAlpha=.32;c.lineWidth=2;c.strokeRect(20,20,w-40,h-40);c.globalAlpha=.13;for(let x=40;x<w-40;x+=56){c.beginPath();c.moveTo(x,40);c.lineTo(x,h-40);c.stroke()}for(let y=40;y<h-40;y+=56){c.beginPath();c.moveTo(40,y);c.lineTo(w-40,y);c.stroke()}c.globalAlpha=1;c.fillStyle=accent;c.font='bold 34px Arial';c.fillText(title,52,76);c.fillStyle='#778692';c.font='18px Arial';c.fillText('TELEMETRIA • ATUALIZAÇÃO EM TEMPO REAL',52,106);c.strokeStyle='rgba(255,255,255,.10)';c.beginPath();c.moveTo(52,125);c.lineTo(w-52,125);c.stroke();return c}
 let c=bg(scr1,'PROPULSÃO','#ff9a6b');
 const power=Math.min(100,s.thrust/82000),fuel=Math.max(0,100*s.fuel/360000), thrustKN=s.thrust/1000;
 c.fillStyle='#b9c4cc';c.font='20px Arial';c.fillText('EMPuxO ATUAL',55,172);c.fillStyle='#ffb092';c.font='bold 48px Arial';c.fillText(fmt(thrustKN)+' kN',55,218);c.fillStyle='#17232b';c.fillRect(55,244,620,34);c.fillStyle='#ef7049';c.fillRect(55,244,620*power/100,34);c.fillStyle='#d8e0e6';c.font='20px Arial';c.fillText('POTÊNCIA '+power.toFixed(1)+'%',55,316);
 c.fillStyle='#17232b';c.fillRect(55,348,620,30);c.fillStyle=fuel>20?'#4dcc8d':'#ef9a4a';c.fillRect(55,348,620*fuel/100,30);c.fillStyle='#d8e0e6';c.font='20px Arial';c.fillText('COMBUSTÍVEL '+fuel.toFixed(1)+'% • '+fmt(s.fuel)+' kg',55,416);c.fillStyle='#91a1ad';c.font='18px Arial';c.fillText('MASSA '+fmt(s.mass)+' kg',55,465);c.fillText('ACELERAÇÃO '+accel.toFixed(2)+' m/s²',55,500);c.fillText('VIBRAÇÃO '+(s.shake*1000).toFixed(1)+'%',55,535);c.fillStyle=s.thrust>0?'#6ee7a2':'#6f8492';c.font='bold 18px Arial';c.fillText(s.thrust>0?'● MOTORES E SISTEMAS ATIVOS':'● MOTORES EM ESPERA',55,582);
 c=bg(scr2,'DADOS DE VOO','#70d4ff');
 c.fillStyle='#eaf7ff';c.font='bold 60px Arial';c.fillText((s.alt/1000).toFixed(s.alt<10000?1:0)+' km',54,206);c.fillStyle='#778692';c.font='20px Arial';c.fillText('ALTITUDE',58,238);c.fillStyle='#ffffff';c.font='bold 42px Arial';c.fillText(fmt(s.v*3.6)+' km/h',54,326);c.fillStyle='#778692';c.font='20px Arial';c.fillText('VELOCIDADE • MACH '+mach.toFixed(1),58,356);
 c.save();c.translate(765,265);c.strokeStyle='#66cdf5';c.lineWidth=4;c.beginPath();c.arc(0,0,145,0,Math.PI*2);c.stroke();c.save();c.rotate(Math.max(-.55,Math.min(.55,pitch)));c.fillStyle='#4e9ac7';c.fillRect(-135,-75,270,75);c.fillStyle='#8f513f';c.fillRect(-135,0,270,75);c.restore();c.strokeStyle='#f2f7fb';c.lineWidth=3;c.beginPath();c.moveTo(-110,0);c.lineTo(110,0);c.moveTo(0,-26);c.lineTo(0,26);c.stroke();c.restore();
 c.fillStyle='#91a5b1';c.font='18px Arial';c.fillText('ACELERAÇÃO '+accel.toFixed(2)+' m/s²',55,430);c.fillText('GRAVIDADE LOCAL '+(9.81*Math.max(.22,1-s.alt/650000)).toFixed(2)+' m/s²',55,465);c.fillStyle='#a9e7ff';c.font='bold 18px Arial';c.fillText(phaseName(),55,540);c.fillStyle='#72828e';c.font='17px Arial';c.fillText('TEMPO DE MISSÃO '+Math.floor(elapsed/60).toString().padStart(2,'0')+':'+Math.floor(elapsed%60).toString().padStart(2,'0'),55,585);
 c=bg(scr3,'MISSÃO','#73dfa5');
 const idx={READY:0,COUNT:0,IGNITION:1,ASCENT:3,SPACE:6,CRUISE:7,APPROACH:8,ENTRY:9,LANDING:10,LANDED:10}[s.state]??0;
 const left=62,top=154;phases.forEach((p,i)=>{const y=top+i*39;c.fillStyle=i<idx?'#2f8b64':i===idx?'#7cebb3':'#2c3941';c.beginPath();c.arc(left,y,11,0,Math.PI*2);c.fill();if(i<phases.length-1){c.strokeStyle=i<idx?'#4fc98d':'#26343b';c.lineWidth=4;c.beginPath();c.moveTo(left,y+11);c.lineTo(left,y+28);c.stroke()}c.fillStyle=i===idx?'#effff6':i<idx?'#b6f2d1':'#80909a';c.font=i===idx?'bold 21px Arial':'20px Arial';c.fillText(p,left+32,y+7)});
 const ratio=idx/(phases.length-1);c.fillStyle='#15232a';c.fillRect(500,485,450,32);c.fillStyle='#6fe0a0';c.fillRect(500,485,450*ratio,32);c.strokeStyle='rgba(255,255,255,.15)';c.strokeRect(500,485,450,32);c.fillStyle='#dff8ea';c.font='18px Arial';c.fillText('PROGRESSO '+(ratio*100).toFixed(0)+'%',500,465);c.fillStyle='#81929d';c.font='17px Arial';c.fillText('DESTINO: PLANETA DA NOSSA VIAGEM',500,555);c.fillText('SISTEMA: '+phaseName(),500,590);
 for(const sc of[scr1,scr2,scr3])sc.tx.needsUpdate=true;
}
function physics(dt){const s=sim;s.t+=dt;if(s.state==='COUNT'){s.count=Math.max(0,Math.ceil(5-s.t));btn.textContent=s.count>0?'T− '+s.count:'IGNIÇÃO';if(s.t>=4){s.state='IGNITION';s.t=0;btn.disabled=true;hint.textContent='Motores acesos. Segurem-se.'}}
else if(s.state==='IGNITION'){s.thrust=Math.min(8.2e6,s.thrust+dt*2.8e6);s.shake=.05;if(s.t>2.2){s.state='ASCENT';s.t=0;}}
else if(s.state==='ASCENT'||s.state==='SPACE'){const rho=Math.max(0,1-s.alt/90000),g=9.81*Math.max(.22,1-s.alt/650000);s.thrust=s.state==='ASCENT'?8.2e6:1.5e6;const drag=.00042*rho*s.v*Math.abs(s.v);s.mass=140000+s.fuel;s.fuel=Math.max(0,s.fuel-dt*(s.state==='ASCENT'?1700:350));s.v+=((s.thrust-drag-s.mass*g)/Math.max(s.mass,1))*dt;s.v=Math.max(0,s.v);s.alt+=s.v*dt;s.shake=.06*Math.max(0,1-s.alt/70000);if(s.alt>25000&&s.alt<42000)hint.textContent='Máxima pressão atmosférica — vibração diminuindo.';if(s.alt>70000)s.state='SPACE';if(s.alt>115000){s.state='CRUISE';s.t=0;s.v=27000;hint.textContent='Motores principais estabilizados. Estamos no espaço.'}}
else if(s.state==='CRUISE'){s.progress=Math.min(1,s.progress+dt*.065);s.v=27000;if(s.progress>.72){s.state='APPROACH';s.t=0;mars.visible=true;hint.textContent='Planeta de destino detectado à frente.'}}
else if(s.state==='APPROACH'){s.progress=Math.min(1,s.progress+dt*.04);if(s.t>7){s.state='ENTRY';s.t=0;s.landingAlt=140;land.visible=true;earth.visible=false;earthCloud.visible=false;hint.textContent='Iniciando entrada na atmosfera do planeta.'}}
else if(s.state==='ENTRY'){s.landingAlt=Math.max(20,s.landingAlt-dt*11);s.v=Math.max(600,s.v-dt*1200);if(s.t>7){s.state='LANDING';s.t=0;}}
else if(s.state==='LANDING'){s.landingAlt=Math.max(0,s.landingAlt-dt*9);s.v=Math.max(0,s.v-dt*180);if(s.landingAlt<=.5){s.state='LANDED';btn.disabled=false;btn.textContent='POUSO CONCLUÍDO ❤️';hint.textContent='Vocês chegaram ao destino.'}}
}
btn.addEventListener('click',()=>{if(sim.state==='READY'){sim.state='COUNT';sim.t=0;btn.disabled=true;hint.textContent='Contagem iniciada. Arraste para olhar naturalmente pela cabine.'}});
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);physics(dt);const s=sim;
// transição visual contínua Terra -> espaço
const spaceMix=Math.max(0,Math.min(1,(s.alt-18000)/110000));scene.background.setRGB(.47*(1-spaceMix)+.008*spaceMix,.73*(1-spaceMix)+.014*spaceMix,.92*(1-spaceMix)+.035*spaceMix);scene.fog.color.copy(scene.background);scene.fog.density=.0018*(1-spaceMix)+.000015*spaceMix;starMat.opacity=Math.pow(spaceMix,1.8)*.95;earth.visible=s.alt>55000&&s.state!=='ENTRY'&&s.state!=='LANDING'&&s.state!=='LANDED';earthCloud.visible=earth.visible;if(earth.visible){earth.position.y=-430-Math.min(1100,(s.alt-55000)/160);earthCloud.position.copy(earth.position);earth.rotation.y+=dt*.025}
clouds.visible=s.alt<75000;if(clouds.visible)clouds.position.y=-Math.min(350,s.alt*.012);
if(mars.visible){mars.position.z=-2600+s.progress*2050;mars.position.y=85-(s.progress*.55)*80;mars.scale.setScalar(.7+s.progress*1.1);}
engineLight.intensity=(s.state==='IGNITION'||s.state==='ASCENT')?2.2*Math.min(1,s.thrust/8200000):.15;
const sh=s.shake;cockpit.position.x=(Math.random()-.5)*sh;cockpit.position.y=(Math.random()-.5)*sh*.65;cockpit.rotation.z=(Math.random()-.5)*sh*.04;camera.rotation.set(pitch,yaw,0,'YXZ');phaseEl.textContent=phaseName();updateScreens();drawDashboard();renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,2))});
