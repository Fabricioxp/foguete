<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Espacial - Cabine Interativa</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at 50% 35%, #172033 0%, #03050a 58%, #000 100%);
            font-family: Georgia, 'Segoe UI', sans-serif;
            user-select: none;
        }

        #canvas-container { width:100vw; height:100vh; height:100dvh; touch-action:none; }
        canvas { display:block; touch-action:none; }
        @media (max-width: 700px) {
            #hud { top: max(10px, env(safe-area-inset-top)); left:10px; right:10px; padding:10px 12px; border-radius:12px; }
            #hud h1 { font-size:.82rem; letter-spacing:1px; margin-bottom:5px; }
            #hud p { font-size:.72rem; margin:2px 0; }
            #controls-hint { display:none; }
            #launch-btn { bottom:max(18px, env(safe-area-inset-bottom)); width:calc(100% - 40px); max-width:420px; padding:15px 12px; font-size:.92rem; letter-spacing:1px; }
        }

        /* HUD Superior */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00f3ff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.7);
            font-family: monospace;
            pointer-events: none;
            z-index: 10;
            background: rgba(15, 18, 24, 0.82);
            padding: 15px;
            border: 1px solid rgba(255, 210, 140, 0.28);
            border-left: 4px solid #d19a55;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }

        #hud h1 {
            margin: 0 0 8px 0;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        #hud p {
            margin: 4px 0;
            font-size: 0.85rem;
        }

        /* Instrução de Controle da Câmera */
        #controls-hint {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            pointer-events: none;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Botão de Controle Principal */
        #launch-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 45px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(180deg, #b84b39, #70231c);
            border: 2px solid #e2b46f;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 7px 0 #3d1511, 0 12px 30px rgba(0,0,0,.55);
            transition: all 0.3s ease;
            z-index: 10;
            letter-spacing: 2px;
        }

        #launch-btn:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.8);
        }

        #launch-btn:disabled {
            background: #222;
            color: #666;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="hud">
        <h1 id="status-title">STATUS: PRONTO NA RAMPA</h1>
        <p>ALTITUDE: <span id="tele-alt">0</span> km</p>
        <p>VELOCIDADE: <span id="tele-speed">0</span> km/h</p>
        <p>FASE DA MISSÃO: <span id="tele-phase">Aguardando Lançamento</span></p>
        <p style="color:#e9b4b4;font-size:.72rem;margin-top:8px">MISSÃO ESPECIAL: UMA VIAGEM PARA NÓS DOIS ♥</p>
    </div>

    <div id="controls-hint">Arraste para olhar ao redor</div>
    <button id="launch-btn">INICIAR DECOLAGEM</button>
    <div id="canvas-container"></div>

    <script>
        // --- CENAS E MUNDOS ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.00002);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, window.innerWidth < 700 ? 1.35 : 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // Controles de Câmera 360° (OrbitControls para olhar dentro da cabine)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableZoom = false; // Mantém a câmera fixa dentro do cockpit
        controls.enablePan = false;
        controls.rotateSpeed = -0.35;
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minPolarAngle = 0.75;
        controls.maxPolarAngle = 2.25;
        controls.minAzimuthAngle = -0.95;
        controls.maxAzimuthAngle = 0.95;
        renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

        const textureLoader = new THREE.TextureLoader();

        // --- ILUMINAÇÃO ---
        const ambientLight = new THREE.AmbientLight(0x223344, 1.2);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
        sunLight.position.set(20000, 10000, 10000);
        scene.add(sunLight);

        // --- PLANETAS E ESPAÇO ---
        // Campo de Estrelas
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 12000;
        const starPositions = new Float32Array(starsCount * 3);
        for(let i = 0; i < starsCount * 3; i++) {
            starPositions[i] = (Math.random() - 0.5) * 80000;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.2 });
        scene.add(new THREE.Points(starsGeo, starsMat));

        // Terra
        const earthRadius = 2000;
        const earthGeo = new THREE.SphereGeometry(earthRadius, 64, 64);
        const earthMat = new THREE.MeshPhongMaterial({
            map: textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg'),
            specularMap: textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_specular_2048.jpg'),
            shininess: 10
        });
        const earth = new THREE.Mesh(earthGeo, earthMat);
        earth.position.set(0, -earthRadius, 0);
        scene.add(earth);

        // Marte
        const marsRadius = 1200;
        const marsGeo = new THREE.SphereGeometry(marsRadius, 64, 64);
        const marsMat = new THREE.MeshStandardMaterial({
            map: textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/mars_1k.jpg'),
            roughness: 0.8
        });
        const mars = new THREE.Mesh(marsGeo, marsMat);
        mars.position.set(0, 45000, -60000); // Distância longa para viagem prolongada
        scene.add(mars);

        // --- CONSTRUÇÃO DETALHADA DA CABINE DO FOGUETE ---
        const cockpit = new THREE.Group();
        scene.add(cockpit);

        // Paredes Internas
        const interiorGeo = new THREE.CylinderGeometry(2.8, 2.5, 4, 16, 1, true);
        const interiorMat = new THREE.MeshStandardMaterial({
            color: 0x1a1d24,
            metalness: 0.6,
            roughness: 0.4,
            side: THREE.BackSide
        });
        const interior = new THREE.Mesh(interiorGeo, interiorMat);
        cockpit.add(interior);

        // Moldura do Vidro/Janela Principal
        const windowFrameGeo = new THREE.TorusGeometry(1.8, 0.1, 16, 32);
        const frameMat = new THREE.MeshStandardMaterial({ color: 0x0d0f12, metalness: 0.9, roughness: 0.1 });
        const windowFrame = new THREE.Mesh(windowFrameGeo, frameMat);
        windowFrame.position.set(0, 0.2, -2.2);
        cockpit.add(windowFrame);

        // Painel de Controle Principal
        const consoleGeo = new THREE.BoxGeometry(3, 0.6, 1.2);
        const consoleMat = new THREE.MeshStandardMaterial({ color: 0x11141a, metalness: 0.8, roughness: 0.2 });
        const mainConsole = new THREE.Mesh(consoleGeo, consoleMat);
        mainConsole.position.set(0, -0.9, -1.6);
        mainConsole.rotation.x = 0.3;
        cockpit.add(mainConsole);

        // MONITOR MINI (Navegação/Rota)
        const canvasMap = document.createElement('canvas');
        canvasMap.width = 256;
        canvasMap.height = 256;
        const ctxMap = canvasMap.getContext('2d');
        const mapTexture = new THREE.CanvasTexture(canvasMap);

        const screenGeo = new THREE.PlaneGeometry(0.8, 0.6);
        const screenMat = new THREE.MeshBasicMaterial({ map: mapTexture });
        const miniScreen = new THREE.Mesh(screenGeo, screenMat);
        miniScreen.position.set(0, -0.65, -1.25);
        miniScreen.rotation.x = -0.2;
        cockpit.add(miniScreen);

        // Moldura do Monitor Mini
        const screenBorder = new THREE.Mesh(
            new THREE.BoxGeometry(0.86, 0.66, 0.02),
            new THREE.MeshStandardMaterial({ color: 0x00f3ff, metalness: 0.5 })
        );
        screenBorder.position.copy(miniScreen.position);
        screenBorder.position.z -= 0.02;
        screenBorder.rotation.copy(miniScreen.rotation);
        cockpit.add(screenBorder);

        // Luz Ambient Interna da Cabine
        const cabinLight = new THREE.PointLight(0x00f3ff, 1.2, 4);
        cabinLight.position.set(0, 1, -0.5);
        cockpit.add(cabinLight);

        // --- DETALHES FÍSICOS DA CABINE ---
        const seat = new THREE.Group();
        const seatMat = new THREE.MeshStandardMaterial({color:0x4b2725, roughness:0.75, metalness:0.25});
        const seatBack = new THREE.Mesh(new THREE.BoxGeometry(1.45, 1.9, 0.35), seatMat);
        seatBack.position.set(0,-0.1,1.25); seat.add(seatBack);
        const seatBase = new THREE.Mesh(new THREE.BoxGeometry(1.55,0.32,1.2), seatMat);
        seatBase.position.set(0,-1.05,0.65); seat.add(seatBase); cockpit.add(seat);

        // Molduras da janela e rebites para a cabine parecer um foguete de verdade
        for(let i=-3;i<=3;i++){
            const bolt = new THREE.Mesh(new THREE.SphereGeometry(.055,8,8), new THREE.MeshStandardMaterial({color:0x77736c,metalness:.9,roughness:.25}));
            bolt.position.set(i*.42, .92, -2.02); cockpit.add(bolt);
        }
        const sideBeamMat=new THREE.MeshStandardMaterial({color:0x30343a,metalness:.75,roughness:.35});
        [-1,1].forEach(x=>{const b=new THREE.Mesh(new THREE.BoxGeometry(.16,3.1,.22),sideBeamMat);b.position.set(x*2.15,0,-.9);b.rotation.z=x*.08;cockpit.add(b);});

        // Manches de pilotagem visíveis em primeira pessoa
        const stickMat=new THREE.MeshStandardMaterial({color:0x24211e,metalness:.65,roughness:.32});
        [-.78,.78].forEach(x=>{
            const base=new THREE.Mesh(new THREE.CylinderGeometry(.16,.2,.12,12),stickMat); base.position.set(x,-.62,-1.18);cockpit.add(base);
            const stick=new THREE.Mesh(new THREE.CylinderGeometry(.055,.07,.72,10),stickMat); stick.position.set(x,-.35,-1.18);stick.rotation.z=x*.18;cockpit.add(stick);
            const grip=new THREE.Mesh(new THREE.SphereGeometry(.13,12,10),new THREE.MeshStandardMaterial({color:0x111111,roughness:.7}));grip.position.set(x*1.05,-.05,-1.18);cockpit.add(grip);
        });

        // Braços estilizados do piloto: a sensação é de estar sentado comandando a nave
        const suitMat=new THREE.MeshStandardMaterial({color:0xd9d5ca,roughness:.8});
        [-1,1].forEach(side=>{
            const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.72,4,10),suitMat);
            arm.position.set(side*.72,-1.05,-.15); arm.rotation.z=side*.58; arm.rotation.x=-.55; cockpit.add(arm);
            const hand=new THREE.Mesh(new THREE.SphereGeometry(.16,12,10),new THREE.MeshStandardMaterial({color:0xc99678,roughness:.85}));
            hand.position.set(side*.83,-.43,-.93);cockpit.add(hand);
        });

        // Indicadores luminosos e pequenos instrumentos analógicos
        for(let i=0;i<7;i++){
            const lamp=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),new THREE.MeshBasicMaterial({color:i===3?0xff5533:0xffc35a}));
            lamp.position.set(-1.15+i*.38,-.55,-1.02);cockpit.add(lamp);
        }

        // Fogo dos motores visto refletindo/iluminando a cabine durante a decolagem
        const engineGlow=new THREE.PointLight(0xff5b16,0,12); engineGlow.position.set(0,-2,1.5);cockpit.add(engineGlow);

        // Camada atmosférica da Terra
        const atmosphere=new THREE.Mesh(new THREE.SphereGeometry(earthRadius*1.018,64,64),new THREE.MeshBasicMaterial({color:0x3c9dff,transparent:true,opacity:.13,side:THREE.BackSide}));
        atmosphere.position.copy(earth.position);scene.add(atmosphere);

        // Anel de nuvens simples para reforçar que a decolagem começa na Terra
        const cloudMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.22,side:THREE.DoubleSide});
        const clouds=[];
        for(let i=0;i<34;i++){
            const c=new THREE.Mesh(new THREE.PlaneGeometry(260+Math.random()*360,90+Math.random()*160),cloudMat.clone());
            c.position.set((Math.random()-.5)*2400,60+Math.random()*1700,(Math.random()-.5)*2400);c.rotation.x=-Math.PI/2;scene.add(c);clouds.push(c);
        }

        // Destino mais bonito, com brilho próprio
        const marsGlow=new THREE.Mesh(new THREE.SphereGeometry(marsRadius*1.08,48,48),new THREE.MeshBasicMaterial({color:0xff6b3d,transparent:true,opacity:.08,side:THREE.BackSide}));
        marsGlow.position.copy(mars.position);scene.add(marsGlow);

        // Posição Inicial da Câmera na Cabine
        camera.position.set(0, 0, -0.1);
        controls.target.set(0, 0, -1);
        controls.update();

        // --- SISTEMA DE NAVEGAÇÃO DO MONITOR MINI ---
        function updateMiniMap(progressRatio) {
            ctxMap.fillStyle = '#050b14';
            ctxMap.fillRect(0, 0, 256, 256);

            // Linha de Rota
            ctxMap.strokeStyle = 'rgba(0, 243, 255, 0.4)';
            ctxMap.lineWidth = 2;
            ctxMap.beginPath();
            ctxMap.moveTo(40, 216);
            ctxMap.lineTo(216, 40);
            ctxMap.stroke();

            // Ponto Terra
            ctxMap.fillStyle = '#2288ff';
            ctxMap.beginPath();
            ctxMap.arc(40, 216, 12, 0, Math.PI * 2);
            ctxMap.fill();

            // Ponto Marte
            ctxMap.fillStyle = '#ff4422';
            ctxMap.beginPath();
            ctxMap.arc(216, 40, 10, 0, Math.PI * 2);
            ctxMap.fill();

            // Posicionamento Atual do Foguete na Rota
            const shipX = 40 + (216 - 40) * progressRatio;
            const shipY = 216 + (40 - 216) * progressRatio;

            ctxMap.fillStyle = '#00ffcc';
            ctxMap.beginPath();
            ctxMap.arc(shipX, shipY, 5, 0, Math.PI * 2);
            ctxMap.fill();

            mapTexture.needsUpdate = true;
        }

        // --- LOGICA DE FLUXO DA VIAGEM LONGA ---
        let state = 'IDLE'; 
        let speed = 0;
        let altitude = 0;
        let progress = 0;

        const launchBtn = document.getElementById('launch-btn');
        const statusTitle = document.getElementById('status-title');
        const teleAlt = document.getElementById('tele-alt');
        const teleSpeed = document.getElementById('tele-speed');
        const telePhase = document.getElementById('tele-phase');

        launchBtn.addEventListener('click', () => {
            if(state === 'IDLE') {
                state = 'LAUNCH';
                launchBtn.disabled = true;
                launchBtn.innerText = "EM CURSO...";
            }
        });

        const startPos = new THREE.Vector3(0, 2, 0);
        const targetPos = new THREE.Vector3(mars.position.x, mars.position.y + marsRadius + 10, mars.position.z);
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            earth.rotation.y += 0.0002;
            mars.rotation.y += 0.0004;

            // ESTADOS DA VIAGEM
            if (state === 'LAUNCH') {
                speed += delta * 350;
                altitude += speed * delta * 0.1;
                
                telePhase.innerText = "Saindo da Atmosfera Terrestre";
                statusTitle.innerText = "STATUS: MOTORES EM POTÊNCIA MÁXIMA";
                statusTitle.style.color = "#ff5500";

                // Efeito Tremor de Lançamento
                const shake = Math.min(speed / 15000, 0.05);
                cockpit.position.x = (Math.random() - 0.5) * shake;
                cockpit.position.y = (Math.random() - 0.5) * shake;
                cockpit.position.z = (Math.random() - 0.5) * shake;
                earth.position.y = -earthRadius - altitude * 0.45;
                atmosphere.position.copy(earth.position);
                clouds.forEach(c => c.position.y -= speed * delta * 0.18);
                engineGlow.intensity = 3 + Math.sin(time*35)*1.2;

                if (altitude > 3000) {
                    state = 'CRUISE';
                }
            } 
            else if (state === 'CRUISE') {
                // Viagem Longa de Cruzeiro Espacial
                progress += delta * 0.025; // Progressão cadenciada para dar a sensação de viagem longa
                speed = 58000 + Math.sin(time * 2) * 200;
                altitude = 3000 + progress * 55000;

                telePhase.innerText = "Cruzeiro Interplanetário";
                statusTitle.innerText = "STATUS: NAVEGAÇÃO ESTÁVEL";
                statusTitle.style.color = "#00f3ff";

                // Estabiliza a posição
                cockpit.position.x = 0;
                cockpit.position.z = 0;

                // Interpolação suave ao longo do espaço
                cockpit.position.set(0,0,0);
                earth.position.y = -earthRadius - 1800 - progress*9000;
                atmosphere.position.copy(earth.position);
                mars.position.lerp(new THREE.Vector3(0,6500,-18000), delta*0.18);
                marsGlow.position.copy(mars.position);
                engineGlow.intensity = 0.35;

                if (progress >= 0.88) {
                    state = 'APPROACH';
                }
            } 
            else if (state === 'APPROACH') {
                progress += delta * 0.015;
                speed *= 0.985; // Desacelerando
                altitude = Math.max(0, (1 - progress) * 20000);

                telePhase.innerText = "Aproximação e Pouso em Marte";
                statusTitle.innerText = "STATUS: RETROFOGUETES LIGADOS";
                statusTitle.style.color = "#ffcc00";

                cockpit.position.set(0,0,0);
                earth.position.y = -earthRadius - 1800 - progress*9000;
                atmosphere.position.copy(earth.position);
                mars.position.lerp(new THREE.Vector3(0,6500,-18000), delta*0.18);
                marsGlow.position.copy(mars.position);
                engineGlow.intensity = 0.35;

                // Tremor leve ao entrar na atmosfera de Marte
                const shake = 0.015;
                cockpit.position.x += (Math.random() - 0.5) * shake;

                if (progress >= 1.0) {
                    state = 'LANDED';
                    speed = 0;
                    altitude = 0;
                    telePhase.innerText = "Superfície de Marte";
                    statusTitle.innerText = "STATUS: POUSO CONCLUÍDO COM SUCESSO!";
                    statusTitle.style.color = "#00ff66";
                    launchBtn.innerText = "CHEGAMOS ♥";
                }
            }

            // Atualização do Monitor Mini e HUD
            updateMiniMap(Math.min(progress, 1));
            teleAlt.innerText = Math.floor(altitude).toLocaleString();
            teleSpeed.innerText = Math.floor(speed).toLocaleString();

            controls.update();
            renderer.render(scene, camera);
        }

        function resizeScene() {
            const w = window.innerWidth, h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h, false);
        }
        window.addEventListener('resize', resizeScene);
        window.addEventListener('orientationchange', () => setTimeout(resizeScene, 150));
        document.addEventListener('visibilitychange', () => { if (!document.hidden) clock.getDelta(); });

        animate();
    </script>
</body>
</html>
