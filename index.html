<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MISSÃO LUNAR</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

#startScreen{
    position:absolute;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 30%,#1c2534 0%,#05080d 45%,#000 100%);
    color:white;
    transition:opacity 1s;
}

#startScreen.hidden{
    opacity:0;
    pointer-events:none;
}

.startCard{
    width:min(86vw,400px);
    text-align:center;
}

.startCard h1{
    margin:0;
    font-size:clamp(32px,10vw,52px);
    letter-spacing:7px;
    font-weight:300;
}

.startCard p{
    color:#8d9aaa;
    line-height:1.5;
    margin:25px 0;
    font-size:14px;
}

.launchButton{
    position:relative;
    width:150px;
    height:150px;
    border-radius:50%;
    margin:35px auto 0;
    border:2px solid rgba(255,255,255,.2);
    background:
        radial-gradient(circle,#ee3f2f 0%,#941e17 55%,#260909 100%);
    color:white;
    font-weight:bold;
    letter-spacing:2px;
    box-shadow:
        0 0 0 12px rgba(255,255,255,.025),
        0 0 45px rgba(255,60,40,.25);
}

.launchButton:active{
    transform:scale(.94);
}

#orientation{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:#000;
    color:#fff;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
}

@media (orientation:portrait){
    #orientation{
        display:flex;
    }
}
</style>
</head>

<body>

<div id="game">
    <canvas id="scene"></canvas>

    <div id="startScreen">
        <div class="startCard">
            <h1>ODYSSEY</h1>

            <p>
                Uma viagem da Terra até a superfície lunar.<br>
                Entre na cabine e inicie a missão.
            </p>

            <button class="launchButton" id="startButton">
                INICIAR<br>MISSÃO
            </button>
        </div>
    </div>
</div>

<div id="orientation">
    <div>
        <h2>🚀 GIRE O CELULAR</h2>
        <p>Esta missão foi projetada para jogar na horizontal.</p>
    </div>
</div>

<script>
/* ============================================================
   ODYSSEY — SIMULADOR DE VIAGEM LUNAR
   Tudo em um único arquivo para GitHub Pages
============================================================ */

const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");

let W,H,DPR;

function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;
    H=window.innerHeight;

    canvas.width=W*DPR;
    canvas.height=H*DPR;

    ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize",resize);
resize();


/* ============================================================
   ESTADO DA MISSÃO
============================================================ */

const mission={

    running:false,

    phase:"platform",

    time:0,

    altitude:0,
    velocity:0,
    acceleration:0,

    fuel:100,

    throttle:0,

    distanceToMoon:384400,

    pitch:90,

    stars:[],

    shake:0,

    moonApproach:0,

    landingAltitude:0,

    message:"SISTEMAS ONLINE",

    launchStarted:false,

    enginePower:0,

    touchX:0,
    touchY:0,

    audioStarted:false
};


/* ============================================================
   ESTRELAS
============================================================ */

for(let i=0;i<500;i++){
    mission.stars.push({
        x:Math.random(),
        y:Math.random(),
        size:Math.random()*2+.2,
        brightness:Math.random()
    });
}


/* ============================================================
   ÁUDIO PROCEDURAL
============================================================ */

let audioCtx;
let engineGain;
let engineOsc;

function startAudio(){

    if(mission.audioStarted)return;

    mission.audioStarted=true;

    audioCtx=new (window.AudioContext||window.webkitAudioContext)();

    const master=audioCtx.createGain();
    master.gain.value=.3;
    master.connect(audioCtx.destination);

    engineOsc=audioCtx.createOscillator();
    engineOsc.type="sawtooth";
    engineOsc.frequency.value=35;

    engineGain=audioCtx.createGain();
    engineGain.gain.value=0;

    const filter=audioCtx.createBiquadFilter();
    filter.type="lowpass";
    filter.frequency.value=120;

    engineOsc.connect(filter);
    filter.connect(engineGain);
    engineGain.connect(master);

    engineOsc.start();
}

function updateAudio(){

    if(!audioCtx)return;

    const power=mission.enginePower;

    engineOsc.frequency.setTargetAtTime(
        30+power*80,
        audioCtx.currentTime,
        .05
    );

    engineGain.gain.setTargetAtTime(
        power*.5,
        audioCtx.currentTime,
        .05
    );
}


/* ============================================================
   DESENHO DO FUNDO
============================================================ */

function drawStars(alpha=1){

    ctx.save();

    ctx.globalAlpha=alpha;

    for(const star of mission.stars){

        const x=star.x*W;
        const y=star.y*H;

        const pulse=
            .65+
            Math.sin(
                mission.time*2+
                star.x*20
            )*.35;

        ctx.fillStyle="white";
        ctx.globalAlpha=
            alpha*
            star.brightness*
            pulse;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            star.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.restore();
}


/* ============================================================
   CÉU E ATMOSFERA
============================================================ */

function drawAtmosphere(){

    const alt=mission.altitude;

    const spaceAmount=Math.min(
        1,
        Math.max(
            0,
            (alt-10000)/90000
        )
    );

    const atmosphere=1-spaceAmount;

    const gradient=ctx.createLinearGradient(
        0,0,0,H
    );

    if(alt<12000){

        gradient.addColorStop(
            0,
            "#55a8e6"
        );

        gradient.addColorStop(
            .55,
            "#9ed6f4"
        );

        gradient.addColorStop(
            1,
            "#dcebf1"
        );

    }else if(alt<80000){

        gradient.addColorStop(
            0,
            `rgb(
                ${20*(1-spaceAmount)},
                ${55*(1-spaceAmount)},
                ${90*(1-spaceAmount)}
            )`
        );

        gradient.addColorStop(
            .6,
            `rgb(
                ${45*(1-spaceAmount)},
                ${80*(1-spaceAmount)},
                ${130*(1-spaceAmount)}
            )`
        );

        gradient.addColorStop(
            1,
            "#02040a"
        );

    }else{

        gradient.addColorStop(
            0,
            "#000"
        );

        gradient.addColorStop(
            1,
            "#030711"
        );
    }

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);

    if(spaceAmount>.05){
        drawStars(spaceAmount);
    }

    return atmosphere;
}


/* ============================================================
   TERRA
============================================================ */

function drawEarth(){

    if(mission.altitude<12000)return;

    const alt=mission.altitude;

    const progress=Math.min(
        1,
        Math.log10(
            Math.max(
                alt,
                12000
            )/12000
        )/2
    );

    const radius=
        Math.max(
            H*.65,
            H*1.8-progress*H
        );

    const earthX=W*.5;
    const earthY=H+radius*.62;

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        earthX,
        earthY,
        radius,
        Math.PI,
        Math.PI*2
    );

    ctx.clip();

    const ocean=ctx.createRadialGradient(
        earthX-radius*.3,
        earthY-radius*.6,
        radius*.1,
        earthX,
        earthY,
        radius
    );

    ocean.addColorStop(
        0,
        "#1d8ed5"
    );

    ocean.addColorStop(
        .6,
        "#075189"
    );

    ocean.addColorStop(
        1,
        "#031b35"
    );

    ctx.fillStyle=ocean;

    ctx.fillRect(
        earthX-radius,
        earthY-radius,
        radius*2,
        radius*2
    );

    /* Nuvens */

    ctx.globalAlpha=.35;
    ctx.fillStyle="white";

    for(let i=0;i<18;i++){

        const x=
            earthX+
            Math.sin(i*17.3)*
            radius*.7;

        const y=
            earthY-radius*.45+
            Math.cos(i*5.1)*
            radius*.2;

        ctx.beginPath();

        ctx.ellipse(
            x,
            y,
            radius*.12,
            radius*.025,
            i,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.restore();

    /* Brilho atmosférico */

    ctx.beginPath();

    ctx.arc(
        earthX,
        earthY,
        radius,
        Math.PI,
        Math.PI*2
    );

    ctx.strokeStyle=
        "rgba(80,180,255,.8)";

    ctx.lineWidth=3;

    ctx.stroke();
}


/* ============================================================
   LUA
============================================================ */

function drawMoon(){

    if(
        mission.phase!=="moon" &&
        mission.phase!=="landing"
    )return;

    const p=mission.moonApproach;

    const radius=
        25+
        p*Math.min(W,H)*.75;

    const x=
        W*.5+
        Math.sin(
            mission.time*.15
        )*W*.03;

    const y=
        H*.35+
        Math.cos(
            mission.time*.11
        )*H*.02;

    const gradient=
        ctx.createRadialGradient(
            x-radius*.3,
            y-radius*.3,
            radius*.1,
            x,
            y,
            radius
        );

    gradient.addColorStop(
        0,
        "#eeeeea"
    );

    gradient.addColorStop(
        .65,
        "#a7a7a2"
    );

    gradient.addColorStop(
        1,
        "#51514e"
    );

    ctx.fillStyle=gradient;

    ctx.beginPath();

    ctx.arc(
        x,y,radius,
        0,Math.PI*2
    );

    ctx.fill();

    /* Crateras */

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        x,y,radius,
        0,Math.PI*2
    );

    ctx.clip();

    for(let i=0;i<30;i++){

        const angle=i*2.3;
        const distance=
            radius*.75*
            ((i%7)/7);

        const cx=
            x+
            Math.cos(angle)*distance;

        const cy=
            y+
            Math.sin(angle)*distance;

        const r=
            radius*
            (.015+
            (i%5)*.012);

        ctx.fillStyle=
            "rgba(60,60,60,.25)";

        ctx.beginPath();

        ctx.arc(
            cx,cy,r,
            0,Math.PI*2
        );

        ctx.fill();
    }

    ctx.restore();
}


/* ============================================================
   SUPERFÍCIE LUNAR
============================================================ */

function drawLunarSurface(){

    if(mission.phase!=="landing")return;

    const approach=mission.moonApproach;

    if(approach<.85)return;

    const horizon=
        H*(.65+
        (1-approach)*.2);

    const grad=
        ctx.createLinearGradient(
            0,horizon,0,H
        );

    grad.addColorStop(
        0,
        "#85847f"
    );

    grad.addColorStop(
        1,
        "#20201e"
    );

    ctx.fillStyle=grad;

    ctx.beginPath();

    ctx.moveTo(0,horizon);

    for(let x=0;x<=W;x+=20){

        const y=
            horizon+
            Math.sin(
                x*.03+
                mission.time*.4
            )*12+
            Math.sin(x*.011)*18;

        ctx.lineTo(x,y);
    }

    ctx.lineTo(W,H);
    ctx.lineTo(0,H);

    ctx.fill();

    /* Crateras */

    for(let i=0;i<12;i++){

        const x=
            (i*139)%W;

        const y=
            horizon+
            30+
            (i%5)*45;

        ctx.strokeStyle=
            "rgba(0,0,0,.25)";

        ctx.lineWidth=8;

        ctx.beginPath();

        ctx.ellipse(
            x,y,
            35+(i%4)*15,
            10+(i%3)*5,
            0,0,Math.PI*2
        );

        ctx.stroke();
    }
}


/* ============================================================
   JANELLA DA CABINE
============================================================ */

function drawWindow(){

    ctx.save();

    ctx.fillStyle="#07090d";

    ctx.fillRect(
        0,0,W,H
    );

    const frame=
        Math.min(W,H)*.08;

    ctx.save();

    ctx.beginPath();

    ctx.roundRect(
        frame,
        frame*.35,
        W-frame*2,
        H*.68,
        35
    );

    ctx.clip();

    drawAtmosphere();
    drawEarth();
    drawMoon();
    drawLunarSurface();

    ctx.restore();

    /* Moldura metálica */

    ctx.strokeStyle="#2d343b";
    ctx.lineWidth=frame*.6;

    ctx.beginPath();

    ctx.roundRect(
        frame,
        frame*.35,
        W-frame*2,
        H*.68,
        35
    );

    ctx.stroke();

    ctx.strokeStyle=
        "rgba(255,255,255,.15)";

    ctx.lineWidth=2;

    ctx.stroke();
}


/* ============================================================
   CABINE
============================================================ */

function drawCabin(){

    const cockpitTop=H*.7;

    /* Estrutura inferior */

    const bodyGradient=
        ctx.createLinearGradient(
            0,cockpitTop,0,H
        );

    bodyGradient.addColorStop(
        0,
        "#1c2229"
    );

    bodyGradient.addColorStop(
        1,
        "#050607"
    );

    ctx.fillStyle=bodyGradient;

    ctx.fillRect(
        0,cockpitTop,W,H-cockpitTop
    );

    /* Painel principal */

    const panelY=H*.76;

    ctx.fillStyle="#11171d";

    ctx.beginPath();

    ctx.moveTo(W*.05,H);
    ctx.lineTo(W*.16,panelY);
    ctx.lineTo(W*.84,panelY);
    ctx.lineTo(W*.95,H);

    ctx.fill();

    /* Monitores */

    drawMonitor(
        W*.12,
        H*.79,
        W*.18,
        H*.14,
        "ALT"
    );

    drawMonitor(
        W*.37,
        H*.78,
        W*.26,
        H*.16,
        "NAV"
    );

    drawMonitor(
        W*.70,
        H*.79,
        W*.18,
        H*.14,
        "FUEL"
    );

    /* Botão principal integrado */

    const bx=W*.5;
    const by=H*.94;

    const radius=
        Math.min(W,H)*.055;

    const active=
        mission.phase==="platform";

    const gradient=
        ctx.createRadialGradient(
            bx-radius*.3,
            by-radius*.3,
            radius*.1,
            bx,by,radius
        );

    if(active){
        gradient.addColorStop(
            0,
            "#ff7960"
        );
        gradient.addColorStop(
            1,
            "#65130d"
        );
    }else{
        gradient.addColorStop(
            0,
            "#6b7379"
        );
        gradient.addColorStop(
            1,
            "#171a1d"
        );
    }

    ctx.fillStyle=gradient;

    ctx.beginPath();

    ctx.arc(
        bx,by,radius,
        0,Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle=
        "rgba(255,255,255,.25)";

    ctx.lineWidth=2;

    ctx.stroke();

    ctx.fillStyle="white";

    ctx.font=
        `bold ${Math.max(9,radius*.28)}px Arial`;

    ctx.textAlign="center";

    ctx.fillText(
        active?"IGNIÇÃO":"CONTROLE",
        bx,
        by+4
    );

    /* Pequenas luzes */

    for(let i=0;i<16;i++){

        const x=
            W*.08+i*W*.055;

        const y=H*.745;

        const pulse=
            Math.sin(
                mission.time*4+i
            )>.3;

        ctx.fillStyle=
            pulse?
            "#42ff91":
            "#26382e";

        ctx.beginPath();

        ctx.arc(
            x,y,3,
            0,Math.PI*2
        );

        ctx.fill();
    }
}


/* ============================================================
   MONITORES
============================================================ */

function drawMonitor(x,y,w,h,type){

    ctx.save();

    ctx.fillStyle="#05090c";

    ctx.fillRect(
        x,y,w,h
    );

    ctx.strokeStyle="#45515a";
    ctx.lineWidth=3;

    ctx.strokeRect(
        x,y,w,h
    );

    ctx.fillStyle="#77f7c2";

    ctx.font=
        `${Math.max(9,w*.1)}px monospace`;

    ctx.textAlign="left";

    if(type==="ALT"){

        ctx.fillText(
            "ALTITUDE",
            x+10,y+18
        );

        ctx.font=
            `bold ${Math.max(12,w*.13)}px monospace`;

        ctx.fillText(
            Math.round(
                mission.altitude
            ).toLocaleString()+" m",
            x+10,y+h*.65
        );
    }

    if(type==="NAV"){

        ctx.fillText(
            "TRAJETÓRIA",
            x+10,y+18
        );

        ctx.strokeStyle=
            "rgba(100,255,200,.5)";

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.moveTo(
            x+10,y+h*.75
        );

        for(let i=0;i<w-20;i+=4){

            const progress=i/(w-20);

            const curve=
                Math.sin(
                    progress*Math.PI
                )*h*.35;

            ctx.lineTo(
                x+10+i,
                y+h*.75-curve
            );
        }

        ctx.stroke();

        ctx.fillStyle="#fff";

        ctx.beginPath();

        ctx.arc(
            x+w*.72,
            y+h*.4,
            4,
            0,Math.PI*2
        );

        ctx.fill();
    }

    if(type==="FUEL"){

        ctx.fillText(
            "COMBUSTÍVEL",
            x+8,y+18
        );

        ctx.strokeStyle=
            "#334048";

        ctx.strokeRect(
            x+10,y+h*.42,
            w-20,h*.28
        );

        ctx.fillStyle=
            mission.fuel>30?
            "#50f0a0":
            "#ff574d";

        ctx.fillRect(
            x+10,
            y+h*.42,
            (w-20)*(mission.fuel/100),
            h*.28
        );
    }

    ctx.restore();
}


/* ============================================================
   EFEITO DE VIBRAÇÃO
============================================================ */

function applyShake(){

    if(mission.shake<=0)return;

    const power=mission.shake;

    ctx.translate(
        (Math.random()-.5)*power,
        (Math.random()-.5)*power
    );
}


/* ============================================================
   EFEITOS DO LANÇAMENTO
============================================================ */

function drawLaunchEffects(){

    if(
        mission.phase!=="launch" &&
        mission.phase!=="ascent"
    )return;

    const altFactor=
        Math.max(
            0,
            1-mission.altitude/30000
        );

    if(altFactor<=0)return;

    ctx.save();

    ctx.globalAlpha=
        altFactor*.3;

    for(let i=0;i<30;i++){

        const x=
            Math.random()*W;

        const y=
            H*.4+
            Math.random()*H*.5;

        const size=
            20+
            Math.random()*100;

        ctx.fillStyle=
            "rgba(255,255,255,.3)";

        ctx.beginPath();

        ctx.arc(
            x,y,size,
            0,Math.PI*2
        );

        ctx.fill();
    }

    ctx.restore();
}


/* ============================================================
   ATUALIZAÇÃO DA FÍSICA
============================================================ */

function updatePhysics(dt){

    if(!mission.running)return;

    mission.time+=dt;

    if(mission.phase==="platform"){
        mission.enginePower=.02;
    }


    /* IGNIÇÃO */

    if(mission.phase==="ignition"){

        mission.enginePower+=dt*.25;

        mission.shake=
            mission.enginePower*12;

        if(mission.enginePower>=1){

            mission.phase="launch";

            mission.message=
                "DECOLAGEM CONFIRMADA";
        }
    }


    /* LANÇAMENTO */

    if(
        mission.phase==="launch" ||
        mission.phase==="ascent"
    ){

        mission.throttle=1;

        const gravity=
            9.81*
            Math.pow(
                6371000/
                (6371000+
                mission.altitude),
                2
            );

        const thrust=
            30*
            mission.enginePower;

        mission.acceleration=
            thrust-gravity;

        mission.velocity+=
            mission.acceleration*dt;

        mission.altitude+=
            Math.max(
                0,
                mission.velocity*dt
            );

        mission.fuel-=
            dt*.12;

        mission.shake=
            Math.max(
                1,
                9-mission.altitude/10000
            );

        if(
            mission.altitude>10000 &&
            mission.phase==="launch"
        ){

            mission.phase="ascent";

            mission.message=
                "ATRAVESSANDO A ATMOSFERA";
        }

        if(mission.altitude>120000){

            mission.phase="space";

            mission.velocity=7800;

            mission.enginePower=.05;

            mission.shake=0;

            mission.message=
                "ÓRBITA ALCANÇADA";
        }
    }


    /* ESPAÇO */

    if(mission.phase==="space"){

        mission.distanceToMoon-=
            dt*18000;

        if(
            mission.distanceToMoon<150000
        ){

            mission.phase="moon";

            mission.message=
                "TRAJETÓRIA LUNAR CONFIRMADA";
        }
    }


    /* APROXIMAÇÃO */

    if(mission.phase==="moon"){

        mission.distanceToMoon-=
            dt*14000;

        mission.moonApproach=
            Math.min(
                1,
                mission.moonApproach+
                dt*.018
            );

        if(
            mission.moonApproach>.92
        ){

            mission.phase="landing";

            mission.message=
                "INICIANDO DESCIDA LUNAR";
        }
    }


    /* POUSO */

    if(mission.phase==="landing"){

        mission.enginePower=
            .3+
            Math.sin(
                mission.time
            )*.05;

        mission.moonApproach=
            Math.min(
                1,
                mission.moonApproach+
                dt*.005
            );

        if(
            mission.moonApproach>=1
        ){

            mission.message=
                "POUSO REALIZADO";
        }
    }


    mission.fuel=
        Math.max(
            0,
            mission.fuel
        );

    updateAudio();
}


/* ============================================================
   RENDERIZAÇÃO
============================================================ */

function render(){

    ctx.save();

    applyShake();

    drawWindow();

    drawLaunchEffects();

    drawCabin();

    ctx.restore();

    requestAnimationFrame(render);
}


/* ============================================================
   LOOP DE FÍSICA
============================================================ */

let previous=performance.now();

function loop(now){

    const dt=Math.min(
        .05,
        (now-previous)/1000
    );

    previous=now;

    updatePhysics(dt);

    requestAnimationFrame(loop);
}


/* ============================================================
   CONTROLES
============================================================ */

document
.getElementById("startButton")
.addEventListener(
    "click",
    ()=>{
        startMission();
    }
);


canvas.addEventListener(
    "pointerdown",
    e=>{

        if(!mission.running)return;

        const rect=
            canvas.getBoundingClientRect();

        const x=e.clientX-rect.left;
        const y=e.clientY-rect.top;

        const bx=W*.5;
        const by=H*.94;

        const distance=
            Math.hypot(
                x-bx,
                y-by
            );

        if(
            distance<
            Math.min(W,H)*.09
        ){

            if(
                mission.phase==="platform"
            ){

                beginLaunch();
            }
        }
    }
);


function startMission(){

    mission.running=true;

    document
        .getElementById("startScreen")
        .classList
        .add("hidden");

    startAudio();

    mission.message=
        "AGUARDANDO IGNIÇÃO";
}


function beginLaunch(){

    if(
        mission.phase!=="platform"
    )return;

    mission.phase="ignition";

    mission.enginePower=.05;

    mission.message=
        "IGNIÇÃO DOS MOTORES";
}


/* ============================================================
   INÍCIO
============================================================ */

requestAnimationFrame(render);
requestAnimationFrame(loop);

</script>

</body>
</html>
